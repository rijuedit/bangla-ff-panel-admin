<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANGLA FF PANEL - FREE BYPASS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: #05020a; color: #ffffff; min-height: 100vh; padding-bottom: 40px;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(157, 0, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 102, 0.08) 0%, transparent 40%);
        }
        .navbar {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 5%;
            background: rgba(10, 5, 18, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #1a0b2e;
            position: sticky; top: 0; z-index: 100;
        }
        .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-logo img { width: 38px; height: 38px; border-radius: 8px; border: 1px solid #9d00ff; object-fit: cover; }
        .brand-text h1 { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.2; }
        .brand-text span { font-size: 10px; color: #ff0066; letter-spacing: 1.5px; font-weight: 600; display: block; }

        .nav-actions { display: flex; align-items: center; gap: 12px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.05); color: #ccc; text-decoration: none;
            padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1); display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.3s ease;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .nav-btn.discord-btn { background: rgba(88, 101, 242, 0.15); border-color: rgba(88, 101, 242, 0.4); color: #5865F2; }

        .main-container { max-width: 850px; margin: 25px auto; padding: 0 20px; }
        .btn-back {
            display: inline-flex; align-items: center; gap: 8px; background: #11071a; color: #ccc;
            text-decoration: none; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600;
            border: 1px solid #2a113d; margin-bottom: 20px; transition: all 0.3s ease;
        }
        .btn-back:hover { background: #1a0b2b; color: #fff; border-color: #9d00ff; }

        .video-box {
            position: relative; width: 100%; height: 420px; background: #0d0614;
            border: 1px solid #2a113d; border-radius: 12px; overflow: hidden;
            display: flex; align-items: center; justify-content: center; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .yt-card {
            width: 100%; height: 100%; background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative;
        }
        .yt-card::before { content: ''; position: absolute; inset: 0; background: rgba(5, 2, 10, 0.4); }
        .play-btn-circle {
            width: 70px; height: 70px; background: rgba(255, 0, 102, 0.9); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; z-index: 2;
            box-shadow: 0 0 25px rgba(255, 0, 102, 0.8); transition: all 0.3s ease; padding-left: 4px;
        }
        .video-iframe { width: 100%; height: 100%; border: none; }
        .video-placeholder { display: flex; flex-direction: column; align-items: center; color: #554866; gap: 12px; }

        .title-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; width: 100%; }
        .section-title { font-size: 24px; font-weight: 800; color: #ffffff; text-transform: uppercase; margin-bottom: 4px; }
        .section-subtitle { color: #77688a; font-size: 13px; text-transform: uppercase; margin: 0; }

        .skip-btn {
            background: transparent; color: #00cc66; border: 1px solid #00cc66;
            padding: 8px 18px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 204, 102, 0.2); margin-top: 2px;
        }
        .skip-btn:hover { background: #00cc66; color: #05020a; box-shadow: 0 0 20px rgba(0, 204, 102, 0.6); }

        .rar-box { background: rgba(255, 153, 0, 0.04); border: 1px solid rgba(255, 153, 0, 0.3); border-radius: 8px; padding: 15px 20px; margin-bottom: 25px; }
        .rar-header { color: #ff9900; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; text-transform: uppercase; }
        .rar-body { display: flex; justify-content: space-between; align-items: center; }
        .rar-pass-val { font-size: 16px; font-weight: 700; color: #ffffff; }
        .btn-copy { background: transparent; border: 1px solid #ff9900; color: #ff9900; padding: 6px 14px; border-radius: 5px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

        .items-container { display: flex; flex-direction: column; gap: 12px; }
        .item-card { background: #11071a; border: 1px solid #2a113d; border-radius: 10px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        .item-card:hover { border-color: #9d00ff; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(157, 0, 255, 0.15); }
        .item-left { display: flex; align-items: center; gap: 15px; }
        .item-icon { width: 44px; height: 44px; background: rgba(157, 0, 255, 0.1); border: 1px solid rgba(157, 0, 255, 0.3); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #9d00ff; font-size: 18px; }
        .badge-latest { background: #ff0066; color: #fff; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 4px; }
        .btn-download { background: linear-gradient(135deg, #9d00ff 0%, #ff0066 100%); color: #fff; text-decoration: none; padding: 9px 20px; border-radius: 6px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }

        .empty-state { background: #11071a; border: 1px dashed #2a113d; border-radius: 10px; padding: 40px; text-align: center; color: #66557a; font-size: 14px; }

        @media (max-width: 600px) { .video-box { height: 230px; } }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="brand-logo">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <div class="brand-text"><h1>BANGLA FF PANEL</h1><span>PREMIUM CORP</span></div>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
            <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="nav-btn discord-btn dynamic-discord"><i class="fab fa-discord"></i> Discord</a>
        </div>
    </header>

    <main class="main-container">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back</a>

        <div class="video-box">
            <a href="#" id="ytCard" target="_blank" class="yt-card" style="display: none;">
                <div class="play-btn-circle"><i class="fas fa-play"></i></div>
            </a>
            <iframe id="videoIframe" class="video-iframe" style="display: none;" allow="autoplay"></iframe>
            <div id="videoPlaceholder" class="video-placeholder">
                <i class="fas fa-play-circle" style="font-size: 48px;"></i>
                <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.5px;">NO VIDEO AVAILABLE</span>
            </div>
        </div>

        <div class="title-row">
            <div>
                <h2 class="section-title">FREE BYPASS</h2>
                <p class="section-subtitle">SAFE & ANTI-BAN BYPASS FOR PC</p>
            </div>
            <a href="#" id="skipBtn" target="_blank" class="skip-btn" style="display: none;">
                <i class="fas fa-question-circle"></i> HOW TO SKIP
            </a>
        </div>

        <div class="rar-box">
            <div class="rar-header"><i class="fas fa-lock"></i> RAR PASSWORD</div>
            <div class="rar-body">
                <span id="rarPasswordVal" class="rar-pass-val">1</span>
                <button class="btn-copy" id="copyPassBtn" onclick="copyPassword()"><i class="fas fa-copy"></i> Copy</button>
            </div>
        </div>

        <div id="itemsContainer" class="items-container">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p style="margin-top:8px;">Loading Bypass Data...</p></div>
        </div>
    </main>

    <script>
        const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function getYoutubeId(url) {
            if (!url) return null;
            if (url.includes('youtube.com/shorts/')) return url.split('shorts/')[1].split('?')[0];
            if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split('?')[0];
            if (url.includes('youtube.com/watch')) return url.split('v=')[1].split('&')[0];
            if (url.includes('youtube.com/embed/')) return url.split('embed/')[1].split('?')[0];
            return null;
        }

        function handleVideo(vUrl, vEnabled) {
            const ytCard = document.getElementById('ytCard');
            const iframe = document.getElementById('videoIframe');
            const placeholder = document.getElementById('videoPlaceholder');
            ytCard.style.display = 'none'; iframe.style.display = 'none'; placeholder.style.display = 'flex';

            if (!vEnabled || !vUrl) return;

            const ytId = getYoutubeId(vUrl);
            if (ytId) {
                ytCard.href = vUrl;
                ytCard.style.backgroundImage = `url('https://img.youtube.com/vi/${ytId}/hqdefault.jpg')`;
                ytCard.style.display = 'flex'; placeholder.style.display = 'none';
            } else if (vUrl.includes('drive.google.com')) {
                iframe.src = vUrl.replace(/\/view(\?.*)?$/, '/preview');
                iframe.style.display = 'block'; placeholder.style.display = 'none';
            }
        }

        function applySettings(data) {
            if (!data) return;
            handleVideo(data.video_url, data.video_enabled);
            document.getElementById('rarPasswordVal').innerText = data.rar_password || '1';
            
            const skipBtn = document.getElementById('skipBtn');
            const skipUrl = data.how_to_skip || data.skip_url || '';
            const skipEnabled = data.skip_enabled !== false;

            if (skipEnabled && skipUrl && skipUrl.trim() !== '') {
                skipBtn.href = skipUrl; skipBtn.style.display = 'inline-flex';
            } else {
                skipBtn.style.display = 'none';
            }
        }

        db.ref('page_settings/free_bypass').on('value', (s) => { if (s.exists()) applySettings(s.val()); });
        db.ref('page_settings/free-bypass').on('value', (s) => { if (s.exists()) applySettings(s.val()); });

        db.ref('free_bypass').on('value', (snapshot) => {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            if (!snapshot.exists() || !snapshot.val()) {
                container.innerHTML = `<div class="empty-state"><p>No Free Bypass Available</p></div>`;
                return;
            }
            const items = [];
            snapshot.forEach((child) => { items.push({ id: child.key, ...child.val() }); });
            items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-left">
                        <div class="item-icon"><i class="fas fa-bolt"></i></div>
                        <div>
                            <div style="font-weight: 700; color:#fff;">${item.title || 'Free Bypass'} ${index === 0 ? '<span class="badge-latest">LATEST</span>' : ''}</div>
                            <div style="font-size: 12px; color: #77688a;">OB55 Bypass Safe Version</div>
                        </div>
                    </div>
                    <a href="${item.download || '#'}" target="_blank" class="btn-download"><i class="fas fa-download"></i> Download</a>
                `;
                container.appendChild(card);
            });
        });

        function copyPassword() {
            const passText = document.getElementById('rarPasswordVal').innerText;
            navigator.clipboard.writeText(passText).then(() => {
                const btn = document.getElementById('copyPassBtn');
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!'; btn.style.color = '#00cc66';
                setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy"></i> Copy'; btn.style.color = '#ff9900'; }, 2000);
            });
        }

        db.ref('global_settings/discord_link').on('value', (s) => {
            if (s.val()) document.querySelectorAll('.dynamic-discord').forEach(el => el.href = s.val());
        });
    </script>
</body>
</html>
