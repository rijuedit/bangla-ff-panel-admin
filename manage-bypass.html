<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Free Bypass - BANGLA FF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; cursor: default; }
        body { background-color: #05020a; color: #fff; padding: 30px; min-height: 100vh; }
        
        #mouse-glow {
            position: fixed; width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0, 204, 102, 0.4); filter: blur(20px);
            pointer-events: none; transform: translate(-50%, -50%); z-index: 9999;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 1px solid #2a113d; padding-bottom: 15px;
        }
        .header h1 { font-size: 26px; }
        .header h1 span { color: #00cc66; }
        .back-btn {
            background: #11071a; color: #fff; text-decoration: none; padding: 10px 20px;
            border: 1px solid #2a113d; border-radius: 8px; font-weight: 600; transition: 0.3s;
        }
        .back-btn:hover { background: #00cc66; color: #000; border-color: #00cc66; }

        .section-title { font-size: 20px; color: #fff; margin-bottom: 15px; border-left: 3px solid #00cc66; padding-left: 10px; }

        .form-container {
            background: #11071a; border: 1px solid #2a113d; padding: 25px;
            border-radius: 12px; margin-bottom: 40px;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group.full { grid-column: 1 / -1; }
        .input-group label {
            font-size: 15px; color: #00cc66; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center;
        }
        .input-group input {
            background: #05020a; border: 1px solid #2a113d; color: #fff;
            padding: 12px; border-radius: 8px; outline: none; font-size: 15px; cursor: text;
        }
        .input-group input:focus { border-color: #00cc66; }

        .submit-btn {
            background: #00cc66; color: #000; border: none; padding: 14px;
            border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
            width: 100%; margin-top: 20px; transition: 0.3s;
        }
        .submit-btn:hover { background: #00994d; color: #fff; transform: translateY(-2px); }
        .btn-update { background: #9d00ff; color: #fff; }
        .btn-update:hover { background: #7a00cc; }
        .cancel-btn { background: #333; color: #fff; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; display: none; font-weight: 600; }

        .item-list { display: flex; flex-direction: column; gap: 15px; }
        .item-card {
            background: #11071a; border: 1px solid #2a113d; padding: 15px 20px;
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .item-info h3 { font-size: 18px; color: #fff; margin-bottom: 5px; }
        .item-info p { font-size: 13px; color: #aaa; }
        .item-actions { display: flex; gap: 10px; }
        .btn-edit { background: #e6b800; color: #000; padding: 8px 15px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
        .btn-delete { background: #ff0033; color: white; padding: 8px 15px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div id="mouse-glow"></div>

    <div class="header">
        <h1>Manage <span style="color:#00cc66;">Free Bypass</span></h1>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <!-- 1. PAGE SETTINGS (Global Video, Skip Link, Password) -->
    <h2 class="section-title">Page Top Settings (Global)</h2>
    <div class="form-container">
        <form id="settingsForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>Main YouTube Video Link (Leave empty to hide)</label>
                    <input type="url" id="global_yt" placeholder="https://youtube.com/...">
                </div>
                <div class="input-group">
                    <label>How To Skip Link (Leave empty to hide)</label>
                    <input type="url" id="global_skip" placeholder="https://link.com/skip">
                </div>
                <div class="input-group full">
                    <label>RAR Password (Leave empty to hide)</label>
                    <input type="text" id="global_pass" placeholder="e.g. BYPASS2024">
                </div>
            </div>
            <button type="submit" id="settingsBtn" class="submit-btn btn-update"><i class="fas fa-save"></i> Update Page Settings</button>
        </form>
    </div>

    <!-- 2. ADD NEW PRODUCT/ITEM -->
    <h2 class="section-title">Add Downloadable Items</h2>
    <div class="form-container">
        <form id="addForm">
            <input type="hidden" id="edit_id">
            <div class="form-grid">
                <div class="input-group">
                    <label>Item Name</label>
                    <input type="text" id="title" placeholder="e.g. Anti-Ban Bypass V2" required>
                </div>
                <div class="input-group">
                    <label>Button Text</label>
                    <input type="text" id="btn_text" placeholder="e.g. Download" value="Download" required>
                </div>
                <div class="input-group full">
                    <label>Download Link</label>
                    <input type="url" id="download" placeholder="Download Link" required>
                </div>
            </div>
            <button type="submit" id="submitBtn" class="submit-btn"><i class="fas fa-plus"></i> Add Bypass Item</button>
            <button type="button" id="cancelBtn" class="cancel-btn" onclick="cancelEdit()">Cancel Edit</button>
        </form>
    </div>

    <!-- 3. ITEMS LIST -->
    <h2 class="section-title">Bypass Items List</h2>
    <div class="item-list" id="itemList">
        <div style="text-align: center; color: #555; padding: 20px;">No items added yet</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('mouse-glow');
            glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px';
        });

        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = 'index.html'; });

        // Load Global Page Settings
        onValue(ref(db, 'page_settings/free_bypass'), (snapshot) => {
            if(snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('global_yt').value = data.yt_link || '';
                document.getElementById('global_skip').value = data.skip_link || '';
                document.getElementById('global_pass').value = data.rar_password || '';
            }
        });

        // Save Global Page Settings
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('settingsBtn');
            btn.innerHTML = 'Updating...';
            const data = {
                yt_link: document.getElementById('global_yt').value.trim(),
                skip_link: document.getElementById('global_skip').value.trim(),
                rar_password: document.getElementById('global_pass').value.trim()
            };
            await update(ref(db, 'page_settings/free_bypass'), data);
            btn.innerHTML = '<i class="fas fa-check"></i> Updated Successfully';
            setTimeout(() => btn.innerHTML = '<i class="fas fa-save"></i> Update Page Settings', 2000);
        });

        // Add / Update Individual Items
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const editId = document.getElementById('edit_id').value;
            btn.innerHTML = 'Saving...';

            const data = {
                title: document.getElementById('title').value.trim(),
                btn_text: document.getElementById('btn_text').value.trim() || 'Download',
                download: document.getElementById('download').value.trim()
            };

            if (editId) {
                await update(ref(db, `free_bypass/${editId}`), data);
            } else {
                data.timestamp = Date.now();
                await set(push(ref(db, 'free_bypass')), data);
            }
            cancelEdit();
        });

        // Load Items List
        onValue(ref(db, 'free_bypass'), (snapshot) => {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            if (!snapshot.exists()) {
                list.innerHTML = '<div style="text-align: center; color: #555; padding: 20px;">No items added yet</div>';
                return;
            }
            snapshot.forEach((child) => {
                const item = child.val();
                const key = child.key;
                list.innerHTML += `
                    <div class="item-card">
                        <div class="item-info">
                            <h3>${item.title}</h3>
                            <p>Button: <b>${item.btn_text || 'Download'}</b> | Link: ${item.download}</p>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" onclick='editItem(${JSON.stringify(key)}, ${JSON.stringify(item)})'>Edit</button>
                            <button class="btn-delete" onclick="deleteItem('${key}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        });

        window.editItem = (id, item) => {
            document.getElementById('edit_id').value = id;
            document.getElementById('title').value = item.title || '';
            document.getElementById('btn_text').value = item.btn_text || 'Download';
            document.getElementById('download').value = item.download || '';
            
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Bypass Item';
            document.getElementById('submitBtn').style.background = '#e6b800';
            document.getElementById('submitBtn').style.color = '#000';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({ top: 500, behavior: 'smooth' });
        };

        window.cancelEdit = () => {
            document.getElementById('addForm').reset();
            document.getElementById('edit_id').value = '';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-plus"></i> Add Bypass Item';
            document.getElementById('submitBtn').style.background = '#00cc66';
            document.getElementById('submitBtn').style.color = '#000';
            document.getElementById('cancelBtn').style.display = 'none';
        };

        window.deleteItem = (key) => {
            if (confirm('Delete this item?')) remove(ref(db, `free_bypass/${key}`));
        };
    </script>
</body>
</html>
