<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Error Fix</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#05020a;--card:#11071a;--border:#2a113d;--pink:#ff0066;--purple:#9d00ff;--gray:#b0b0b0;--green:#00cc66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
header{padding:20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
header h2{margin:0;color:var(--pink)}
button{border:0;padding:11px 16px;border-radius:8px;background:linear-gradient(90deg,var(--pink),var(--purple));color:white;font-weight:bold;cursor:pointer}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat,.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:17px}
.stat small{color:var(--gray)}.stat h2{margin:8px 0 0;color:var(--pink)}
.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
input,textarea{width:100%;padding:12px;background:#09040f;border:1px solid var(--border);border-radius:8px;color:white;outline:none}
#search{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.item h3{color:var(--pink);margin:10px 0}
.item p{color:var(--gray);font-size:14px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.actions button{padding:8px 11px}.delete{background:#a50035}.toggle{background:#333}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:5;overflow:auto;padding:20px}
.modalbox{max-width:550px;margin:25px auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
.modalbox h2{color:var(--pink)}
.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:var(--gray)}
.check{display:flex;gap:9px;align-items:center;margin:14px 0}.check input{width:auto}
.close{float:right;background:#333}
.status{color:var(--green);font-size:12px}
@media(max-width:500px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h2><i class="fa-solid fa-screwdriver-wrench"></i> Error Fix Manager</h2>
<button onclick="location.href='index.html'">Dashboard</button>
</header>

<div class="container">
<div class="stats">
<div class="stat"><small>Total Boxes</small><h2 id="total">0</h2></div>
<div class="stat"><small>Visible Boxes</small><h2 id="visible">0</h2></div>
<div class="stat"><small>Hidden Boxes</small><h2 id="hidden">0</h2></div>
</div>

<div class="toolbar">
<input id="search" placeholder="Search boxes..." oninput="render()">
<button onclick="openModal()"><i class="fa fa-plus"></i> Add New Box</button>
</div>
<div class="grid" id="cards"></div>
</div>

<div class="modal" id="modal">
<div class="modalbox">
<button class="close" onclick="closeModal()">Close</button>
<h2 id="modalTitle">Add Error Fix Box</h2>
<form id="boxForm">
<input type="hidden" id="editId">
<div class="field"><label>Box Title *</label><input id="title" required placeholder="Example: Fix Login Error"></div>
<div class="field"><label>Description</label><textarea id="description" rows="3" placeholder="Write details..."></textarea></div>
<div class="field"><label>Icon Class / Image URL</label><input id="icon" placeholder="fa-solid fa-wrench"></div>
<div class="field"><label>Status Text</label><input id="statusText" placeholder="Working / Updated"></div>
<div class="field"><label>Download Link *</label><input id="downloadUrl" type="url" required placeholder="https://..."></div>
<div class="field"><label>Button Text</label><input id="buttonText" value="Download Now"></div>
<div class="field"><label>Tutorial Video URL (Optional)</label><input id="videoUrl" placeholder="YouTube or Google Drive link"></div>
<div class="check"><input type="checkbox" id="videoEnabled" checked><label for="videoEnabled">Show tutorial video link</label></div>
<div class="check"><input type="checkbox" id="enabled" checked><label for="enabled">Show this box on website</label></div>
<button type="submit" id="saveBtn">Save Box</button>
</form>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue,push,set,update,remove} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
authDomain:"bangla-ff-admin.firebaseapp.com",
databaseURL:"https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"bangla-ff-admin",
storageBucket:"bangla-ff-admin.firebasestorage.app",
messagingSenderId:"295013484465",
appId:"1:295013484465:web:b6bc2a949e239095761f90"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);
const listRef=ref(db,"error_fixes");
let records={};

onAuthStateChanged(auth,user=>{
 if(!user) location.href="login.html";
});

onValue(listRef,snap=>{
 records=snap.val()||{};
 render();
});

window.openModal=(id=null)=>{
 document.getElementById("boxForm").reset();
 document.getElementById("editId").value=id||"";
 document.getElementById("modalTitle").textContent=id?"Edit Error Fix Box":"Add Error Fix Box";
 if(id){
  const x=records[id];
  if(!x)return;
  title.value=x.title||"";
  description.value=x.description||"";
  icon.value=x.icon||"";
  statusText.value=x.status_text||"";
  downloadUrl.value=x.download_url||"";
  buttonText.value=x.button_text||"Download Now";
  videoUrl.value=x.video_url||"";
  videoEnabled.checked=x.video_enabled!==false;
  enabled.checked=x.enabled!==false;
 }
 document.getElementById("modal").style.display="block";
};
window.closeModal=()=>document.getElementById("modal").style.display="none";

window.render=()=>{
 const q=document.getElementById("search").value.toLowerCase();
 const entries=Object.entries(records);
 document.getElementById("total").textContent=entries.length;
 document.getElementById("visible").textContent=entries.filter(([k,v])=>v.enabled!==false).length;
 document.getElementById("hidden").textContent=entries.filter(([k,v])=>v.enabled===false).length;
 document.getElementById("cards").innerHTML="";
 entries.filter(([k,v])=>(v.title||"").toLowerCase().includes(q)).forEach(([id,x])=>{
  const div=document.createElement("div");
  div.className="item";
  const title=document.createElement("h3");title.textContent=x.title||"Untitled";
  const desc=document.createElement("p");desc.textContent=x.description||"No description";
  const status=document.createElement("div");status.className="status";status.textContent=x.enabled===false?"Hidden":"Visible";
  const actions=document.createElement("div");actions.className="actions";
  const edit=document.createElement("button");edit.textContent="Edit";edit.onclick=()=>openModal(id);
  const toggle=document.createElement("button");toggle.className="toggle";toggle.textContent=x.enabled===false?"Show":"Hide";
  toggle.onclick=()=>update(ref(db,"error_fixes/"+id),{enabled:x.enabled===false});
  const del=document.createElement("button");del.className="delete";del.textContent="Delete";
  del.onclick=async()=>{if(confirm("Delete this box?"))await remove(ref(db,"error_fixes/"+id));};
  actions.append(edit,toggle,del);
  div.append(title,desc,status,actions);
  document.getElementById("cards").append(div);
 });
};

document.getElementById("boxForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const id=document.getElementById("editId").value;
 const data={
  title:title.value.trim(),
  description:description.value.trim(),
  icon:icon.value.trim(),
  status_text:statusText.value.trim(),
  download_url:downloadUrl.value.trim(),
  button_text:buttonText.value.trim()||"Download Now",
  video_url:videoUrl.value.trim(),
  video_enabled:videoEnabled.checked,
  enabled:enabled.checked,
  updated_at:Date.now()
 };
 try{
  if(id) await update(ref(db,"error_fixes/"+id),data);
  else {data.timestamp=Date.now();await set(push(listRef),data);}
  closeModal();
 }catch(err){alert("Error: "+err.message);}
});

document.querySelector("header button").addEventListener("contextmenu",async e=>{
 e.preventDefault();await signOut(auth);location.href="login.html";
});
</script>
</body>
</html>
