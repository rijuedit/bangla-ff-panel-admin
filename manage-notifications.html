<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Notifications - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    :root { --bg: #05020a; --card: #11071a; --border: #2a113d; --pink: #ff0066; --purple: #9d00ff; --text: #e2e8f0; --muted: #94a3b8; --mono: 'JetBrains Mono', monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .admin-header { background: rgba(17, 7, 26, 0.9); border-bottom: 2px solid var(--purple); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .back-btn { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; text-decoration: none; }
    .page-title { font-size: 18px; font-weight: 900; color: #fff; text-transform: uppercase; }
    .form-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
    .admin-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    .form-group input, .form-group textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; padding: 14px 16px; border-radius: 10px; font-family: var(--mono); font-size: 14px; outline: none; }
    .btn-save { width: 100%; background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: #10b981; color: #fff; padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: 700; z-index: 1000; opacity: 0; transition: 0.35s; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="header-left">
      <a href="index.html" class="back-btn"><i class='bx bx-arrow-back'></i> Dashboard</a>
      <h2 class="page-title">Manage Site Notifications</h2>
    </div>
  </header>

  <div class="form-container">
    <div class="admin-card">
      <form id="noticeForm">
        <div class="form-group">
          <label><i class='bx bx-heading'></i> Notice Title</label>
          <input type="text" id="titleInput" placeholder="NEW UPDATE OB55 RELEASED!" required>
        </div>
        <div class="form-group">
          <label><i class='bx bx-message-detail'></i> Notice Message</label>
          <textarea id="msgInput" rows="4" placeholder="Type message for users..." required></textarea>
        </div>
        <div class="form-group">
          <label><i class='bx bx-time'></i> Date / Time Label</label>
          <input type="text" id="dateInput" placeholder="Today at 10:00 PM">
        </div>
        <button type="submit" class="btn-save"><i class='bx bx-send'></i> Push Notification</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">🔔 Notification Sent!</div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('site_notification').once('value').then((snap) => {
      const data = snap.val();
      if(data) {
        document.getElementById('titleInput').value = data.title || '';
        document.getElementById('msgInput').value = data.message || '';
        document.getElementById('dateInput').value = data.date || '';
      }
    });

    document.getElementById('noticeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      db.ref('site_notification').set({
        title: document.getElementById('titleInput').value,
        message: document.getElementById('msgInput').value,
        date: document.getElementById('dateInput').value,
        timestamp: Date.now()
      }).then(() => {
        document.getElementById('toast').classList.add('show');
        setTimeout(() => document.getElementById('toast').classList.remove('show'), 3000);
      });
    });
  </script>
</body>
</html>
