<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Emulator - BANGLA FF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; cursor: default; }
        body { background-color: #05020a; color: #fff; padding: 30px; }
        
        #mouse-glow {
            position: fixed; width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 0, 102, 0.4); filter: blur(20px);
            pointer-events: none; transform: translate(-50%, -50%); z-index: 9999;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #2a113d; padding-bottom: 15px; }
        .back-btn { background: #11071a; color: #fff; text-decoration: none; padding: 10px 20px; border: 1px solid #2a113d; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .back-btn:hover { background: #9d00ff; border-color: #9d00ff; }

        .form-container { background: #11071a; border: 1px solid #2a113d; padding: 25px; border-radius: 12px; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 16px; color: #9d00ff; font-weight: 600; }
        .input-group input { background: #05020a; border: 1px solid #2a113d; color: #fff; padding: 12px; border-radius: 8px; outline: none; cursor: text; }
        .input-group input:focus { border-color: #9d00ff; }

        .submit-btn { background: #9d00ff; color: #fff; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; width: 100%; transition: 0.3s; }
        .submit-btn:hover { background: #7a00cc; transform: translateY(-2px); }

        .item-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .item-card { background: #11071a; border: 1px solid #2a113d; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .item-card img { width: 100%; height: 150px; object-fit: contain; background: #05020a; border-radius: 8px; margin-bottom: 10px; padding: 10px;}
        .item-actions { display: flex; gap: 10px; margin-top: 10px; }
        .action-btn { flex: 1; padding: 8px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
        .btn-delete { background: #ff0033; color: white; }
    </style>
</head>
<body>
    <div id="mouse-glow"></div>

    <div class="header">
        <h1>Manage <span style="color:#9d00ff;">Emulator</span></h1>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div class="form-container">
        <form id="addForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>Emulator Name</label>
                    <input type="text" id="title" placeholder="e.g. BlueStacks" required>
                </div>
                <div class="input-group">
                    <label>Version</label>
                    <input type="text" id="version" placeholder="e.g. 5.10" required>
                </div>
                <div class="input-group">
                    <label>Logo/Image URL</label>
                    <input type="url" id="image" placeholder="Image Link" required>
                </div>
                <div class="input-group">
                    <label>Download Link</label>
                    <input type="url" id="download" placeholder="Download Link" required>
                </div>
            </div>
            <!-- Video and Skip link removed intentionally -->
            <button type="submit" class="submit-btn"><i class="fas fa-plus"></i> Add Emulator</button>
        </form>
    </div>

    <div class="item-list" id="itemList"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('mouse-glow');
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        onAuthStateChanged(auth, (user) => { if(!user) window.location.href = "index.html"; });

        // Add Emulator
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = "Adding...";

            const data = {
                title: document.getElementById('title').value,
                version: document.getElementById('version').value,
                image: document.getElementById('image').value,
                download: document.getElementById('download').value,
                timestamp: Date.now()
            };

            const newRef = push(ref(db, 'emulators'));
            await set(newRef, data);
            
            e.target.reset();
            btn.innerHTML = '<i class="fas fa-plus"></i> Add Emulator';
            alert("Added Successfully!");
        });

        // Load Emulators
        onValue(ref(db, 'emulators'), (snapshot) => {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const item = child.val();
                list.innerHTML += `
                    <div class="item-card">
                        <img src="${item.image}" alt="${item.title}">
                        <h3>${item.title}</h3>
                        <p style="color:#9d00ff">Version: ${item.version}</p>
                        <div class="item-actions">
                            <button class="action-btn btn-delete" onclick="deleteItem('${child.key}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        });

        window.deleteItem = (key) => {
            if(confirm("Are you sure you want to delete this emulator?")){
                remove(ref(db, `emulators/${key}`));
            }
        };
    </script>
</body>
</html>
