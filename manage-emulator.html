<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMULATOR - BANGLA FF PANEL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root {
            --bg-deep: #05020a;
            --card-bg: #11071a;
            --border-color: #2a113d;
            --accent-pink: #ff0066;
            --accent-purple: #9d00ff;
            --orange-color: #ffaa00;
            --text-gray: #a0a0a0;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        #mouse-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(157, 0, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Video Section */
        .video-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        .video-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .video-placeholder {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-gray);
            font-size: 18px;
            font-weight: bold;
        }

        /* RAR Pass Box */
        .rar-box {
            background: rgba(255, 170, 0, 0.08);
            border: 1px dashed var(--orange-color);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .rar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--orange-color);
            font-weight: bold;
        }

        .rar-pass {
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 16px;
            letter-spacing: 1px;
            color: #fff;
        }

        .copy-btn {
            background: var(--orange-color);
            color: #000;
            border: none;
            padding: 6px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover { opacity: 0.9; }

        /* Emulator Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .emu-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            transition: 0.3s;
        }

        .emu-card:hover {
            border-color: var(--accent-purple);
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(157, 0, 255, 0.2);
        }

        .live-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 0, 102, 0.15);
            color: var(--accent-pink);
            border: 1px solid var(--accent-pink);
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .emu-icon {
            font-size: 45px;
            color: var(--accent-purple);
            margin-bottom: 15px;
        }

        .emu-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .download-btn {
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple));
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .download-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>

    <div class="container">
        <!-- Video Box -->
        <div class="video-box" id="videoBox">
            <div class="video-placeholder" id="videoPlaceholder">
                Tutorial Video Coming Soon...
            </div>
            <iframe id="videoIframe" src="" style="display: none;" allowfullscreen></iframe>
        </div>

        <!-- RAR Password -->
        <div class="rar-box" id="rarBox" style="display: none;">
            <div class="rar-title">
                <i class="fas fa-key"></i>
                <span>RAR Password:</span>
                <span class="rar-pass" id="rarPassValue">---</span>
            </div>
            <button class="copy-btn" onclick="copyPassword()"><i class="fas fa-copy"></i> Copy</button>
        </div>

        <!-- Emulator Cards Grid -->
        <div class="grid" id="emulatorGrid">
            <!-- Dynamic Items Loaded Here -->
        </div>
    </div>

    <script>
        // Mouse glow follower
        const glow = document.getElementById('mouse-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Convert Link into Embed URL (Supports YouTube & Google Drive)
        function formatEmbedUrl(url) {
            if (!url) return '';
            
            // Google Drive Link
            if (url.includes('drive.google.com')) {
                return url.replace(/\/view(\?.*)?$/, '/preview');
            }

            // YouTube Shorts
            if (url.includes('youtube.com/shorts/')) {
                let id = url.split('shorts/')[1].split('?')[0];
                return 'https://www.youtube.com/embed/' + id;
            }

            // YouTube standard & short link
            if (url.includes('youtu.be/')) {
                let id = url.split('youtu.be/')[1].split('?')[0];
                return 'https://www.youtube.com/embed/' + id;
            }

            if (url.includes('youtube.com/watch')) {
                let parts = url.split('v=');
                if (parts.length > 1) {
                    let id = parts[1].split('&')[0];
                    return 'https://www.youtube.com/embed/' + id;
                }
            }

            return url;
        }

        // Load Settings (Video & Password)
        db.ref('page_settings/emulator').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.yt_link) {
                const embedUrl = formatEmbedUrl(data.yt_link);
                const iframe = document.getElementById('videoIframe');
                const placeholder = document.getElementById('videoPlaceholder');
                
                iframe.src = embedUrl;
                iframe.style.display = 'block';
                placeholder.style.display = 'none';
            }

            if (data && data.rar_password) {
                document.getElementById('rarPassValue').innerText = data.rar_password;
                document.getElementById('rarBox').style.display = 'flex';
            }
        });

        // Copy Password Handler
        function copyPassword() {
            const pass = document.getElementById('rarPassValue').innerText;
            navigator.clipboard.writeText(pass);
            alert("Password copied: " + pass);
        }

        // Load Emulators
        db.ref('emulators').on('value', (snapshot) => {
            const grid = document.getElementById('emulatorGrid');
            grid.innerHTML = '';
            snapshot.forEach((child) => {
                const item = child.val();
                grid.innerHTML += `
                    <div class="emu-card">
                        <span class="live-badge">LIVE</span>
                        <div class="emu-icon"><i class="fas fa-cube"></i></div>
                        <div class="emu-title">${item.title}</div>
                        <a href="${item.download}" target="_blank" class="download-btn"><i class="fas fa-download"></i> Download</a>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
