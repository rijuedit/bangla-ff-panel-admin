<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Emulator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #05020a;
            --card-bg: #0c0514;
            --input-bg: #11071a;
            --border-color: #2a113d;
            --neon-pink: #ff0066;
            --neon-purple: #9d00ff;
            --neon-green: #00cc66;
            --text-gray: #b0b0b0;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            position: fixed;
            padding: 20px;
        }

        .sidebar h2 { color: var(--neon-pink); font-size: 1.2rem; margin-bottom: 30px; text-align: center; }

        .nav-links { list-style: none; padding: 0; }
        .nav-links li { margin-bottom: 15px; }
        .nav-links a {
            color: var(--text-gray);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(157, 0, 255, 0.1);
            color: white;
            border-left: 3px solid var(--neon-purple);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 40px;
            width: calc(100% - 260px);
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Settings Card */
        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .settings-card h3 {
            grid-column: 1 / -1;
            margin: 0 0 10px 0;
            color: var(--neon-purple);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Controls */
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .form-group label { color: var(--text-gray); font-size: 0.9rem; }
        .form-group input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .form-group input:focus { border-color: var(--neon-pink); }

        .btn-save-settings {
            grid-column: 1 / -1;
            background: var(--neon-purple);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-save-settings:hover { background: #7b00cc; }

        /* Add Emulator Form */
        .add-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .btn-add {
            background: var(--neon-pink);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Item Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-name { font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; color: #fff; }

        .btn-delete { background: #dc3545; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>OXI ADMIN</h2>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="manage-pc.html"><i class="fas fa-desktop"></i> Manage PC Panel</a></li>
            <li><a href="manage-mobile.html"><i class="fas fa-mobile-alt"></i> Manage Mobile Panel</a></li>
            <li><a href="manage-free.html"><i class="fas fa-gift"></i> Manage Free Panel</a></li>
            <li><a href="manage-bypass.html"><i class="fas fa-bolt"></i> Manage Free Bypass</a></li>
            <li><a href="manage-emulator.html" class="active"><i class="fas fa-gamepad"></i> Manage Emulator</a></li>
            <li><a href="manage-admins.html"><i class="fas fa-user-shield"></i> Admin Users</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-box">
            <h1>Manage Emulator</h1>
        </div>

        <!-- Global Page Settings (Video & RAR Pass) -->
        <div class="settings-card">
            <h3><i class="fas fa-cog"></i> Emulator Page Settings (Optional)</h3>
            <div class="form-group">
                <label>YouTube Video Link (Optional)</label>
                <input type="text" id="page-yt-link" placeholder="https://youtube.com/watch?v=...">
            </div>
            <div class="form-group">
                <label>RAR Password (Optional)</label>
                <input type="text" id="page-rar-pass" placeholder="e.g. 1">
            </div>
            <button class="btn-save-settings" id="btn-save-settings">Save Page Settings</button>
        </div>

        <!-- Add Emulator Form -->
        <div class="add-card">
            <h3 style="margin-bottom: 20px;">Add New Emulator</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Emulator Name</label>
                    <input type="text" id="emu-name" placeholder="e.g. MSI EMULATOR">
                </div>
                <div class="form-group">
                    <label>Download Link</label>
                    <input type="text" id="emu-link" placeholder="Download URL">
                </div>
            </div>
            <button class="btn-add" id="btn-add">Add Emulator</button>
        </div>

        <!-- Emulator List -->
        <div class="grid" id="emulator-list">
            <!-- Data from Firebase -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Handle Page Settings ---
        const pageYtInput = document.getElementById('page-yt-link');
        const pageRarInput = document.getElementById('page-rar-pass');
        const btnSaveSettings = document.getElementById('btn-save-settings');

        // Load existing settings
        get(ref(db, 'page_settings/emulator')).then(snapshot => {
            if(snapshot.exists()){
                const data = snapshot.val();
                pageYtInput.value = data.yt_link || '';
                pageRarInput.value = data.rar_password || '';
            }
        });

        btnSaveSettings.onclick = () => {
            set(ref(db, 'page_settings/emulator'), {
                yt_link: pageYtInput.value.trim(),
                rar_password: pageRarInput.value.trim()
            }).then(() => alert("Page Settings Updated!"));
        };

        // --- Handle Emulator Items ---
        const emuList = document.getElementById('emulator-list');
        const btnAdd = document.getElementById('btn-add');

        btnAdd.onclick = () => {
            const name = document.getElementById('emu-name').value;
            const link = document.getElementById('emu-link').value;

            if(!name || !link) return alert("Please fill Name and Link!");

            push(ref(db, 'emulators'), {
                title: name,
                download: link,
                timestamp: Date.now()
            }).then(() => {
                alert("Emulator Added!");
                document.getElementById('emu-name').value = '';
                document.getElementById('emu-link').value = '';
            });
        };

        onValue(ref(db, 'emulators'), (snapshot) => {
            emuList.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <span class="item-name"><i class="fas fa-cube" style="color:var(--neon-purple); margin-right:10px;"></i> ${data.title}</span>
                    <button class="btn-delete" onclick="deleteItem('${child.key}')">Delete</button>
                `;
                emuList.appendChild(card);
            });
        });

        window.deleteItem = (key) => {
            if(confirm("Are you sure?")) remove(ref(db, `emulators/${key}`));
        };
    </script>
</body>
</html>
