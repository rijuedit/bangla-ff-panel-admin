<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Emulator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #05020a;
            --card-bg: #0c0514;
            --input-bg: #11071a;
            --border-color: #2a113d;
            --neon-pink: #ff0066;
            --neon-purple: #9d00ff;
            --neon-green: #00cc66;
            --text-gray: #b0b0b0;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            position: fixed;
            padding: 20px;
            z-index: 100;
        }

        .sidebar h2 { color: var(--neon-pink); font-size: 1.2rem; margin-bottom: 30px; text-align: center; font-weight: 800; }

        .nav-links { list-style: none; padding: 0; }
        .nav-links li { margin-bottom: 12px; }
        .nav-links a {
            color: var(--text-gray);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(157, 0, 255, 0.1);
            color: white;
            border-left: 3px solid var(--neon-purple);
        }

        .visit-site {
            margin-top: 20px;
            padding: 12px;
            background: var(--neon-green);
            color: black !important;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            display: block;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 40px;
            width: calc(100% - 260px);
        }

        .header-box { margin-bottom: 30px; }
        .header-box h1 { font-size: 1.8rem; font-weight: 800; }

        /* Settings Card */
        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .settings-card h3 {
            margin: 0 0 20px 0;
            color: var(--neon-purple);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* Form Controls */
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .form-group label { color: var(--text-gray); font-size: 0.9rem; }
        .form-group input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .form-group input:focus { border-color: var(--neon-pink); }

        .btn-save-settings {
            width: 100%;
            background: var(--neon-purple);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Add Emulator Card */
        .add-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .btn-add {
            background: var(--neon-pink);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Table Style */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-gray); font-size: 0.85rem; text-transform: uppercase; }

        .btn-delete {
            background: #dc3545; color: white; border: none;
            padding: 8px 15px; border-radius: 5px; cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>OXI ADMIN</h2>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="manage-pc.html"><i class="fas fa-desktop"></i> Manage PC Panel</a></li>
            <li><a href="manage-mobile.html"><i class="fas fa-mobile-alt"></i> Manage Mobile Panel</a></li>
            <li><a href="manage-free.html"><i class="fas fa-gift"></i> Manage Free Panel</a></li>
            <li><a href="manage-bypass.html"><i class="fas fa-bolt"></i> Manage Free Bypass</a></li>
            <li><a href="manage-emulator.html" class="active"><i class="fas fa-gamepad"></i> Manage Emulator</a></li>
            <li><a href="manage-admins.html"><i class="fas fa-user-shield"></i> Admin Users</a></li>
        </ul>
        <a href="https://rijuedit.github.io/BANGLA-FF-PANEL/index.html" target="_blank" class="visit-site">Visit Site</a>
    </div>

    <div class="main-content">
        <div class="header-box">
            <h1>Manage Emulator</h1>
        </div>

        <!-- Settings Card -->
        <div class="settings-card">
            <h3><i class="fas fa-cog"></i> Emulator Page Settings (Optional)</h3>
            <div class="settings-grid">
                <div class="form-group">
                    <label>YouTube Video Link (Optional)</label>
                    <input type="text" id="page-yt-link" placeholder="https://youtube.com/watch?v=...">
                </div>
                <div class="form-group">
                    <label>RAR Password (Optional)</label>
                    <input type="text" id="page-rar-pass" placeholder="e.g. 1">
                </div>
            </div>
            <button class="btn-save-settings" id="btn-save-settings">Save Page Settings</button>
        </div>

        <!-- Add Card -->
        <div class="add-card">
            <h3 style="margin-bottom: 20px; color: var(--neon-pink);">Add New Emulator</h3>
            <div class="settings-grid">
                <div class="form-group">
                    <label>Emulator Name</label>
                    <input type="text" id="emu-name" placeholder="e.g. MSI EMULATOR">
                </div>
                <div class="form-group">
                    <label>Download Link</label>
                    <input type="text" id="emu-link" placeholder="https://mediafire.com/...">
                </div>
            </div>
            <button class="btn-add" id="btn-add">Add Emulator</button>
        </div>

        <!-- List -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Emulator Name</th>
                        <th>Download Link</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="emu-table-body">
                    <!-- Data -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Save Page Settings ---
        const btnSaveSettings = document.getElementById('btn-save-settings');
        btnSaveSettings.onclick = () => {
            const yt = document.getElementById('page-yt-link').value.trim();
            const rar = document.getElementById('page-rar-pass').value.trim();
            
            set(ref(db, 'page_settings/emulator'), {
                yt_link: yt,
                rar_password: rar
            }).then(() => alert("Settings Saved Successfully!"))
              .catch(err => alert("Error: " + err.message));
        };

        // Load Settings
        get(ref(db, 'page_settings/emulator')).then(snap => {
            if(snap.exists()){
                document.getElementById('page-yt-link').value = snap.val().yt_link || '';
                document.getElementById('page-rar-pass').value = snap.val().rar_password || '';
            }
        });

        // --- Add Emulator ---
        const btnAdd = document.getElementById('btn-add');
        btnAdd.onclick = () => {
            const name = document.getElementById('emu-name').value.trim();
            const link = document.getElementById('emu-link').value.trim();

            if(!name || !link) return alert("Please fill Name and Link!");

            push(ref(db, 'emulators'), {
                title: name,
                download: link,
                timestamp: Date.now()
            }).then(() => {
                alert("Emulator Added!");
                document.getElementById('emu-name').value = '';
                document.getElementById('emu-link').value = '';
            }).catch(err => alert("Error: " + err.message));
        };

        // --- Load List ---
        onValue(ref(db, 'emulators'), (snapshot) => {
            const tbody = document.getElementById('emu-table-body');
            tbody.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold;">${data.title}</td>
                    <td style="color:var(--text-gray); font-size:0.8rem;">${data.download}</td>
                    <td style="text-align: right;">
                        <button class="btn-delete" onclick="deleteItem('${child.key}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        window.deleteItem = (key) => {
            if(confirm("Delete this emulator?")) remove(ref(db, `emulators/${key}`));
        };
    </script>
</body>
</html>
