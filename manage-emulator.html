<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Emulator - OXI ADMIN</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root {
            --bg-deep: #05020a;
            --card-bg: #11071a;
            --border-color: #2a113d;
            --accent-pink: #ff0066;
            --accent-purple: #9d00ff;
            --text-gray: #b0b0b0;
            --success-green: #00cc66;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background: #0c0514;
            height: 100vh;
            position: fixed;
            border-right: 1px solid var(--border-color);
            padding: 20px;
        }

        .sidebar h2 { color: var(--accent-pink); margin-bottom: 30px; text-align: center; }
        
        .sidebar a {
            display: block;
            padding: 12px 15px;
            color: var(--text-gray);
            text-decoration: none;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 14px;
        }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(157, 0, 255, 0.1);
            color: white;
            border-left: 3px solid var(--accent-purple);
        }

        .main-content { margin-left: 300px; padding: 40px; width: calc(100% - 300px); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .card h3 { color: var(--accent-purple); margin-top: 0; display: flex; align-items: center; gap: 10px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; color: var(--text-gray); margin-bottom: 8px; font-size: 14px; }
        
        input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        .btn-purple { background: var(--accent-purple); color: white; }
        .btn-pink { background: var(--accent-pink); color: white; }
        .btn-purple:hover, .btn-pink:hover { opacity: 0.8; transform: translateY(-2px); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-gray); font-size: 12px; text-transform: uppercase; }

        .btn-delete { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        
        .visit-site-btn {
            background: var(--success-green);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            display: block;
            margin-top: 20px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>OXI ADMIN</h2>
        <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
        <a href="manage-pc.html"><i class="fas fa-desktop"></i> Manage PC Panel</a>
        <a href="manage-mobile.html"><i class="fas fa-mobile-alt"></i> Manage Mobile Panel</a>
        <a href="manage-free.html"><i class="fas fa-gift"></i> Manage Free Panel</a>
        <a href="manage-bypass.html"><i class="fas fa-bolt"></i> Manage Free Bypass</a>
        <a href="manage-emulator.html" class="active"><i class="fas fa-cube"></i> Manage Emulator</a>
        <a href="admin-users.html"><i class="fas fa-users-cog"></i> Admin Users</a>
        <a href="https://rijuedit.github.io/BANGLA-FF-PANEL/index.html" class="visit-site-btn" target="_blank">Visit Site</a>
    </div>

    <div class="main-content">
        <h1>Manage Emulator</h1>

        <!-- Page Settings -->
        <div class="card">
            <h3><i class="fas fa-cog"></i> Emulator Page Settings (Optional)</h3>
            <div class="grid-2">
                <div class="input-group">
                    <label>YouTube Video Link (Optional)</label>
                    <input type="text" id="ytLink" placeholder="https://youtube.com/watch?v=...">
                </div>
                <div class="input-group">
                    <label>RAR Password (Optional)</label>
                    <input type="text" id="rarPass" placeholder="e.g., 1234">
                </div>
            </div>
            <button class="btn btn-purple" onclick="savePageSettings()">Save Page Settings</button>
        </div>

        <!-- Add New Emulator -->
        <div class="card">
            <h3 style="color: var(--accent-pink);">Add New Emulator</h3>
            <div class="grid-2">
                <div class="input-group">
                    <label>Emulator Name</label>
                    <input type="text" id="emuName" placeholder="e.g., MSI EMULATOR">
                </div>
                <div class="input-group">
                    <label>Download Link</label>
                    <input type="text" id="emuLink" placeholder="https://mediafire.com/file/...">
                </div>
            </div>
            <button class="btn btn-pink" onclick="addEmulator()">Add Emulator</button>
        </div>

        <!-- Emulator List -->
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Emulator Name</th>
                        <th>Download Link</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="emulatorList">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load Settings
        db.ref('page_settings/emulator').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById('ytLink').value = data.yt_link || '';
                document.getElementById('rarPass').value = data.rar_password || '';
            }
        });

        function savePageSettings() {
            const yt = document.getElementById('ytLink').value;
            const pass = document.getElementById('rarPass').value;

            db.ref('page_settings/emulator').set({
                yt_link: yt,
                rar_password: pass
            }).then(() => alert("Settings Saved!"))
            .catch(err => alert("Error: " + err.message));
        }

        function addEmulator() {
            const name = document.getElementById('emuName').value;
            const link = document.getElementById('emuLink').value;

            if(!name || !link) return alert("Please fill all fields");

            const newRef = db.ref('emulators').push();
            newRef.set({
                title: name,
                download: link,
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('emuName').value = '';
                document.getElementById('emuLink').value = '';
                alert("Emulator Added!");
            }).catch(err => alert("Error: " + err.message));
        }

        // Load List
        db.ref('emulators').on('value', (snapshot) => {
            const list = document.getElementById('emulatorList');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <tr>
                        <td>${data.title}</td>
                        <td style="font-size: 12px; color: var(--text-gray);">${data.download}</td>
                        <td><button class="btn-delete" onclick="deleteEmu('${child.key}')">Delete</button></td>
                    </tr>
                `;
            });
        });

        function deleteEmu(id) {
            if(confirm("Are you sure?")) {
                db.ref('emulators/' + id).remove();
            }
        }
    </script>
</body>
</html>
