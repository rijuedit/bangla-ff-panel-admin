<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Mobile Panel - OXI ADMIN</title>
    
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Theme */
        body { background-color: #05020a; color: #ffffff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #05020a; }
        ::-webkit-scrollbar-thumb { background: #9d00ff; border-radius: 4px; }

        /* Sidebar Design */
        .sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; background: #11071a; border-right: 1px solid #2a113d; padding: 20px 0; overflow-y: auto; }
        .sidebar-logo { text-align: center; color: #ff0066; font-size: 22px; font-weight: 800; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }
        .nav-link { color: #a385bd; padding: 12px 20px; font-weight: 500; transition: 0.3s; border-left: 3px solid transparent; margin-bottom: 5px; font-size: 15px; }
        .nav-link:hover, .nav-link.active { color: #ffffff; background: rgba(157, 0, 255, 0.1); border-left-color: #9d00ff; }
        .nav-link i { width: 25px; text-align: center; margin-right: 5px; }

        /* Main Content */
        .main-content { margin-left: 250px; padding: 30px; }

        /* Header Buttons */
        .btn-purple { background: #9d00ff; color: white; border: none; font-weight: 600; padding: 8px 18px; border-radius: 6px; font-size: 14px; }
        .btn-purple:hover { background: #7a00cc; color: white; }
        .btn-pink { background: #ff0066; color: white; border: none; font-weight: 600; padding: 8px 18px; border-radius: 6px; font-size: 14px; }
        .btn-pink:hover { background: #cc0052; color: white; }

        /* Product Box (Grid Design) */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: #11071a; border: 1px solid #2a113d; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .product-card:hover { border-color: #9d00ff; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(157, 0, 255, 0.3); }
        .product-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; border: 1px solid #9d00ff; background: #05020a; }
        .product-name { color: #ffffff; font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Popup Modals UI */
        .modal-content { background-color: #11071a; border: 1px solid #9d00ff; border-radius: 12px; color: white; }
        .modal-header, .modal-footer { border-color: #2a113d; }
        .form-control { background-color: #05020a; border: 1px solid #2a113d; color: white; }
        .form-control:focus { background-color: #0c0514; border-color: #9d00ff; color: white; box-shadow: none; }
        .form-label { color: #a385bd; font-size: 13px; font-weight: 600; margin-bottom: 5px; }

        /* Popup Price Boxes */
        .p-box-container { display: flex; gap: 8px; justify-content: space-between; margin-top: 10px; }
        .p-box { flex: 1; text-align: center; background: #05020a; padding: 8px 4px; border-radius: 6px; border: 1px solid #3d1c56; }
        .p-val { font-weight: bold; display: block; font-size: 14px; }
        .p-label { color: #a385bd; font-size: 9px; text-transform: uppercase; margin-top: 3px; }
        .p-box.old .p-val { color: #ff0066; text-decoration: line-through; }
        .p-box.sale .p-val { color: #00cc66; }
        .p-box.buy .p-val { color: #9d00ff; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">OXI ADMIN</div>
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a class="nav-link" href="manage-pc.html"><i class="fa-solid fa-desktop"></i> Manage PC Panel</a>
            <a class="nav-link active" href="manage-mobile.html"><i class="fa-solid fa-mobile-screen"></i> Manage Mobile Panel</a>
            <a class="nav-link" href="manage-free-panel.html"><i class="fa-solid fa-gift"></i> Manage Free Panel</a>
            <a class="nav-link" href="manage-free-bypass.html"><i class="fa-solid fa-bolt"></i> Manage Free Bypass</a>
            <a class="nav-link" href="manage-emulator.html"><i class="fa-solid fa-gamepad"></i> Manage Emulator</a>
            <a class="nav-link" href="admin-users.html"><i class="fa-solid fa-users"></i> Admin Users</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-white mb-0" style="font-weight: 700;">
                <i class="fa-solid fa-mobile-screen text-white me-2"></i> Mobile Panels
            </h3>
            
            <div style="display: flex; gap: 12px;">
                <button class="btn-purple" onclick="openGlobalLinkModal()">
                    <i class="fa-solid fa-link"></i> Global Buy Link
                </button>
                <button class="btn-pink" onclick="openAddModal()">
                    <i class="fa-solid fa-plus"></i> Add Product
                </button>
            </div>
        </div>

        <!-- 📦 Mobile Product Grid Boxes -->
        <div id="productGrid" class="product-grid">
            <!-- Data will load here via JS -->
        </div>
    </div>

    <!-- 📌 Product Detail Popup (বক্সে চাপ দিলে পপ-আপ) -->
    <div class="modal fade" id="productDetailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailModalTitle" style="font-weight: bold; color: #fff;">Product Name</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body" id="detailPackages" style="max-height: 60vh; overflow-y: auto;">
                    <!-- Packages detail will load here -->
                </div>
                
                <div class="modal-footer" style="justify-content: space-between;">
                    <div>
                        <button id="btnEdit" class="btn" style="background: #ffaa00; color: #000; font-weight: bold; margin-right: 5px;">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <button id="btnDelete" class="btn" style="background: #ff0066; color: #fff; font-weight: bold;">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📌 Add / Edit Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="formModalTitle">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="productId">
                    <div class="mb-3">
                        <label class="form-label">Panel Name</label>
                        <input type="text" id="productName" class="form-control" placeholder="Enter Panel Name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image URL</label>
                        <input type="text" id="productImage" class="form-control" placeholder="Enter Image URL">
                    </div>
                    
                    <h6 class="text-white mt-4 border-bottom border-secondary pb-2">Packages</h6>
                    <div id="packagesContainer"></div>
                    <button type="button" class="btn btn-sm btn-purple mt-2" onclick="addPackageRow()">+ Add Package</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-pink" onclick="saveProduct()">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📌 Global Buy Link Modal -->
    <div class="modal fade" id="globalLinkModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Global Buy Link</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Global Link URL</label>
                        <input type="text" id="globalBuyLinkInput" class="form-control" placeholder="https://discord.gg/yourlink">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-purple" onclick="saveGlobalLink()">Save Link</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const dbRef = database.ref('mobile_panels'); // Database path for Mobile Panels

        let allProductsData = {};
        const detailModal = new bootstrap.Modal(document.getElementById('productDetailModal'));
        const formModal = new bootstrap.Modal(document.getElementById('addProductModal'));
        const linkModal = new bootstrap.Modal(document.getElementById('globalLinkModal'));

        // 1. Load Products & Display Box Cards
        function loadProducts() {
            dbRef.on('value', (snapshot) => {
                const grid = document.getElementById('productGrid');
                grid.innerHTML = '';
                allProductsData = {};
                
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const product = childSnapshot.val();
                    allProductsData[id] = product;
                    
                    const pName = product.name || product.title || product.panelName || 'Unnamed Panel';
                    const pImg = product.imageUrl || product.image || product.img || 'logo.png';
                    
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.onclick = () => openProductDetail(id);
                    
                    card.innerHTML = `
                        <img src="${pImg}" class="product-img" alt="Panel" onerror="this.src='logo.png'">
                        <div class="product-name">${pName}</div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        // 2. Open Product Details Popup
        function openProductDetail(id) {
            const product = allProductsData[id];
            const pName = product.name || product.title || product.panelName || 'Unnamed Panel';
            
            document.getElementById('detailModalTitle').innerText = pName;
            
            let packagesHTML = '<div style="display: flex; flex-direction: column; gap: 15px;">';
            
            const pkgs = product.packages || product.packageList || [];
            if (pkgs.length > 0) {
                pkgs.forEach(pkg => {
                    const duration = pkg.duration || pkg.name || 'N/A';
                    const oldPrice = pkg.oldPrice || pkg.old_price || 0;
                    const newPrice = pkg.newPrice || pkg.price || 0;
                    const resellPrice = pkg.resellPrice || pkg.resell_price || pkg.buyPrice || 0;

                    packagesHTML += `
                    <div style="background: #0c0514; border: 1px solid #2a113d; padding: 12px; border-radius: 8px;">
                        <div style="color: #00cc66; text-align: center; font-weight: bold; border-bottom: 1px dashed #2a113d; padding-bottom: 8px; font-size: 14px;">
                            <i class="fa-regular fa-clock"></i> ${duration}
                        </div>
                        <div class="p-box-container">
                            <div class="p-box old">
                                <span class="p-val">৳${oldPrice}</span>
                                <span class="p-label">Old Price</span>
                            </div>
                            <div class="p-box sale">
                                <span class="p-val">৳${newPrice}</span>
                                <span class="p-label">Sale</span>
                            </div>
                            <div class="p-box buy">
                                <span class="p-val">৳${resellPrice}</span>
                                <span class="p-label">Buy</span>
                            </div>
                        </div>
                    </div>`;
                });
            } else {
                packagesHTML += `<div class="text-center text-danger p-3">No packages available for this panel.</div>`;
            }
            packagesHTML += '</div>';
            
            document.getElementById('detailPackages').innerHTML = packagesHTML;
            
            // Edit Button Handler
            document.getElementById('btnEdit').onclick = () => {
                detailModal.hide();
                openEditModal(id);
            };
            
            // Delete Button Handler
            document.getElementById('btnDelete').onclick = () => {
                if(confirm("Are you sure you want to delete this product?")) {
                    dbRef.child(id).remove().then(() => {
                        detailModal.hide();
                    });
                }
            };
            
            detailModal.show();
        }

        // 3. Open Add Product Modal
        function openAddModal() {
            document.getElementById('formModalTitle').innerText = "Add New Product";
            document.getElementById('productId').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('packagesContainer').innerHTML = '';
            addPackageRow();
            formModal.show();
        }

        // 4. Open Edit Product Modal
        function openEditModal(id) {
            const product = allProductsData[id];
            const pName = product.name || product.title || '';
            const pImg = product.imageUrl || product.image || '';

            document.getElementById('formModalTitle').innerText = "Edit Product";
            document.getElementById('productId').value = id;
            document.getElementById('productName').value = pName;
            document.getElementById('productImage').value = pImg;
            
            document.getElementById('packagesContainer').innerHTML = '';
            const pkgs = product.packages || product.packageList || [];
            if(pkgs.length > 0) {
                pkgs.forEach(pkg => addPackageRow(pkg.duration || pkg.name, pkg.oldPrice || pkg.old_price, pkg.newPrice || pkg.price, pkg.resellPrice || pkg.resell_price));
            } else {
                addPackageRow();
            }
            formModal.show();
        }

        // 5. Package Input Row Helper
        function addPackageRow(duration = '', oldP = '', newP = '', resellP = '') {
            const div = document.createElement('div');
            div.className = 'row g-2 mb-2 package-row align-items-end';
            div.innerHTML = `
                <div class="col-md-3">
                    <label class="form-label" style="font-size:11px;">Duration</label>
                    <input type="text" class="form-control pkg-duration" value="${duration}" placeholder="e.g. 7 Days">
                </div>
                <div class="col-md-2">
                    <label class="form-label" style="font-size:11px;">Old Price</label>
                    <input type="number" class="form-control pkg-old" value="${oldP}" placeholder="৳">
                </div>
                <div class="col-md-2">
                    <label class="form-label" style="font-size:11px;">Sale Price</label>
                    <input type="number" class="form-control pkg-new" value="${newP}" placeholder="৳">
                </div>
                <div class="col-md-3">
                    <label class="form-label" style="font-size:11px;">Buy Price</label>
                    <input type="number" class="form-control pkg-resell" value="${resellP}" placeholder="৳">
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-danger w-100" onclick="this.parentElement.parentElement.remove()">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `;
            document.getElementById('packagesContainer').appendChild(div);
        }

        // 6. Save Product to Firebase
        function saveProduct() {
            const id = document.getElementById('productId').value;
            const name = document.getElementById('productName').value;
            const imageUrl = document.getElementById('productImage').value;
            
            const packageRows = document.querySelectorAll('.package-row');
            let packages = [];
            packageRows.forEach(row => {
                const duration = row.querySelector('.pkg-duration').value;
                const oldPrice = row.querySelector('.pkg-old').value;
                const newPrice = row.querySelector('.pkg-new').value;
                const resellPrice = row.querySelector('.pkg-resell').value;
                if(duration) {
                    packages.push({ duration, oldPrice, newPrice, resellPrice });
                }
            });

            const productData = { 
                name: name,
                title: name,
                imageUrl: imageUrl,
                image: imageUrl,
                packages: packages 
            };

            if(id) {
                dbRef.child(id).update(productData).then(() => {
                    formModal.hide();
                });
            } else {
                dbRef.push(productData).then(() => {
                    formModal.hide();
                });
            }
        }

        // 7. Global Buy Link Handler
        function openGlobalLinkModal() {
            database.ref('global_buy_link/mobile').once('value').then(snapshot => {
                document.getElementById('globalBuyLinkInput').value = snapshot.val() || '';
                linkModal.show();
            });
        }

        function saveGlobalLink() {
            const link = document.getElementById('globalBuyLinkInput').value;
            database.ref('global_buy_link/mobile').set(link).then(() => {
                alert("Global Buy Link Saved!");
                linkModal.hide();
            });
        }

        // Load Products on startup
        window.onload = loadProducts;
    </script>
</body>
</html>
