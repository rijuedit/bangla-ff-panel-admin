<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Mobile Panels - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #05020a; color: #fff; display: flex; min-height: 100vh; }
    
    .sidebar { width: 260px; background: #0c0514; border-right: 2px solid #2a113d; padding: 20px 0; display: flex; flex-direction: column; }
    .sidebar h2 { color: #ff0066; text-align: center; margin-bottom: 30px; font-size: 1.5rem; text-shadow: 0 0 10px rgba(255,0,102,0.5); }
    .sidebar a { display: block; padding: 15px 20px; color: #a090b5; text-decoration: none; font-size: 1rem; border-left: 4px solid transparent; transition: 0.3s; }
    .sidebar a:hover, .sidebar a.active { background: #1a0b28; color: #fff; border-left-color: #ff0066; }
    .sidebar a i { margin-right: 10px; width: 20px; text-align: center; }

    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .header h1 { font-size: 1.8rem; color: #fff; }
    
    .card { background: #11071a; border: 1px solid #2a113d; border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    .card h3 { margin-bottom: 20px; color: #ff0066; border-bottom: 1px dashed #2a113d; padding-bottom: 10px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #a090b5; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 12px; background: #05020a; border: 1px solid #2a113d; color: #fff; border-radius: 8px; outline: none; }
    
    .pkg-container { background: #0c0514; border: 1px solid #2a113d; padding: 15px; border-radius: 10px; margin-bottom: 15px; position: relative; }
    .pkg-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .remove-pkg { position: absolute; top: -10px; right: -10px; background: #ff0066; color: #fff; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    .add-pkg-btn { background: #1a0b28; color: #00cc66; border: 1px dashed #00cc66; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
    
    .btn-submit { background: linear-gradient(90deg, #ff0066, #9d00ff); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #2a113d; }
    th { color: #a090b5; }
    td img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
    .btn-del { background: #ff0066; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
    .pkg-tag { background: #1a0b28; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin: 2px; display: inline-block; border: 1px solid #9d00ff; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>ADMIN PANEL</h2>
    <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
    <a href="https://imgbb.com/" target="_blank"><i class="fas fa-image"></i> ImgBB Upload</a>
    <a href="https://postimages.org/" target="_blank"><i class="fas fa-images"></i> PostImages</a>
    <a href="manage-pc.html"><i class="fas fa-laptop"></i> Manage PC Panel</a>
    <a href="manage-mobile.html" class="active"><i class="fas fa-mobile-alt"></i> Manage Mobile Panel</a>
  </div>

  <div class="main-content">
    <div class="header"><h1>Manage Mobile Panels</h1></div>

    <div class="card">
      <h3><i class="fas fa-plus-circle"></i> Add New Mobile Panel</h3>
      <div class="form-group"><label>Panel Name</label><input type="text" id="panelTitle" placeholder="e.g. BR MODS VIP"></div>
      <div class="form-group"><label>Image URL (Optional)</label><input type="text" id="panelImg" placeholder="https://i.ibb.co/..."></div>
      <div class="form-group"><label>Custom Buy Link (Optional, leave blank for WhatsApp)</label><input type="text" id="panelLink"></div>

      <h4 style="color:#00cc66; margin-bottom:10px;">Pricing Packages / Durations:</h4>
      <div id="packagesWrapper">
        <div class="pkg-container">
          <button class="remove-pkg" onclick="this.parentElement.remove()">X</button>
          <div class="pkg-row">
            <div class="form-group"><label>Duration</label><input type="text" class="p-dur" value="1 Day"></div>
            <div class="form-group"><label>Old Price</label><input type="number" class="p-old" value="150"></div>
            <div class="form-group"><label>Sell Price</label><input type="number" class="p-sell" value="100"></div>
            <div class="form-group"><label>Buy Price</label><input type="number" class="p-buy" value="50"></div>
          </div>
        </div>
      </div>
      
      <button class="add-pkg-btn" onclick="addPackageRow()">+ Add Another Duration</button>
      <button class="btn-submit" onclick="savePanel()">Save Mobile Panel</button>
    </div>

    <div class="card">
      <h3><i class="fas fa-list"></i> Existing Mobile Panels</h3>
      <table id="panelTable">
        <thead><tr><th>Image</th><th>Name</th><th>Packages (Admin View)</th><th>Action</th></tr></thead>
        <tbody><tr><td colspan="4">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
      authDomain: "bangla-ff-admin.firebaseapp.com",
      databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bangla-ff-admin"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.addPackageRow = function() {
      const wrapper = document.getElementById('packagesWrapper');
      wrapper.insertAdjacentHTML('beforeend', `
        <div class="pkg-container">
          <button class="remove-pkg" onclick="this.parentElement.remove()">X</button>
          <div class="pkg-row">
            <div class="form-group"><label>Duration</label><input type="text" class="p-dur" placeholder="e.g. 1 Month"></div>
            <div class="form-group"><label>Old Price</label><input type="number" class="p-old" placeholder="500"></div>
            <div class="form-group"><label>Sell Price</label><input type="number" class="p-sell" placeholder="400"></div>
            <div class="form-group"><label>Buy Price</label><input type="number" class="p-buy" placeholder="200"></div>
          </div>
        </div>
      `);
    };

    window.savePanel = function() {
      const title = document.getElementById('panelTitle').value;
      const img = document.getElementById('panelImg').value;
      const link = document.getElementById('panelLink').value;
      if(!title) { alert("Panel Name required!"); return; }

      let packages = [];
      document.querySelectorAll('.pkg-container').forEach(pkg => {
        let dur = pkg.querySelector('.p-dur').value, oldP = pkg.querySelector('.p-old').value;
        let sellP = pkg.querySelector('.p-sell').value, buyP = pkg.querySelector('.p-buy').value;
        if(dur && sellP) packages.push({ duration: dur, old_price: Number(oldP)||0, sell_price: Number(sellP)||0, buy_price: Number(buyP)||0 });
      });
      if(packages.length === 0) { alert("Add at least one package!"); return; }

      push(ref(db, 'mobile_panels'), { title, image: img, buy_link: link, packages, timestamp: Date.now() }).then(() => {
        alert("Mobile Panel Saved!");
        document.getElementById('panelTitle').value = '';
      });
    };

    onValue(ref(db, 'mobile_panels'), (snapshot) => {
      const tbody = document.querySelector('#panelTable tbody');
      tbody.innerHTML = '';
      if(snapshot.exists()){
        const data = snapshot.val();
        Object.keys(data).reverse().forEach(key => {
          const item = data[key];
          let pkgsHtml = '';
          if(item.packages) item.packages.forEach(p => pkgsHtml += `<span class="pkg-tag">${p.duration}: Sell ৳${p.sell_price} | Buy ৳${p.buy_price}</span> `);
          tbody.innerHTML += `<tr><td><img src="${item.image || 'https://i.ibb.co/L8r1pXw/logo.png'}"></td><td>${item.title}</td><td>${pkgsHtml}</td><td><button class="btn-del" onclick="deletePanel('${key}')"><i class="fas fa-trash"></i></button></td></tr>`;
        });
      } else tbody.innerHTML = '<tr><td colspan="4">No panels found.</td></tr>';
    });

    window.deletePanel = function(key) { if(confirm("Delete this panel?")) remove(ref(db, `mobile_panels/${key}`)); };
  </script>
</body>
</html>
