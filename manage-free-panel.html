<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Free Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; cursor: default; }
        body { background-color: #05020a; color: #fff; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: #11071a; color: #fff; text-decoration: none; padding: 10px 20px; border: 1px solid #2a113d; border-radius: 8px; cursor: pointer; }
        
        .form-container { background: #11071a; border: 1px solid #2a113d; padding: 25px; border-radius: 12px; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { color: #ff0066; font-weight: 600; }
        .input-group input { background: #05020a; border: 1px solid #2a113d; color: #fff; padding: 12px; border-radius: 8px; outline: none; cursor: text;}
        
        .submit-btn { background: #ff0066; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px; }
        .cancel-btn { background: #555; color: #fff; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; display: none; }

        .item-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .item-card { background: #11071a; border: 1px solid #2a113d; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .item-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .item-actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-edit { background: #e6b800; color: #000; flex: 1; padding: 8px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
        .btn-delete { background: #ff0033; color: white; flex: 1; padding: 8px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Manage <span style="color:#ff0066;">Free Module</span></h1>
        <a href="index.html" class="back-btn">Back to Dashboard</a>
    </div>

    <div class="form-container">
        <form id="addForm">
            <input type="hidden" id="edit_id"> <!-- Hidden ID for Edit Mode -->
            <div class="form-grid">
                <div class="input-group">
                    <label>Box Title (e.g. Free Aimbot)</label>
                    <input type="text" id="title" required>
                </div>
                <div class="input-group">
                    <label>Image URL</label>
                    <input type="url" id="image" required>
                </div>
                <div class="input-group">
                    <label>Button Text (e.g. Download Script)</label>
                    <input type="text" id="btn_text" placeholder="Download" value="Download" required>
                </div>
                <div class="input-group">
                    <label>Button Link</label>
                    <input type="url" id="download" required>
                </div>
            </div>
            <button type="submit" id="submitBtn" class="submit-btn">Save Item</button>
            <button type="button" id="cancelBtn" class="cancel-btn" onclick="cancelEdit()">Cancel Edit</button>
        </form>
    </div>

    <div class="item-list" id="itemList"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Form Submit (Add or Edit)
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit_id').value;
            
            const data = {
                title: document.getElementById('title').value,
                image: document.getElementById('image').value,
                btn_text: document.getElementById('btn_text').value || "Download",
                download: document.getElementById('download').value
            };

            if(editId) {
                // Update Existing
                await update(ref(db, `free_panels/${editId}`), data);
                alert("Updated Successfully!");
            } else {
                // Add New
                data.timestamp = Date.now();
                await set(push(ref(db, 'free_panels')), data);
                alert("Added Successfully!");
            }
            cancelEdit();
        });

        // Load Items
        onValue(ref(db, 'free_panels'), (snapshot) => {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const item = child.val();
                list.innerHTML += `
                    <div class="item-card">
                        <img src="${item.image}">
                        <h3>${item.title}</h3>
                        <p style="color:#aaa; font-size:14px;">Button: <b>${item.btn_text || 'Download'}</b></p>
                        <div class="item-actions">
                            <button class="btn-edit" onclick="editItem('${child.key}', '${item.title}', '${item.image}', '${item.btn_text || 'Download'}', '${item.download}')">Edit</button>
                            <button class="btn-delete" onclick="deleteItem('${child.key}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        });

        window.editItem = (id, title, image, btn_text, download) => {
            document.getElementById('edit_id').value = id;
            document.getElementById('title').value = title;
            document.getElementById('image').value = image;
            document.getElementById('btn_text').value = btn_text;
            document.getElementById('download').value = download;
            
            document.getElementById('submitBtn').innerText = "Update Item";
            document.getElementById('submitBtn').style.background = "#e6b800";
            document.getElementById('cancelBtn').style.display = "block";
            window.scrollTo(0,0);
        };

        window.cancelEdit = () => {
            document.getElementById('addForm').reset();
            document.getElementById('edit_id').value = "";
            document.getElementById('submitBtn').innerText = "Save Item";
            document.getElementById('submitBtn').style.background = "#ff0066";
            document.getElementById('cancelBtn').style.display = "none";
        };

        window.deleteItem = (key) => {
            if(confirm("Are you sure?")) remove(ref(db, `free_panels/${key}`));
        };
    </script>
</body>
</html>
