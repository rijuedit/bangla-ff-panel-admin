<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BANGLA FF PANEL | Admin Login</title>
        <style>
            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 20px;
                background: radial-gradient(circle at top,#252044,#090912 60%);
                font-family: Arial,sans-serif;
                color: #f8fafc
            }

            .card {
                width: min(420px,100%);
                padding: 32px;
                border: 1px solid #37304f;
                border-radius: 20px;
                background: rgba(20,17,34,.94);
                box-shadow: 0 20px 70px #0008
            }

            h1 {
                margin: 0 0 8px;
                font-size: 25px
            }

            p {
                color: #aaa4bd;
                font-size: 14px;
                line-height: 1.5
            }

            .field {
                margin: 18px 0
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-size: 13px;
                color: #d8d3e7
            }

            input {
                width: 100%;
                padding: 13px 14px;
                border: 1px solid #443b5e;
                border-radius: 10px;
                background: #100d1c;
                color: white;
                outline: none
            }

            input:focus {
                border-color: #a78bfa
            }

            button {
                width: 100%;
                padding: 13px;
                border: 0;
                border-radius: 10px;
                background: linear-gradient(90deg,#7c3aed,#2563eb);
                color: white;
                font-weight: bold;
                cursor: pointer
            }

            button:disabled {
                opacity: .6;
                cursor: wait
            }

            #message {
                min-height: 20px;
                color: #fca5a5;
                font-size: 13px;
                margin-top: 14px
            }

            .note {
                font-size: 12px;
                text-align: center;
                margin-top: 20px
            }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>Admin Login</h1>
            <p>Sign in with the email account approved by the BANGLA FF PANEL administrator.</p>
            <form id="loginForm">
                <div class="field">
                    <label for="email">Admin Gmail</label>
                    <input id="email" type="email" autocomplete="username" required placeholder="admin@gmail.com">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" required placeholder="Your password">
                </div>
                <button id="loginBtn" type="submit">SIGN IN</button>
                <div id="message" role="status"></div>
            </form>
            <p class="note">Only accounts listed in Manage Admins can access the panel.</p>
        </main>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
        <script>
            const firebaseConfig = {
                apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
                authDomain: "bangla-ff-admin.firebaseapp.com",
                databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "bangla-ff-admin",
                storageBucket: "bangla-ff-admin.firebasestorage.app",
                messagingSenderId: "295013484465",
                appId: "1:295013484465:web:b6bc2a949e239095761f90"
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth()
              , db = firebase.database();
            const form = document.getElementById('loginForm')
              , btn = document.getElementById('loginBtn')
              , message = document.getElementById('message');
            function keyFor(email) {
                return email.trim().toLowerCase().replace(/\./g, ',')
            }
            form.addEventListener('submit', async e => {
                e.preventDefault();
                message.textContent = '';
                btn.disabled = true;
                btn.textContent = 'CHECKING…';
                let signedInUser = null;
                try {
                    const email = document.getElementById('email').value.trim().toLowerCase()
                      , password = document.getElementById('password').value;
                    const result = await auth.signInWithEmailAndPassword(email, password);
                    signedInUser = result.user;
                    const key = keyFor(email);
                    const [superSnap,normalSnap] = await Promise.all([db.ref('admins/super/' + key).once('value'), db.ref('admins/normal/' + key).once('value')]);
                    if (!superSnap.exists() && !normalSnap.exists()) {
                        await auth.signOut();
                        message.textContent = 'Access denied: this email is not an approved admin.';
                        return
                    }
                    window.location.replace('index.html')
                } catch (err) {
                    if (signedInUser) {
                        try {
                            await auth.signOut()
                        } catch (_) {}
                    }
                    message.textContent = err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' ? 'Incorrect email or password.' : (err.message || 'Login failed. Please try again.')
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'SIGN IN'
                }
            }
            );
        </script>
    </body>
</html>
