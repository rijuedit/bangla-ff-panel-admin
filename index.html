<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANGLA FF - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mouse-glow"></div>

    <!-- Login View -->
    <div id="login-screen" class="center-box">
        <div class="login-card">
            <i class="fa-solid fa-crown logo-icon"></i>
            <h2>BANGLA FF ADMIN</h2>
            <p>লগইন করতে নিচের বাটনে ক্লিক করুন</p>
            <button id="google-login-btn" class="btn-primary">
                <i class="fa-brands fa-google"></i> Google দিয়ে লগইন করুন
            </button>
        </div>
    </div>

    <!-- Main Admin Dashboard -->
    <div id="admin-dashboard" class="dashboard" style="display: none;">
        <nav class="sidebar">
            <div class="brand"><i class="fa-solid fa-crown"></i> ADMIN PANEL</div>
            <div class="user-info">
                <img id="user-photo" src="" alt="Admin">
                <span id="user-email"></span>
                <span id="role-badge" class="badge">Admin</span>
            </div>
            <ul class="menu">
                <li class="active"><i class="fa-solid fa-list"></i> Manage Panels</li>
            </ul>
            <button id="logout-btn" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </nav>

        <main class="content">
            <header class="top-bar">
                <h2><i class="fa-solid fa-sliders"></i> Panel Management</h2>
                <button onclick="openPanelModal()" class="btn-add"><i class="fa-solid fa-plus"></i> Add New Panel</button>
            </header>

            <div id="panel-list" class="panel-grid">
                <!-- Dynamic Panel List loaded here -->
            </div>
        </main>
    </div>

    <!-- Modal for Adding / Editing Panel -->
    <div id="panel-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">নতুন প্যানেল যুক্ত করুন</h3>
                <span onclick="closePanelModal()" class="close-btn">&times;</span>
            </div>
            <form id="panel-form">
                <input type="hidden" id="panel-id">
                
                <div class="form-group">
                    <label>প্যানেলের নাম (Title)</label>
                    <input type="text" id="panel-title" placeholder="যেমন: BR MODS [ GLOBAL ]" required>
                </div>

                <div class="form-group">
                    <label>লোগো/ছবি লিংক (Logo Image URL)</label>
                    <input type="url" id="panel-icon" placeholder="https://example.com/logo.png (খালি রাখলে ক্রাউন লোগো থাকবে)">
                </div>

                <div class="form-group">
                    <label>প্যানেল ক্যাটাগরি / পেজ</label>
                    <select id="panel-category">
                        <option value="home">Home Page</option>
                        <option value="free">Free Panel</option>
                        <option value="mobile">Mobile Panel</option>
                        <option value="emulator">Emulator</option>
                        <option value="buy">Buy Panel</option>
                    </select>
                </div>

                <!-- Multiple Durations & Prices Section -->
                <div class="form-group">
                    <label>প্যাকেজ এবং দাম (Duration & Pricing)</label>
                    <div id="price-rows">
                        <!-- Dynamic price rows will be added here -->
                    </div>
                    <button type="button" onclick="addPriceRow()" class="btn-secondary">+ আরও প্যাকেজ যোগ করুন (যেমন 7 Day, 30 Day)</button>
                </div>

                <div class="form-group checkbox-group">
                    <label><input type="checkbox" id="panel-visible" checked> ওয়েবসাইটে প্যানেলটি দেখাবে (Visible)</label>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn-primary">সেভ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
