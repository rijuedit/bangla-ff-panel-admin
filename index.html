<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANGLA FF - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Overlay -->
    <div id="login-overlay" class="overlay">
        <div class="login-box">
            <img src="https://i.ibb.co/m568x8Y/logo.png" alt="Logo" class="login-logo">
            <h2>Admin Login</h2>
            <button id="google-login-btn"><i class="fab fa-google"></i> Sign in with Google</button>
        </div>
    </div>

    <div class="admin-container" id="admin-main" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="https://i.ibb.co/m568x8Y/logo.png" alt="Logo">
                <span>Admin Panel</span>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-section="general"><i class="fas fa-cog"></i> General</button>
                <button class="nav-btn" data-section="home-cards"><i class="fas fa-th-large"></i> Home Cards</button>
                <button class="nav-btn" data-section="free-panel"><i class="fas fa-gift"></i> Free Panel</button>
                <button class="nav-btn" data-section="bypass"><i class="fas fa-bolt"></i> Bypass</button>
                <button class="nav-btn" data-section="emulator"><i class="fas fa-desktop"></i> Emulator</button>
                <button class="nav-btn" data-section="apk"><i class="fab fa-android"></i> APK</button>
                <button class="nav-btn" data-section="mobile"><i class="fas fa-mobile-alt"></i> Mobile Panel</button>
                <button class="nav-btn" data-section="buy"><i class="fas fa-shopping-cart"></i> Buy Panel</button>
                <button class="nav-btn" data-section="admins"><i class="fas fa-user-shield"></i> Admins</button>
                <button id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="top-bar">
                <h2 id="section-title">General Settings</h2>
                <div class="user-info">
                    <span id="admin-email"></span>
                </div>
            </header>

            <div id="dynamic-content" class="section-container">
                <!-- Content will be injected by script.js -->
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
