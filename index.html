<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANGLA FF ADMIN</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="login-wrapper">
    <div class="login-card">
      <i class="fa-solid fa-crown cyan-text" style="font-size: 40px; margin-bottom: 15px;"></i>
      <h2>BANGLA FF ADMIN</h2>
      <p style="color: #8b97ad; margin-bottom: 25px; font-size: 14px;">Please sign in to continue</p>
      <button id="google-login-btn" class="btn-google">
        <i class="fa-brands fa-google"></i> Sign in with Google
      </button>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-dashboard" class="dashboard-layout" style="display: none;">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-crown cyan-text"></i>
        <span>BANGLA FF ADMIN</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="tab-general">
          <i class="fa-solid fa-gear"></i> General
        </button>
        <button class="nav-item" data-tab="tab-home-cards">
          <i class="fa-solid fa-border-all"></i> Home Cards
        </button>
        <button class="nav-item" data-tab="tab-panels">
          <i class="fa-solid fa-list-check"></i> Manage Panels
        </button>
        <button class="nav-item" data-tab="tab-admins">
          <i class="fa-solid fa-users-gear"></i> Admins
        </button>
      </nav>

      <div class="sidebar-footer">
        <a href="https://rijuedit.github.io/BANGLA-FF-PANEL/" target="_blank" class="btn-visit">
          <i class="fa-solid fa-globe"></i> Visit Main Site
        </a>
        
        <div class="user-profile">
          <div class="avatar" id="user-avatar-text">R</div>
          <div class="user-info">
            <div class="user-email" id="user-email">admin@gmail.com</div>
            <div class="user-role"><i class="fa-solid fa-shield-halved"></i> Super Admin</div>
          </div>
        </div>

        <button id="logout-btn" class="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      
      <!-- TAB: GENERAL SETTINGS -->
      <section id="tab-general" class="tab-pane active">
        <div class="page-header">
          <h2><i class="fa-solid fa-gear cyan-text"></i> General Settings</h2>
          <button class="btn-primary" onclick="saveGeneralSettings()">
            <i class="fa-solid fa-floppy-disk"></i> Save Changes
          </button>
        </div>

        <div class="card">
          <div class="form-group">
            <label><i class="fa-regular fa-image"></i> Website Logo URL</label>
            <input type="url" id="setting-logo" placeholder="https://i.ibb.co/.../logo.png">
          </div>
          <div class="form-group">
            <label><i class="fa-brands fa-discord"></i> Discord Support Link (Invite)</label>
            <input type="url" id="setting-discord" placeholder="https://discord.gg/...">
          </div>
          <div class="form-group">
            <label><i class="fa-regular fa-gem"></i> Diamond Top-Up Link</label>
            <input type="url" id="setting-topup" placeholder="https://rijuedit.github.io/...">
          </div>
        </div>
      </section>

      <!-- TAB: HOME CARDS -->
      <section id="tab-home-cards" class="tab-pane">
        <div class="page-header">
          <h2><i class="fa-solid fa-border-all cyan-text"></i> Homepage Cards Editor</h2>
          <button class="btn-primary" onclick="saveHomeCards()">
            <i class="fa-solid fa-floppy-disk"></i> Save Cards
          </button>
        </div>
        <div id="home-cards-container" class="cards-grid">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- TAB: MANAGE PANELS (PRODUCTS) -->
      <section id="tab-panels" class="tab-pane">
        <div class="page-header">
          <h2><i class="fa-solid fa-list-check cyan-text"></i> Manage Panels</h2>
          <button class="btn-primary" onclick="openProductModal()">
            <i class="fa-solid fa-plus"></i> Add New Panel
          </button>
        </div>
        <div id="product-list" class="panels-list">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- TAB: ADMINS -->
      <section id="tab-admins" class="tab-pane">
        <div class="page-header">
          <h2><i class="fa-solid fa-users-gear cyan-text"></i> Admins</h2>
        </div>
        <div class="card">
          <p style="color: #8b97ad; margin-bottom: 15px;">Super Admin (mdrijowan359@gmail.com) can add other admins.</p>
          <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="email" id="new-admin-email" placeholder="New admin email...">
            <button class="btn-primary" onclick="addAdminEmail()">Add Admin</button>
          </div>
          <ul id="admin-email-list" class="admin-list"></ul>
        </div>
      </section>

    </main>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
