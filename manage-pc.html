<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage PC Panels - BANGLA FF ADMIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #07030b;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: #0d0614;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a113d;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand { text-decoration: none; }
        .nav-brand h1 {
            font-size: 1.15rem;
            color: #ff007f;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,0,127,0.5);
        }
        .nav-brand span {
            font-size: 0.72rem;
            color: #aaa;
            display: block;
        }

        .nav-actions { display: flex; gap: 10px; }
        .nav-btn {
            background: #140821;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #2a113d;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }
        .nav-btn:hover { border-color: #ff007f; color: #ff007f; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 18px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 22px;
            background: #140821;
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid #2a113d;
            transition: 0.3s;
        }
        .back-link:hover { border-color: #ff007f; color: #ff007f; }

        .admin-card {
            background: #0d0614;
            border: 1px solid #2a113d;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 26px;
        }

        .admin-card h2 {
            font-size: 1.2rem;
            color: #00ff7f;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-control {
            width: 100%;
            background: #1a0b2e;
            border: 1px solid #2a113d;
            border-radius: 8px;
            padding: 11px 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .form-control:focus { border-color: #ff007f; }

        .btn-add {
            background: linear-gradient(90deg, #d500f9, #ff007f);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-add:hover { box-shadow: 0 0 15px rgba(255,0,127,0.5); }

        /* Product Box Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
            margin-top: 18px;
        }

        .product-box {
            background: #11071a;
            border: 1.5px solid #2a113d;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .product-box:hover {
            border-color: #ff007f;
            box-shadow: 0 0 18px rgba(255,0,127,0.3);
            transform: translateY(-4px);
        }

        .product-box-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #2a113d;
        }

        .product-box-name {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .click-hint {
            font-size: 0.72rem;
            color: #ff007f;
            font-weight: 600;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-card {
            background: #0d0614;
            border: 2px solid #ff007f;
            border-radius: 16px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
            box-shadow: 0 0 30px rgba(255,0,127,0.35);
        }

        .modal-close {
            position: absolute;
            top: 14px; right: 14px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.3rem;
            cursor: pointer;
        }
        .modal-close:hover { color: #ff007f; }

        .modal-title {
            font-size: 1.15rem;
            color: #ff007f;
            font-weight: 800;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: #aaa;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .grid-3 { grid-template-columns: 1fr; }
        }

        /* Package Headers & Rows */
        .pkg-header-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            padding-left: 108px;
        }
        .pkg-header-cell {
            flex: 1;
            text-align: center;
        }
        .pkg-header-cell.sale { color: #00ff7f; }
        .pkg-header-cell.old { color: #aaa; }

        .pkg-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .pkg-row .pkg-label {
            min-width: 100px;
            max-width: 100px;
            background: #1a0b2e;
            border: 1px solid #2a113d;
            border-radius: 8px;
            padding: 10px 6px;
            color: #ccc;
            font-size: 0.82rem;
            font-weight: 700;
            text-align: center;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-edit-action {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-delete-action {
            background: #ff4d4d;
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .empty-msg {
            grid-column: 1/-1;
            text-align: center;
            color: #888;
            padding: 30px;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="nav-brand">
            <h1>BANGLA FF PANEL</h1>
            <span>PREMIUM CORP (ADMIN)</span>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="nav-btn"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="nav-btn"><i class="fab fa-discord"></i> Discord</a>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <!-- Setup Video Tutorial -->
        <div class="admin-card">
            <h2><i class="fas fa-video"></i> PC Setup Video Tutorial Link</h2>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <input type="url" id="pcVideoInput" class="form-control" placeholder="YouTube or Google Drive link" style="flex:1; min-width:220px;">
                <button class="btn-add" onclick="saveVideoUrl()"><i class="fas fa-save"></i> Save Video</button>
            </div>
        </div>

        <!-- Manage PC Panels -->
        <div class="admin-card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <h2><i class="fas fa-desktop"></i> Manage PC Panels</h2>
                <button class="btn-add" onclick="openAddModal()"><i class="fas fa-plus"></i> Add New Product</button>
            </div>

            <div class="product-grid" id="productGrid">
                <div class="empty-msg">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Action Popup Modal (Edit / Delete) -->
    <div class="modal-overlay" id="actionModal">
        <div class="modal-card" style="max-width:380px; text-align:center;">
            <button class="modal-close" onclick="closeActionModal()">&times;</button>
            <h3 class="modal-title" id="actionTitle">Product</h3>
            <p style="color:#aaa; font-size:0.85rem; margin-bottom:16px;">Select an action:</p>
            <div class="action-btns">
                <button class="btn-edit-action" onclick="triggerEdit()"><i class="fas fa-edit"></i> Edit Product</button>
                <button class="btn-delete-action" onclick="triggerDelete()"><i class="fas fa-trash"></i> Delete Product</button>
            </div>
        </div>
    </div>

    <!-- Add / Edit Form Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeProductModal()">&times;</button>
            <h3 class="modal-title" id="formTitle">Add New PC Panel</h3>

            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editKey">

                <div class="form-group">
                    <label>Product Name (Title)</label>
                    <input type="text" id="pTitle" class="form-control" placeholder="e.g. BR MODS [ DUSTU AIMKILL ]" required>
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="pImage" class="form-control" placeholder="Direct image link" required>
                </div>

                <div class="grid-3">
                    <div class="form-group">
                        <label>Old Price (৳) পুরোনো</label>
                        <input type="number" id="pOldPrice" class="form-control" placeholder="1500">
                    </div>
                    <div class="form-group">
                        <label>Sale Price (৳) বিক্রি</label>
                        <input type="number" id="pSalePrice" class="form-control" placeholder="1100">
                    </div>
                    <div class="form-group">
                        <label>Buy Price (৳) কিনার</label>
                        <input type="number" id="pBuyPrice" class="form-control" placeholder="700">
                    </div>
                </div>

                <div class="form-group">
                    <label>Download / Key Link</label>
                    <input type="url" id="pDownload" class="form-control" placeholder="Download or key link">
                </div>

                <!-- Package Durations (Sale Price FIRST, Old Price SECOND) -->
                <div class="form-group">
                    <label>Package Durations & Prices</label>
                    
                    <div class="pkg-header-row">
                        <div class="pkg-header-cell sale">Sale Price (বিক্রি দাম) *</div>
                        <div class="pkg-header-cell old">Old Price (পুরোনো/কাটা)</div>
                    </div>

                    <div class="pkg-row">
                        <div class="pkg-label">1 Days</div>
                        <input type="number" id="sell_1d" class="form-control" placeholder="Sale Price (৳)">
                        <input type="number" id="old_1d" class="form-control" placeholder="Old Price (৳)">
                    </div>
                    <div class="pkg-row">
                        <div class="pkg-label">7 Days</div>
                        <input type="number" id="sell_7d" class="form-control" placeholder="Sale Price (৳)">
                        <input type="number" id="old_7d" class="form-control" placeholder="Old Price (৳)">
                    </div>
                    <div class="pkg-row">
                        <div class="pkg-label">1 Months</div>
                        <input type="number" id="sell_1m" class="form-control" placeholder="Sale Price (৳)">
                        <input type="number" id="old_1m" class="form-control" placeholder="Old Price (৳)">
                    </div>
                    <div class="pkg-row">
                        <div class="pkg-label">Lifetime</div>
                        <input type="number" id="sell_life" class="form-control" placeholder="Sale Price (৳)">
                        <input type="number" id="old_life" class="form-control" placeholder="Old Price (৳)">
                    </div>
                </div>

                <button type="submit" class="btn-add" style="width:100%; justify-content:center; margin-top:10px;">
                    <i class="fas fa-save"></i> Save Product
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let pcProducts = {};
        let activeKey = null;

        // Video URL
        onValue(ref(db, 'settings/video_pc'), (snap) => {
            if (snap.val()) document.getElementById('pcVideoInput').value = snap.val();
        });

        window.saveVideoUrl = () => {
            const url = document.getElementById('pcVideoInput').value.trim();
            set(ref(db, 'settings/video_pc'), url)
                .then(() => alert('Video link saved!'))
                .catch(e => alert('Error: ' + e.message));
        };

        // Load Products as Boxes
        onValue(ref(db, 'pc_panels'), (snap) => {
            pcProducts = snap.val() || {};
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const keys = Object.keys(pcProducts);
            if (keys.length === 0) {
                grid.innerHTML = '<div class="empty-msg">No PC Panels yet. Click "+ Add New Product"</div>';
                return;
            }

            keys.forEach(key => {
                const item = pcProducts[key];
                const title = item.title || item.name || 'PC Panel';
                const img = item.image || item.img || 'https://via.placeholder.com/230x140/11071a/ff007f?text=PC';

                const box = document.createElement('div');
                box.className = 'product-box';
                box.onclick = () => openActionModal(key);
                box.innerHTML = `
                    <img src="${img}" class="product-box-img" alt="${title}" onerror="this.src='https://via.placeholder.com/230x140/11071a/ff007f?text=No+Image'">
                    <div class="product-box-name">${title}</div>
                    <div class="click-hint"><i class="fas fa-cog"></i> Click to Edit / Delete</div>
                `;
                grid.appendChild(box);
            });
        });

        // Action Modal
        window.openActionModal = (key) => {
            activeKey = key;
            const item = pcProducts[key];
            document.getElementById('actionTitle').innerText = item.title || item.name || 'PC Panel';
            document.getElementById('actionModal').style.display = 'flex';
        };

        window.closeActionModal = () => {
            document.getElementById('actionModal').style.display = 'none';
        };

        window.triggerEdit = () => {
            closeActionModal();
            if (activeKey) editProduct(activeKey);
        };

        window.triggerDelete = () => {
            closeActionModal();
            if (activeKey && confirm('Delete this product permanently?')) {
                remove(ref(db, 'pc_panels/' + activeKey))
                    .then(() => alert('Deleted!'))
                    .catch(e => alert('Error: ' + e.message));
            }
        };

        // Form Handlers
        window.openAddModal = () => {
            document.getElementById('editKey').value = '';
            document.getElementById('productForm').reset();
            document.getElementById('formTitle').innerText = 'Add New PC Panel';
            document.getElementById('productModal').style.display = 'flex';
        };

        window.closeProductModal = () => {
            document.getElementById('productModal').style.display = 'none';
        };

        // Smart populate logic to fix misplaced values
        function populatePkgRow(durationMatch, sellId, oldId, pkgs) {
            let sellVal = '';
            let oldVal = '';

            if (Array.isArray(pkgs)) {
                pkgs.forEach(pkg => {
                    if (!pkg) return;
                    let d = (pkg.duration || pkg.name || pkg.title || '').toLowerCase();
                    if (d.includes(durationMatch)) {
                        sellVal = pkg.sell_price || pkg.salePrice || pkg.price || pkg.val || '';
                        oldVal = pkg.old_price || pkg.oldPrice || pkg.old || '';
                    }
                });
            } else if (typeof pkgs === 'object' && pkgs !== null) {
                Object.keys(pkgs).forEach(key => {
                    let d = key.toLowerCase();
                    if (d.includes(durationMatch)) {
                        let val = pkgs[key];
                        if (typeof val === 'object' && val !== null) {
                            sellVal = val.sell_price || val.salePrice || val.price || '';
                            oldVal = val.old_price || val.oldPrice || val.old || '';
                        } else {
                            sellVal = val; // Single scalar price = Sale Price
                        }
                    }
                });
            }

            // HEURISTIC FIX: If sell price is empty but old price has a value, move it to sell price!
            if (!sellVal && oldVal) {
                sellVal = oldVal;
                oldVal = '';
            }

            document.getElementById(sellId).value = sellVal;
            document.getElementById(oldId).value = oldVal;
        }

        function editProduct(key) {
            const item = pcProducts[key];
            if (!item) return;

            document.getElementById('editKey').value = key;
            document.getElementById('pTitle').value = item.title || item.name || '';
            document.getElementById('pImage').value = item.image || '';
            document.getElementById('pOldPrice').value = item.old_price || item.oldPrice || '';
            document.getElementById('pSalePrice').value = item.sell_price || item.salePrice || item.price || '';
            document.getElementById('pBuyPrice').value = item.buy_price || item.buyPrice || '';
            document.getElementById('pDownload').value = item.downloadLink || item.download || '';

            const pkgs = item.packages || item.package || item.prices || [];

            populatePkgRow('1 day', 'sell_1d', 'old_1d', pkgs);
            populatePkgRow('7 day', 'sell_7d', 'old_7d', pkgs);
            populatePkgRow('month', 'sell_1m', 'old_1m', pkgs);
            populatePkgRow('life', 'sell_life', 'old_life', pkgs);

            document.getElementById('formTitle').innerText = 'Edit PC Panel';
            document.getElementById('productModal').style.display = 'flex';
        }

        window.saveProduct = (e) => {
            e.preventDefault();
            const editKey = document.getElementById('editKey').value;

            const packages = [];

            const addPkg = (duration, sellId, oldId) => {
                const sell = document.getElementById(sellId).value.trim();
                const old = document.getElementById(oldId).value.trim();

                if (sell !== '' || old !== '') {
                    packages.push({
                        duration: duration,
                        sell_price: sell || old,
                        old_price: old && sell ? old : ''
                    });
                }
            };

            addPkg('1 Days', 'sell_1d', 'old_1d');
            addPkg('7 Days', 'sell_7d', 'old_7d');
            addPkg('1 Months', 'sell_1m', 'old_1m');
            addPkg('Lifetime', 'sell_life', 'old_life');

            const payload = {
                title: document.getElementById('pTitle').value.trim(),
                image: document.getElementById('pImage').value.trim(),
                old_price: document.getElementById('pOldPrice').value.trim() || '',
                sell_price: document.getElementById('pSalePrice').value.trim() || '',
                buy_price: document.getElementById('pBuyPrice').value.trim() || '',
                downloadLink: document.getElementById('pDownload').value.trim() || '',
                packages: packages,
                updatedAt: new Date().toISOString()
            };

            const dbRef = editKey
                ? ref(db, 'pc_panels/' + editKey)
                : push(ref(db, 'pc_panels'));

            set(dbRef, payload)
                .then(() => {
                    alert('Product saved successfully!');
                    closeProductModal();
                })
                .catch(err => alert('Error: ' + err.message));
        };
    </script>
</body>
</html>
