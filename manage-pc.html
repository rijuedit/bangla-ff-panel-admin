<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage PC Panels - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05020a;
            --bg-card: #0c0514;
            --neon-purple: #9d00ff;
            --neon-pink: #ff0066;
            --neon-green: #00cc66;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --border-color: #2a113d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: rgba(12, 5, 20, 0.95);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000;
        }
        .brand-text { display: flex; flex-direction: column; }
        .brand-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 700; color: #fff; letter-spacing: 1px; }
        .brand-subtitle { font-size: 0.8rem; color: var(--neon-pink); font-weight: 700; letter-spacing: 2px; }
        .btn-nav {
            background: #11071a; color: #fff; padding: 8px 20px; border-radius: 6px;
            text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 8px;
            border: 1px solid var(--border-color); transition: 0.3s;
        }
        .btn-nav:hover { border-color: var(--neon-purple); background: #1a0b2e; }

        .action-bar { display: flex; gap: 15px; padding: 30px 20px 20px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
        .btn-neon {
            background: rgba(157, 0, 255, 0.2); border: 1px solid var(--neon-purple);
            color: white; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-neon:hover { background: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto;
        }
        .product-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 25px 20px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .product-card:hover { border-color: var(--neon-purple); transform: translateY(-5px); }
        .product-img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 15px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 2, 10, 0.95); z-index: 2000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--neon-purple);
            width: 100%; max-width: 560px; border-radius: 15px; padding: 25px; max-height: 90vh; overflow-y: auto;
        }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; color: var(--text-dim); font-size: 0.95rem; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; background: #1a0b2e; border: 1px solid var(--border-color);
            color: white; border-radius: 8px; outline: none; font-size: 1rem;
        }
        .price-row { display: flex; gap: 15px; }
        .price-row .input-group { flex: 1; }

        .pkg-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .pkg-row input, .pkg-row select {
            background: #1a0b2e !important; border: 1px solid var(--border-color) !important;
            color: #fff !important; padding: 10px !important; border-radius: 6px !important; outline: none !important;
        }
        .btn-del-pkg {
            background: var(--neon-pink); border: none; color: white;
            padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="brand-text">
        <span class="brand-title">ADMIN PANEL</span>
        <span class="brand-subtitle">MANAGE PC PANELS</span>
    </div>
    <a href="index.html" class="btn-nav"><i class="fas fa-home"></i> Back to Dashboard</a>
</header>

<div class="action-bar">
    <button class="btn-neon" onclick="openProductModal()"><i class="fas fa-plus"></i> Add New PC Panel</button>
    <button class="btn-neon" style="border-color: var(--neon-green);" onclick="openVideoModal()"><i class="fas fa-video"></i> Set PC Setup Video</button>
</div>

<div class="products-grid" id="adminGrid">
    <p style="text-align:center; grid-column:1/-1; color:var(--text-dim);"><i class="fas fa-spinner fa-spin"></i> Loading PC Panels...</p>
</div>

<!-- Add / Edit Product Modal -->
<div id="prodModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="color:var(--neon-purple); margin-bottom:15px; font-family:'Orbitron';">Add PC Product</h3>

        <div class="input-group">
            <label>Product Name</label>
            <input type="text" id="pName" placeholder="e.g. ULTRA PC PANEL">
        </div>
        <div class="input-group">
            <label>Image URL</label>
            <input type="text" id="pImg" placeholder="https://...">
        </div>
        <div class="price-row">
            <div class="input-group">
                <label>Old Price (৳)</label>
                <input type="number" id="pOldPrice" placeholder="e.g. 500">
            </div>
            <div class="input-group">
                <label>Sale Price (৳)</label>
                <input type="number" id="pSalePrice" placeholder="e.g. 300">
            </div>
        </div>
        <div class="input-group">
            <label>Download / Key Link</label>
            <input type="text" id="pLink" placeholder="https://mediafire.com/...">
        </div>

        <h4 style="margin:15px 0 10px; color:var(--neon-green);">Packages</h4>
        <div id="pkgContainer"></div>
        <button class="btn-neon" style="font-size:0.85rem; margin-bottom:15px; padding:8px 15px;" onclick="addPkgRow()">
            <i class="fas fa-plus"></i> Add Package Row
        </button>

        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-neon" style="flex:1; background:var(--neon-purple);" onclick="saveProduct()">Save Product</button>
            <button class="btn-neon" style="flex:1; border-color:var(--neon-pink);" onclick="closeProdModal()">Cancel</button>
        </div>
        <button id="deleteBtn" class="btn-neon" style="width:100%; margin-top:12px; border-color:var(--neon-pink); display:none;" onclick="deleteProduct()">
            <i class="fas fa-trash"></i> Delete Product
        </button>
    </div>
</div>

<!-- Video Modal -->
<div id="videoModal" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--neon-green); margin-bottom:15px; font-family:'Orbitron';">Set PC Setup Video</h3>
        <div class="input-group">
            <label>YouTube or Google Drive Link</label>
            <input type="text" id="videoUrl" placeholder="https://youtube.com/watch?v=... or Drive link">
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-neon" style="flex:1; background:var(--neon-green); color:#000;" onclick="saveVideo()">Save Video</button>
            <button class="btn-neon" style="flex:1; border-color:var(--neon-pink);" onclick="closeVideoModal()">Cancel</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
    const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentEditId = null;

    function isProduct(obj) {
        return obj && typeof obj === 'object' && (obj.name || obj.title || obj.image || obj.img || obj.packages || obj.price || obj.salePrice);
    }

    function getSafePrice(item) {
        if (!item) return 0;
        const keys = ['salePrice', 'price', 'newPrice', 'buyPrice', 'resellPrice', 'value'];
        for (const k of keys) {
            if (item[k] != null && parseInt(item[k]) > 0) return parseInt(item[k]);
        }
        return 0;
    }

    function loadAdminProducts() {
        const grid = document.getElementById('adminGrid');

        // শুধু products/pc থেকে লোড (সঠিক পাথ)
        db.ref('products/pc').on('value', snap => {
            grid.innerHTML = '';
            if (!snap.exists() || !snap.hasChildren()) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-dim);">No PC panels found. Click "Add New PC Panel" to add one.</p>';
                return;
            }

            let count = 0;
            snap.forEach(child => {
                const p = child.val();
                if (!isProduct(p)) return;
                count++;
                const key = child.key;
                const name = p.name || p.title || 'PC Panel';
                const img = p.image || p.img || 'logo.png';
                const saleP = getSafePrice(p);
                const oldP = parseInt(p.oldPrice || p.originalPrice || 0) || 0;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => editProduct(key, p);
                card.innerHTML = `
                    <img src="${img}" class="product-img" onerror="this.src='logo.png'">
                    <div style="font-weight:bold; color:var(--neon-purple); font-size:1.2rem; margin-bottom:6px;">${name}</div>
                    <div style="color:var(--neon-green); font-weight:bold; font-size:1.1rem;">
                        ৳${saleP}
                        ${oldP > saleP ? `<span style="text-decoration:line-through; color:var(--text-dim); font-size:0.85rem; margin-left:6px;">৳${oldP}</span>` : ''}
                    </div>
                    <div style="font-size:0.85rem; color:var(--text-dim); margin-top:10px; background:#11071a; padding:6px; border-radius:5px;">
                        <i class="fas fa-edit"></i> Click to Edit
                    </div>
                `;
                grid.appendChild(card);
            });

            if (count === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-dim);">No PC panels found. Click "Add New PC Panel" to add one.</p>';
            }
        });
    }

    function openProductModal() {
        currentEditId = null;
        document.getElementById('modalTitle').innerText = 'Add PC Product';
        document.getElementById('pName').value = '';
        document.getElementById('pImg').value = '';
        document.getElementById('pOldPrice').value = '';
        document.getElementById('pSalePrice').value = '';
        document.getElementById('pLink').value = '';
        document.getElementById('pkgContainer').innerHTML = '';
        document.getElementById('deleteBtn').style.display = 'none';
        addPkgRow();
        document.getElementById('prodModal').style.display = 'flex';
    }

    function closeProdModal() {
        document.getElementById('prodModal').style.display = 'none';
    }

    function addPkgRow(qty = 1, unit = 'Days', price = 100) {
        const div = document.createElement('div');
        div.className = 'pkg-row';
        div.innerHTML = `
            <input type="number" class="pkg-qty" value="${qty}" style="width:80px;" ${unit === 'Lifetime' ? 'disabled' : ''}>
            <select class="pkg-unit" onchange="toggleQty(this)" style="width:110px;">
                <option value="Hours" ${unit === 'Hours' ? 'selected' : ''}>Hours</option>
                <option value="Days" ${unit === 'Days' ? 'selected' : ''}>Days</option>
                <option value="Months" ${unit === 'Months' ? 'selected' : ''}>Months</option>
                <option value="Years" ${unit === 'Years' ? 'selected' : ''}>Years</option>
                <option value="Lifetime" ${unit === 'Lifetime' ? 'selected' : ''}>Lifetime</option>
            </select>
            <input type="number" class="pkg-price" value="${price}" placeholder="Price ৳" style="flex:1;">
            <button class="btn-del-pkg" onclick="this.parentElement.remove()">X</button>
        `;
        document.getElementById('pkgContainer').appendChild(div);
    }

    function toggleQty(sel) {
        const qty = sel.parentElement.querySelector('.pkg-qty');
        if (sel.value === 'Lifetime') { qty.value = 1; qty.disabled = true; }
        else qty.disabled = false;
    }

    function editProduct(id, p) {
        currentEditId = id;
        document.getElementById('modalTitle').innerText = 'Edit PC Product';
        document.getElementById('pName').value = p.name || p.title || '';
        document.getElementById('pImg').value = p.image || p.img || '';
        document.getElementById('pOldPrice').value = p.oldPrice || p.originalPrice || '';
        document.getElementById('pSalePrice').value = p.salePrice || p.price || '';
        document.getElementById('pLink').value = p.link || p.downloadLink || '';
        document.getElementById('deleteBtn').style.display = 'block';

        const box = document.getElementById('pkgContainer');
        box.innerHTML = '';
        if (p.packages) {
            Object.values(p.packages).forEach(pkg => {
                addPkgRow(pkg.qty || 1, pkg.unit || 'Days', getSafePrice(pkg));
            });
        } else {
            addPkgRow(1, 'Days', getSafePrice(p) || 100);
        }
        document.getElementById('prodModal').style.display = 'flex';
    }

    function saveProduct() {
        const name = document.getElementById('pName').value.trim();
        if (!name) return alert('Product Name দিন');

        const image = document.getElementById('pImg').value.trim();
        const oldPrice = parseInt(document.getElementById('pOldPrice').value) || 0;
        const salePrice = parseInt(document.getElementById('pSalePrice').value) || 0;
        const link = document.getElementById('pLink').value.trim();

        const packages = {};
        document.querySelectorAll('.pkg-row').forEach((row, i) => {
            const qty = parseInt(row.querySelector('.pkg-qty').value) || 1;
            const unit = row.querySelector('.pkg-unit').value;
            const price = parseInt(row.querySelector('.pkg-price').value) || salePrice || 0;
            packages['pkg_' + i] = { qty, unit, price };
        });

        const data = {
            name, image, oldPrice, salePrice, price: salePrice, link, packages
        };

        if (currentEditId) {
            db.ref('products/pc/' + currentEditId).set(data);
        } else {
            db.ref('products/pc').push(data);
        }
        closeProdModal();
    }

    function deleteProduct() {
        if (!currentEditId) return;
        if (!confirm('এই প্রোডাক্ট ডিলিট করবেন?')) return;
        db.ref('products/pc/' + currentEditId).remove();
        closeProdModal();
    }

    function openVideoModal() {
        db.ref('settings/video_pc').once('value', s => {
            const v = s.val();
            if (v && v.url) document.getElementById('videoUrl').value = v.url;
        });
        document.getElementById('videoModal').style.display = 'flex';
    }
    function closeVideoModal() { document.getElementById('videoModal').style.display = 'none'; }
    function saveVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        db.ref('settings/video_pc').set({ url });
        alert('Video Saved!');
        closeVideoModal();
    }

    loadAdminProducts();
</script>
</body>
</html>
