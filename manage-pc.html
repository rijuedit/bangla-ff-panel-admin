<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage PC Panel - OXI ADMIN</title>
    
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Theme */
        body { background-color: #05020a; color: #ffffff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #05020a; }
        ::-webkit-scrollbar-thumb { background: #9d00ff; border-radius: 4px; }

        /* Sidebar Design */
        .sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; background: #11071a; border-right: 1px solid #2a113d; padding: 20px 0; overflow-y: auto; }
        .sidebar-logo { text-align: center; color: #ff0066; font-size: 22px; font-weight: 800; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }
        .nav-link { color: #a385bd; padding: 12px 20px; font-weight: 500; transition: 0.3s; border-left: 3px solid transparent; margin-bottom: 5px; font-size: 15px; }
        .nav-link:hover, .nav-link.active { color: #ffffff; background: rgba(157, 0, 255, 0.1); border-left-color: #9d00ff; }
        .nav-link i { width: 25px; text-align: center; margin-right: 5px; }

        /* Main Content */
        .main-content { margin-left: 250px; padding: 30px; }

        /* Buttons (Fixed Overlap Issue) */
        .btn-purple { background: #9d00ff; color: white; border: none; font-weight: 600; padding: 8px 18px; border-radius: 6px; font-size: 14px; }
        .btn-purple:hover { background: #7a00cc; color: white; }
        .btn-pink { background: #ff0066; color: white; border: none; font-weight: 600; padding: 8px 18px; border-radius: 6px; font-size: 14px; }
        .btn-pink:hover { background: #cc0052; color: white; }

        /* Table Design */
        .table-container { background: #11071a; border: 1px solid #2a113d; border-radius: 12px; padding: 20px; overflow-x: auto; margin-top: 20px; }
        .custom-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        .custom-table th { color: #a385bd; font-size: 12px; text-transform: uppercase; padding: 10px 15px; border-bottom: 1px solid #2a113d; font-weight: 600; }
        .custom-table td { background: #0c0514; padding: 15px; vertical-align: middle; border-top: 1px solid #2a113d; border-bottom: 1px solid #2a113d; }
        .custom-table td:first-child { border-left: 1px solid #2a113d; border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .custom-table td:last-child { border-right: 1px solid #2a113d; border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

        /* Action Buttons in Table */
        .btn-action { width: 32px; height: 32px; border-radius: 6px; border: none; display: inline-flex; justify-content: center; align-items: center; margin: 0 3px; color: white; }
        .btn-edit { background: #ffaa00; }
        .btn-delete { background: #ff0066; }

        /* 🔥 NEW PACKAGE CARDS DESIGN 🔥 */
        .pkg-wrapper { display: flex; flex-wrap: wrap; gap: 12px; }
        .pkg-card { background: #11071a; border: 1px solid #2a113d; border-radius: 8px; padding: 10px; flex: 1; min-width: 220px; max-width: 280px; }
        .pkg-title { color: #00cc66; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px dashed #2a113d; text-transform: uppercase; }
        .pkg-prices { display: flex; gap: 6px; justify-content: space-between; }
        
        .p-box { background: #05020a; border: 1px solid #3d1c56; border-radius: 5px; padding: 6px; text-align: center; flex: 1; }
        .p-val { display: block; font-size: 13px; font-weight: bold; color: #ffffff; }
        .p-label { display: block; font-size: 9px; color: #a385bd; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Price Colors */
        .p-box.old .p-val { color: #ff0066; text-decoration: line-through; }
        .p-box.sale .p-val { color: #00cc66; }
        .p-box.buy .p-val { color: #9d00ff; }
        
        /* Modal UI */
        .modal-content { background-color: #11071a; border: 1px solid #9d00ff; border-radius: 12px; color: white; }
        .modal-header, .modal-footer { border-color: #2a113d; }
        .form-control { background-color: #05020a; border: 1px solid #2a113d; color: white; }
        .form-control:focus { background-color: #0c0514; border-color: #9d00ff; color: white; box-shadow: none; }
        .form-label { color: #a385bd; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">OXI ADMIN</div>
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a class="nav-link active" href="manage-pc.html"><i class="fa-solid fa-desktop"></i> Manage PC Panel</a>
            <a class="nav-link" href="manage-mobile.html"><i class="fa-solid fa-mobile-screen"></i> Manage Mobile Panel</a>
            <a class="nav-link" href="manage-free-panel.html"><i class="fa-solid fa-gift"></i> Manage Free Panel</a>
            <a class="nav-link" href="manage-free-bypass.html"><i class="fa-solid fa-bolt"></i> Manage Free Bypass</a>
            <a class="nav-link" href="manage-emulator.html"><i class="fa-solid fa-gamepad"></i> Manage Emulator</a>
            <a class="nav-link" href="admin-users.html"><i class="fa-solid fa-users"></i> Admin Users</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Header Section (Buttons Overlap Fixed Here) -->
        <div class="d-flex justify-content-between align-items-start mb-4">
            <h3 class="text-white mb-0" style="font-weight: 700;">
                <i class="fa-solid fa-desktop text-white me-2"></i> PC Panels
            </h3>
            
            <!-- ✅ বাটন দুটোকে Flex Column দিয়ে আলাদা করা হয়েছে -->
            <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-end;">
                <button class="btn-purple" data-bs-toggle="modal" data-bs-target="#globalLinkModal">
                    <i class="fa-solid fa-link"></i> Global Buy Link
                </button>
                <button class="btn-pink" data-bs-toggle="modal" data-bs-target="#addProductModal">
                    <i class="fa-solid fa-plus"></i> Add Product
                </button>
            </div>
        </div>

        <!-- Table Section -->
        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th width="10%">IMAGE</th>
                        <th width="20%">PANEL NAME</th>
                        <th width="60%">AVAILABLE PACKAGES</th>
                        <th width="10%">ACTION</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <!-- JavaScript দিয়ে ডাটাবেস থেকে প্রোডাক্ট এখানে আসবে -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ⚠️ আপনার আগের Firebase Config কোডটি ঠিক এখানে বসাবেন ⚠️
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // Load Products in Table
        function loadProducts() {
            const productsRef = database.ref('pc_panels');
            productsRef.on('value', (snapshot) => {
                const tbody = document.getElementById('productsTableBody');
                tbody.innerHTML = '';
                
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const product = childSnapshot.val();
                    
                    // ✅ প্যাকেজ বক্সের নতুন ডিজাইন লজিক
                    let packagesHTML = '<div class="pkg-wrapper">';
                    if (product.packages && product.packages.length > 0) {
                        product.packages.forEach(pkg => {
                            packagesHTML += `
                            <div class="pkg-card">
                                <div class="pkg-title">${pkg.duration}</div>
                                <div class="pkg-prices">
                                    <div class="p-box old">
                                        <span class="p-val">৳${pkg.oldPrice || 0}</span>
                                        <span class="p-label">Old Price</span>
                                    </div>
                                    <div class="p-box sale">
                                        <span class="p-val">৳${pkg.newPrice || 0}</span>
                                        <span class="p-label">Sale</span>
                                    </div>
                                    <div class="p-box buy">
                                        <span class="p-val">৳${pkg.resellPrice || 0}</span>
                                        <span class="p-label">Buy</span>
                                    </div>
                                </div>
                            </div>`;
                        });
                    } else {
                        packagesHTML += `<span style="color:#ff0066; font-size:13px;">No packages found</span>`;
                    }
                    packagesHTML += '</div>';

                    // টেবিল রো তৈরি করা
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <img src="${product.imageUrl || 'https://via.placeholder.com/60'}" 
                                 style="width: 60px; height: 60px; border-radius: 8px; border: 1px solid #9d00ff; object-fit: cover;">
                        </td>
                        <td style="font-weight: bold; color: #ffffff;">${product.name || 'Unnamed Panel'}</td>
                        <td>${packagesHTML}</td>
                        <td>
                            <button class="btn-action btn-edit" onclick="editProduct('${id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-action btn-delete" onclick="deleteProduct('${id}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // Delete Logic
        function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this panel?")) {
                database.ref('pc_panels/' + id).remove()
                .then(() => alert("Product deleted successfully!"))
                .catch(err => alert("Error: " + err.message));
            }
        }

        // পেজ লোড হলে ডাটা আনা শুরু করবে
        window.onload = loadProducts;
    </script>
</body>
</html>
