<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage PC Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');
        :root {
            --bg-dark: #07030b;
            --card-bg: #110c1d;
            --neon-purple: #a855f7;
            --neon-pink: #ff007f;
            --neon-red: #ef4444;
        }
        body { background-color: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .navbar { background: rgba(17, 12, 29, 0.9); backdrop-filter: blur(10px); border-bottom: 2px solid var(--neon-purple); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .btn-back { border: 1px solid var(--neon-purple); padding: 8px 20px; border-radius: 5px; transition: 0.3s; }
        .btn-back:hover { background: var(--neon-purple); box-shadow: 0 0 15px var(--neon-purple); }
        .video-manager { background: var(--card-bg); border: 1px solid #2d2640; border-radius: 12px; padding: 20px; margin: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .product-card { background: var(--card-bg); border: 1px solid #2d2640; border-radius: 15px; overflow: hidden; transition: 0.3s; }
        .product-card:hover { border-color: var(--neon-purple); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #0f0a19; width: 100%; max-width: 850px; border: 1.5px solid var(--neon-purple); border-radius: 12px; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid #2d2640; display: flex; justify-content: space-between; align-items: center; }
        .styled-input { width: 100%; background: #07030b; border: 1px solid #2d2640; color: white; padding: 10px; border-radius: 6px; outline: none; }
        .styled-input:focus { border-color: var(--neon-purple); }
        .package-row { display: grid; grid-template-columns: 0.8fr 1.5fr 1fr 1fr 1fr 60px; gap: 10px; align-items: end; padding: 10px 20px; }
        .btn-add-pkg { background: var(--neon-purple); padding: 10px 20px; border-radius: 6px; margin: 15px 20px; font-weight: bold; }
        .btn-remove-pkg { background: var(--neon-red); height: 42px; border-radius: 6px; display: flex; align-items: center; justify-content: center; width: 100%; }
        .modal-footer { padding: 20px; border-top: 1px solid #2d2640; display: flex; justify-content: flex-end; gap: 15px; background: #0f0a19; }
        .btn-save { background: var(--neon-pink); padding: 10px 25px; border-radius: 6px; font-weight: bold; }
        .btn-cancel { background: #4b5563; padding: 10px 25px; border-radius: 6px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="btn-back">BACK</a>
        <div class="orbitron text-xl font-bold tracking-widest">MANAGE PC PANEL</div>
        <div style="width: 70px;"></div>
    </nav>

    <div class="video-manager">
        <h3 class="orbitron text-purple-400 mb-4 text-xs">PC SETUP VIDEO URL</h3>
        <div class="flex gap-3">
            <input type="text" id="videoUrlInput" class="styled-input" placeholder="YouTube or Drive Link...">
            <button onclick="saveVideoUrl()" class="btn-save whitespace-nowrap">UPDATE</button>
        </div>
    </div>

    <div class="flex justify-between items-center px-6 mt-6">
        <h2 class="orbitron text-lg">PRODUCTS</h2>
        <button onclick="openModal('add')" class="btn-add-pkg m-0">+ ADD PRODUCT</button>
    </div>

    <div class="product-grid" id="productGrid"></div>

    <!-- Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="orbitron text-lg" id="modalTitle">Add New Product</h2>
                <button onclick="closeModal()" class="text-2xl">&times;</button>
            </div>

            <div class="p-5">
                <label class="text-xs text-gray-400 block mb-2 uppercase">Panel Name</label>
                <input type="text" id="pTitle" class="styled-input mb-4" placeholder="Enter Panel Name">

                <label class="text-xs text-gray-400 block mb-2 uppercase">Image URL</label>
                <input type="text" id="pImage" class="styled-input mb-6" placeholder="Enter Image URL">

                <h3 class="orbitron text-sm text-white mb-2">Packages</h3>
                <hr class="border-gray-800 mb-4">

                <div id="packageContainer"></div>
                <button onclick="addPackageRow()" class="btn-add-pkg">+ Add Package</button>
            </div>

            <div class="modal-footer">
                <button onclick="closeModal()" class="btn-cancel">Cancel</button>
                <button id="saveBtn" class="btn-save">Save Product</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentEditId = null;

        window.saveVideoUrl = () => {
            set(ref(db, 'settings/video_pc'), document.getElementById('videoUrlInput').value).then(() => alert("Updated!"));
        };

        onValue(ref(db, 'settings/video_pc'), (s) => { if(s.exists()) document.getElementById('videoUrlInput').value = s.val(); });

        window.addPackageRow = (d = {}) => {
            const container = document.getElementById('packageContainer');
            const row = document.createElement('div');
            row.className = 'package-row';
            row.innerHTML = `
                <div><label class="text-[10px] text-gray-400 block mb-1">Duration</label><input type="number" class="styled-input pkg-val" value="${d.val || ''}"></div>
                <div><label class="text-[10px] text-gray-400 block mb-1">&nbsp;</label><select class="styled-input pkg-unit"><option value="Hours" ${d.unit==='Hours'?'selected':''}>Hours</option><option value="Days" ${d.unit==='Days'?'selected':''}>Days</option><option value="Months" ${d.unit==='Months'?'selected':''}>Months</option><option value="Lifetime" ${d.unit==='Lifetime'?'selected':''}>Lifetime</option></select></div>
                <div><label class="text-[10px] text-gray-400 block mb-1">Old Price</label><input type="number" class="styled-input pkg-old" value="${d.old || ''}"></div>
                <div><label class="text-[10px] text-gray-400 block mb-1">Sale Price</label><input type="number" class="styled-input pkg-sell" value="${d.sell || ''}"></div>
                <div><label class="text-[10px] text-gray-400 block mb-1">Buy Price</label><input type="number" class="styled-input pkg-buy" value="${d.buy || ''}"></div>
                <button onclick="this.parentElement.remove()" class="btn-remove-pkg"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(row);
        };

        window.openModal = (mode, id = null) => {
            currentEditId = id;
            document.getElementById('packageContainer').innerHTML = '';
            if(mode === 'add') {
                document.getElementById('modalTitle').innerText = "Add New Product";
                document.getElementById('pTitle').value = ''; document.getElementById('pImage').value = '';
                addPackageRow();
                document.getElementById('saveBtn').onclick = () => saveProduct('add');
            }
            document.getElementById('productModal').style.display = 'flex';
        };

        window.closeModal = () => document.getElementById('productModal').style.display = 'none';

        function saveProduct(mode) {
            const title = document.getElementById('pTitle').value;
            const image = document.getElementById('pImage').value;
            let packages = [];
            document.querySelectorAll('.package-row').forEach(row => {
                const sell = row.querySelector('.pkg-sell').value;
                if(sell) packages.push({
                    duration: row.querySelector('.pkg-val').value + " " + row.querySelector('.pkg-unit').value,
                    durationValue: row.querySelector('.pkg-val').value,
                    durationUnit: row.querySelector('.pkg-unit').value,
                    old_price: row.querySelector('.pkg-old').value,
                    sell_price: sell,
                    buy_price: row.querySelector('.pkg-buy').value
                });
            });
            const data = { title, image, packages };
            if(mode === 'add') push(ref(db, 'pc_panels'), data).then(closeModal);
            else update(ref(db, `pc_panels/${currentEditId}`), data).then(closeModal);
        }

        onValue(ref(db, 'pc_panels'), (s) => {
            const grid = document.getElementById('productGrid'); grid.innerHTML = '';
            if(s.exists()) Object.keys(s.val()).forEach(id => {
                const p = s.val()[id];
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `<img src="${p.image}" class="w-full h-32 object-cover border-b border-gray-800">
                    <div class="p-3"><h3 class="orbitron text-sm font-bold truncate">${p.title}</h3>
                    <div class="flex gap-2 mt-3">
                        <button onclick="editProduct('${id}')" class="flex-1 border border-purple-500 text-purple-400 py-1 rounded text-xs">EDIT</button>
                        <button onclick="deleteProduct('${id}')" class="bg-red-900/20 border border-red-500 text-red-400 px-3 rounded text-xs"><i class="fas fa-trash"></i></button>
                    </div></div>`;
                grid.appendChild(card);
            });
        });

        window.editProduct = (id) => {
            onValue(ref(db, `pc_panels/${id}`), (s) => {
                const p = s.val(); openModal('edit', id);
                document.getElementById('modalTitle').innerText = "Edit PC Panel";
                document.getElementById('pTitle').value = p.title; document.getElementById('pImage').value = p.image;
                if(p.packages) p.packages.forEach(pkg => addPackageRow({ val: pkg.durationValue, unit: pkg.durationUnit, old: pkg.old_price, sell: pkg.sell_price, buy: pkg.buy_price }));
                document.getElementById('saveBtn').onclick = () => saveProduct('edit');
            }, {onlyOnce: true});
        };

        window.deleteProduct = (id) => { if(confirm("Delete?")) remove(ref(db, `pc_panels/${id}`)); };
    </script>
</body>
</html>
