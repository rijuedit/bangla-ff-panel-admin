<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage PC Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-dark: #07030b;
            --card-bg: #0d0818;
            --neon-purple: #a855f7;
            --neon-pink: #ff007f;
            --neon-red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* Navbar */
        .navbar {
            background: rgba(13, 8, 24, 0.95);
            border-bottom: 2px solid var(--neon-purple);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-nav {
            border: 1px solid var(--neon-purple);
            padding: 6px 15px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-nav:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* Video Section */
        .video-manager {
            background: var(--card-bg);
            border: 1px solid #2d2640;
            border-radius: 12px;
            padding: 15px;
            margin: 20px;
        }

        /* Product Grid & Cards (Like Pic 2) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 25px;
        }

        .product-card {
            background: #0f0a1d;
            border: 1px solid #1f1a2e;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .product-card:hover {
            border-color: var(--neon-purple);
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid #2d2640;
        }

        .product-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: white;
            text-transform: uppercase;
        }

        /* Buttons Like Pic 2 */
        .btn-edit {
            background: linear-gradient(90deg, #d400ff, #ff007f);
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            transition: 0.3s;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 10px 15px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background: var(--neon-red);
            color: white;
        }

        /* Modal (Matching Pic 1) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f0a19;
            width: 100%;
            max-width: 850px;
            border: 1.5px solid var(--neon-purple);
            border-radius: 12px;
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
        }

        .styled-input {
            width: 100%;
            background: #07030b;
            border: 1px solid #2d2640;
            color: white;
            padding: 12px;
            border-radius: 6px;
            outline: none;
        }

        .package-row {
            display: grid;
            grid-template-columns: 0.8fr 1.5fr 1fr 1fr 1fr 50px;
            gap: 10px;
            margin-bottom: 15px;
            align-items: end;
        }

        .btn-save { background: var(--neon-pink); padding: 10px 25px; border-radius: 6px; font-weight: bold; }
        .btn-cancel { background: #4b5563; padding: 10px 25px; border-radius: 6px; }
        .btn-add-pkg { background: var(--neon-purple); padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 13px; }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="btn-nav">BACK</a>
        <div class="orbitron text-lg font-bold tracking-widest">MANAGE PC PANEL</div>
        <div style="width: 60px;"></div>
    </nav>

    <div class="video-manager">
        <label class="orbitron text-[10px] text-purple-400 block mb-2">PC SETUP VIDEO URL</label>
        <div class="flex gap-3">
            <input type="text" id="videoUrlInput" class="styled-input" placeholder="YouTube or Drive Link...">
            <button onclick="saveVideoUrl()" class="btn-save whitespace-nowrap">UPDATE</button>
        </div>
    </div>

    <div class="px-8 mt-8 flex justify-between items-center">
        <h2 class="orbitron text-lg text-white">PRODUCTS</h2>
        <button onclick="openModal('add')" class="btn-add-pkg">+ ADD PRODUCT</button>
    </div>

    <div class="product-grid" id="productGrid">
        <!-- Cards will load here -->
    </div>

    <!-- Edit/Add Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="p-5 border-b border-gray-800 flex justify-between items-center">
                <h2 class="orbitron text-lg" id="modalTitle">Add New Product</h2>
                <button onclick="closeModal()" class="text-2xl">&times;</button>
            </div>

            <div class="modal-body">
                <label class="text-[11px] text-gray-400 uppercase block mb-1">Panel Name</label>
                <input type="text" id="pTitle" class="styled-input mb-4" placeholder="Enter Panel Name">

                <label class="text-[11px] text-gray-400 uppercase block mb-1">Image URL</label>
                <input type="text" id="pImage" class="styled-input mb-6" placeholder="Enter Image URL">

                <div class="flex justify-between items-center mb-2">
                    <h3 class="orbitron text-sm">Packages</h3>
                    <button onclick="addPackageRow()" class="btn-add-pkg">+ Add Package</button>
                </div>
                <hr class="border-gray-800 mb-4">

                <div id="packageContainer"></div>
            </div>

            <div class="p-5 border-t border-gray-800 flex justify-end gap-4 bg-[#0f0a19]">
                <button onclick="closeModal()" class="btn-cancel">Cancel</button>
                <button id="saveBtn" class="btn-save">Save Product</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentEditId = null;

        window.saveVideoUrl = () => {
            set(ref(db, 'settings/video_pc'), document.getElementById('videoUrlInput').value).then(() => alert("Updated!"));
        };

        onValue(ref(db, 'settings/video_pc'), (s) => { if(s.exists()) document.getElementById('videoUrlInput').value = s.val(); });

        window.addPackageRow = (d = {}) => {
            const container = document.getElementById('packageContainer');
            const row = document.createElement('div');
            row.className = 'package-row';
            row.innerHTML = `
                <div><label class="text-[10px] text-gray-500 mb-1 block">Duration</label><input type="number" class="styled-input pkg-val text-center" value="${d.val || ''}"></div>
                <div><label class="text-[10px] text-gray-500 mb-1 block">Unit</label><select class="styled-input pkg-unit"><option value="Hours" ${d.unit==='Hours'?'selected':''}>Hours</option><option value="Days" ${d.unit==='Days'?'selected':''}>Days</option><option value="Months" ${d.unit==='Months'?'selected':''}>Months</option><option value="Lifetime" ${d.unit==='Lifetime'?'selected':''}>Lifetime</option></select></div>
                <div><label class="text-[10px] text-gray-500 mb-1 block">Old Price</label><input type="number" class="styled-input pkg-old" value="${d.old || ''}"></div>
                <div><label class="text-[10px] text-gray-500 mb-1 block">Sale Price</label><input type="number" class="styled-input pkg-sell" value="${d.sell || ''}"></div>
                <div><label class="text-[10px] text-gray-500 mb-1 block">Buy Price</label><input type="number" class="styled-input pkg-buy" value="${d.buy || ''}"></div>
                <button onclick="this.parentElement.remove()" class="bg-red-500/20 text-red-500 h-[45px] w-full rounded flex items-center justify-center border border-red-500/50"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(row);
        };

        window.openModal = (mode, id = null) => {
            currentEditId = id;
            document.getElementById('packageContainer').innerHTML = '';
            if(mode === 'add') {
                document.getElementById('modalTitle').innerText = "Add New Product";
                document.getElementById('pTitle').value = ''; document.getElementById('pImage').value = '';
                addPackageRow();
                document.getElementById('saveBtn').onclick = () => saveProduct('add');
            }
            document.getElementById('productModal').style.display = 'flex';
        };

        window.closeModal = () => document.getElementById('productModal').style.display = 'none';

        function saveProduct(mode) {
            const title = document.getElementById('pTitle').value;
            const image = document.getElementById('pImage').value;
            let packages = [];
            document.querySelectorAll('.package-row').forEach(row => {
                const sell = row.querySelector('.pkg-sell').value;
                if(sell) packages.push({
                    duration: row.querySelector('.pkg-val').value + " " + row.querySelector('.pkg-unit').value,
                    durationValue: row.querySelector('.pkg-val').value,
                    durationUnit: row.querySelector('.pkg-unit').value,
                    old_price: row.querySelector('.pkg-old').value,
                    sell_price: sell,
                    buy_price: row.querySelector('.pkg-buy').value
                });
            });
            const data = { title, image, packages };
            if(mode === 'add') push(ref(db, 'pc_panels'), data).then(closeModal);
            else update(ref(db, `pc_panels/${currentEditId}`), data).then(closeModal);
        }

        onValue(ref(db, 'pc_panels'), (s) => {
            const grid = document.getElementById('productGrid'); grid.innerHTML = '';
            if(s.exists()) Object.keys(s.val()).forEach(id => {
                const p = s.val()[id];
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image}" class="product-image" onerror="this.src='https://placehold.co/400x200?text=No+Image'">
                    <h3 class="product-title truncate">${p.title}</h3>
                    <div class="flex gap-2">
                        <button onclick="editProduct('${id}')" class="btn-edit"><i class="fas fa-edit"></i> EDIT PANEL</button>
                        <button onclick="deleteProduct('${id}')" class="btn-delete"><i class="fas fa-trash-alt"></i></button>
                    </div>`;
                grid.appendChild(card);
            });
        });

        window.editProduct = (id) => {
            onValue(ref(db, `pc_panels/${id}`), (s) => {
                const p = s.val(); openModal('edit', id);
                document.getElementById('modalTitle').innerText = "Edit PC Panel";
                document.getElementById('pTitle').value = p.title; document.getElementById('pImage').value = p.image;
                if(p.packages) p.packages.forEach(pkg => addPackageRow({ val: pkg.durationValue, unit: pkg.durationUnit, old: pkg.old_price, sell: pkg.sell_price, buy: pkg.buy_price }));
                document.getElementById('saveBtn').onclick = () => saveProduct('edit');
            }, {onlyOnce: true});
        };

        window.deleteProduct = (id) => { if(confirm("Delete this panel?")) remove(ref(db, `pc_panels/${id}`)); };
    </script>
</body>
</html>
