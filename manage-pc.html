<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage PC Panel - OXI ADMIN</title>
    
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Theme */
        body { background-color: #05020a; color: #ffffff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #05020a; }
        ::-webkit-scrollbar-thumb { background: #9d00ff; border-radius: 4px; }

        /* Sidebar Design */
        .sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; background: #11071a; border-right: 1px solid #2a113d; padding: 20px 0; overflow-y: auto; }
        .sidebar-logo { text-align: center; color: #ff0066; font-size: 22px; font-weight: 800; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }
        .nav-link { color: #a385bd; padding: 12px 20px; font-weight: 500; transition: 0.3s; border-left: 3px solid transparent; margin-bottom: 5px; font-size: 15px; }
        .nav-link:hover, .nav-link.active { color: #ffffff; background: rgba(157, 0, 255, 0.1); border-left-color: #9d00ff; }
        .nav-link i { width: 25px; text-align: center; margin-right: 5px; }

        /* Main Content */
        .main-content { margin-left: 250px; padding: 30px; }

        /* Buttons */
        .btn-purple { background: #9d00ff; color: white; border: none; font-weight: 600; padding: 8px 18px; border-radius: 6px; font-size: 14px; }
        .btn-purple:hover { background: #7a00cc; color: white; }
        .btn-pink { background: #ff0066; color: white; border: none; font-weight: 600; padding: 8px 18px; border-radius: 6px; font-size: 14px; }
        .btn-pink:hover { background: #cc0052; color: white; }

        /* 🔥 PRODUCT GRID (বক্স ডিজাইন) 🔥 */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: #11071a; border: 1px solid #2a113d; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; position: relative; }
        .product-card:hover { border-color: #9d00ff; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(157, 0, 255, 0.2); }
        .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; border: 1px solid #9d00ff; }
        .product-name { color: #ffffff; font-size: 16px; font-weight: bold; text-transform: uppercase; }

        /* Modal / Popup UI */
        .modal-content { background-color: #11071a; border: 1px solid #9d00ff; border-radius: 12px; color: white; }
        .modal-header, .modal-footer { border-color: #2a113d; }
        .form-control { background-color: #05020a; border: 1px solid #2a113d; color: white; }
        .form-control:focus { background-color: #0c0514; border-color: #9d00ff; color: white; box-shadow: none; }
        .form-label { color: #a385bd; font-size: 13px; font-weight: 600; margin-bottom: 5px; }

        /* Popup Price Boxes */
        .p-box-container { display: flex; gap: 10px; justify-content: space-between; margin-top: 10px; }
        .p-box { flex: 1; text-align: center; background: #05020a; padding: 8px; border-radius: 6px; border: 1px solid #3d1c56; }
        .p-val { font-weight: bold; display: block; font-size: 15px; }
        .p-label { color: #a385bd; font-size: 10px; text-transform: uppercase; }
        .p-box.old .p-val { color: #ff0066; text-decoration: line-through; }
        .p-box.sale .p-val { color: #00cc66; }
        .p-box.buy .p-val { color: #9d00ff; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">OXI ADMIN</div>
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a class="nav-link active" href="manage-pc.html"><i class="fa-solid fa-desktop"></i> Manage PC Panel</a>
            <a class="nav-link" href="manage-mobile.html"><i class="fa-solid fa-mobile-screen"></i> Manage Mobile Panel</a>
            <a class="nav-link" href="manage-free-panel.html"><i class="fa-solid fa-gift"></i> Manage Free Panel</a>
            <a class="nav-link" href="manage-free-bypass.html"><i class="fa-solid fa-bolt"></i> Manage Free Bypass</a>
            <a class="nav-link" href="manage-emulator.html"><i class="fa-solid fa-gamepad"></i> Manage Emulator</a>
            <a class="nav-link" href="admin-users.html"><i class="fa-solid fa-users"></i> Admin Users</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Header (Buttons side-by-side gap fixed) -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-white mb-0" style="font-weight: 700;">
                <i class="fa-solid fa-desktop text-white me-2"></i> PC Panels
            </h3>
            
            <div style="display: flex; gap: 12px;">
                <button class="btn-purple" onclick="openGlobalLinkModal()">
                    <i class="fa-solid fa-link"></i> Global Buy Link
                </button>
                <button class="btn-pink" onclick="openAddModal()">
                    <i class="fa-solid fa-plus"></i> Add Product
                </button>
            </div>
        </div>

        <!-- 📦 Product Grid (এখানে বক্সগুলো শো করবে) -->
        <div id="productGrid" class="product-grid">
            <!-- Data will be loaded here via JS -->
        </div>
    </div>

    <!-- 📌 Product Detail Popup (বক্সে ক্লিক করলে যা আসবে) -->
    <div class="modal fade" id="productDetailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailModalTitle" style="font-weight: bold; color: #fff;">Product Name</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body" id="detailPackages" style="max-height: 60vh; overflow-y: auto;">
                    <!-- Packages will be injected here -->
                </div>
                
                <!-- Edit & Delete Buttons inside Popup -->
                <div class="modal-footer" style="justify-content: space-between;">
                    <div>
                        <button id="btnEdit" class="btn" style="background: #ffaa00; color: #000; font-weight: bold; margin-right: 5px;">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <button id="btnDelete" class="btn" style="background: #ff0066; color: #fff; font-weight: bold;">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📌 Add / Edit Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="formModalTitle">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="productId">
                    <div class="mb-3">
                        <label class="form-label">Panel Name</label>
                        <input type="text" id="productName" class="form-control" placeholder="Enter Panel Name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image URL</label>
                        <input type="text" id="productImage" class="form-control" placeholder="Enter Image URL">
                    </div>
                    
                    <h6 class="text-white mt-4 border-bottom border-secondary pb-2">Packages</h6>
                    <div id="packagesContainer"></div>
                    <button type="button" class="btn btn-sm btn-purple mt-2" onclick="addPackageRow()">+ Add Package</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-pink" onclick="saveProduct()">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Firebase Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ⚠️ আপনার ফায়ারবেস কনফিগ এখানে বসান ⚠️
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const dbRef = database.ref('pc_panels'); // Database Path

        let allProductsData = {};
        const detailModal = new bootstrap.Modal(document.getElementById('productDetailModal'));
        const formModal = new bootstrap.Modal(document.getElementById('addProductModal'));

        // ১. প্রোডাক্ট লোড করে বক্স (Grid) তৈরি করা
        function loadProducts() {
            dbRef.on('value', (snapshot) => {
                const grid = document.getElementById('productGrid');
                grid.innerHTML = '';
                allProductsData = {};
                
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const product = childSnapshot.val();
                    allProductsData[id] = product;
                    
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.onclick = () => openProductDetail(id); // বক্সে ক্লিক করলে পপ-আপ ওপেন হবে
                    
                    card.innerHTML = `
                        <img src="${product.imageUrl || 'https://via.placeholder.com/150'}" class="product-img" alt="Panel">
                        <div class="product-name">${product.name || 'Unnamed Panel'}</div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        // ২. বক্সে ক্লিক করলে পপ-আপ (Details) ওপেন করা
        function openProductDetail(id) {
            const product = allProductsData[id];
            document.getElementById('detailModalTitle').innerText = product.name || "Panel Details";
            
            let packagesHTML = '<div style="display: flex; flex-direction: column; gap: 15px;">';
            
            if (product.packages && product.packages.length > 0) {
                product.packages.forEach(pkg => {
                    packagesHTML += `
                    <div style="background: #0c0514; border: 1px solid #2a113d; padding: 12px; border-radius: 8px;">
                        <div style="color: #00cc66; text-align: center; font-weight: bold; border-bottom: 1px dashed #2a113d; padding-bottom: 8px; font-size: 15px;">
                            <i class="fa-regular fa-clock"></i> ${pkg.duration}
                        </div>
                        <div class="p-box-container">
                            <div class="p-box old">
                                <span class="p-val">৳${pkg.oldPrice || 0}</span>
                                <span class="p-label">Old Price</span>
                            </div>
                            <div class="p-box sale">
                                <span class="p-val">৳${pkg.newPrice || 0}</span>
                                <span class="p-label">Sale</span>
                            </div>
                            <div class="p-box buy">
                                <span class="p-val">৳${pkg.resellPrice || 0}</span>
                                <span class="p-label">Buy</span>
                            </div>
                        </div>
                    </div>`;
                });
            } else {
                packagesHTML += `<div class="text-center text-danger">No packages available for this panel.</div>`;
            }
            packagesHTML += '</div>';
            
            document.getElementById('detailPackages').innerHTML = packagesHTML;
            
            // পপ-আপের ভেতরে এডিট বাটন
            document.getElementById('btnEdit').onclick = () => {
                detailModal.hide();
                openEditModal(id);
            };
            
            // পপ-আপের ভেতরে ডিলিট বাটন
            document.getElementById('btnDelete').onclick = () => {
                if(confirm("Are you sure you want to delete this product?")) {
                    dbRef.child(id).remove().then(() => {
                        detailModal.hide();
                    });
                }
            };
            
            detailModal.show();
        }

        // ৩. Add Product Modal ওপেন করা
        function openAddModal() {
            document.getElementById('formModalTitle').innerText = "Add New Product";
            document.getElementById('productId').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('packagesContainer').innerHTML = '';
            addPackageRow();
            formModal.show();
        }

        // ৪. Edit Product Modal ওপেন করা (পপ-আপ থেকে)
        function openEditModal(id) {
            const product = allProductsData[id];
            document.getElementById('formModalTitle').innerText = "Edit Product";
            document.getElementById('productId').value = id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productImage').value = product.imageUrl;
            
            document.getElementById('packagesContainer').innerHTML = '';
            if(product.packages) {
                product.packages.forEach(pkg => addPackageRow(pkg.duration, pkg.oldPrice, pkg.newPrice, pkg.resellPrice));
            }
            formModal.show();
        }

        // ৫. প্যাকেজ ইনপুট রো যোগ করা
        function addPackageRow(duration = '', oldP = '', newP = '', resellP = '') {
            const div = document.createElement('div');
            div.className = 'row g-2 mb-2 package-row align-items-end';
            div.innerHTML = `
                <div class="col-md-3">
                    <label class="form-label" style="font-size:11px;">Duration</label>
                    <input type="text" class="form-control pkg-duration" value="${duration}" placeholder="e.g. 7 Days">
                </div>
                <div class="col-md-2">
                    <label class="form-label" style="font-size:11px;">Old Price</label>
                    <input type="number" class="form-control pkg-old" value="${oldP}" placeholder="৳">
                </div>
                <div class="col-md-2">
                    <label class="form-label" style="font-size:11px;">Sale Price</label>
                    <input type="number" class="form-control pkg-new" value="${newP}" placeholder="৳">
                </div>
                <div class="col-md-3">
                    <label class="form-label" style="font-size:11px;">Buy Price</label>
                    <input type="number" class="form-control pkg-resell" value="${resellP}" placeholder="৳">
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-danger w-100" onclick="this.parentElement.parentElement.remove()">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `;
            document.getElementById('packagesContainer').appendChild(div);
        }

        // ৬. ডাটাবেসে সেভ করা (Add / Edit)
        function saveProduct() {
            const id = document.getElementById('productId').value;
            const name = document.getElementById('productName').value;
            const imageUrl = document.getElementById('productImage').value;
            
            const packageRows = document.querySelectorAll('.package-row');
            let packages = [];
            packageRows.forEach(row => {
                const duration = row.querySelector('.pkg-duration').value;
                const oldPrice = row.querySelector('.pkg-old').value;
                const newPrice = row.querySelector('.pkg-new').value;
                const resellPrice = row.querySelector('.pkg-resell').value;
                if(duration) {
                    packages.push({ duration, oldPrice, newPrice, resellPrice });
                }
            });

            const productData = { name, imageUrl, packages };

            if(id) {
                dbRef.child(id).update(productData).then(() => {
                    formModal.hide();
                });
            } else {
                dbRef.push(productData).then(() => {
                    formModal.hide();
                });
            }
        }

        // Global Link Modal Placeholder function (If needed)
        function openGlobalLinkModal() {
            alert("Global Link System Placeholder (Please implement your link logic here)");
        }

        // পেজ লোড হলে ডাটা আনা শুরু হবে
        window.onload = loadProducts;
    </script>
</body>
</html>
