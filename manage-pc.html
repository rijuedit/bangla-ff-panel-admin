
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage PC Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-dark: #07030b;
            --card-bg: #0d0818;
            --neon-purple: #a855f7;
            --neon-pink: #ff007f;
            --neon-red: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .orbitron { font-family: 'Orbitron', sans-serif; }

        .navbar {
            background: rgba(13,8,24,.97);
            border-bottom: 2px solid var(--neon-purple);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-nav {
            color: white;
            text-decoration: none;
            border: 1px solid var(--neon-purple);
            padding: 7px 18px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            transition: .3s;
        }

        .btn-nav:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        .video-manager {
            background: var(--card-bg);
            border: 1px solid #2d2640;
            border-radius: 10px;
            padding: 18px 20px;
            margin: 20px;
        }

        .styled-input {
            width: 100%;
            min-width: 0;
            background: #07030b;
            border: 1px solid #2d2640;
            color: white;
            padding: 10px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .styled-input:focus { border-color: var(--neon-purple); }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
            gap: 20px;
            padding: 20px;
        }

        .product-card {
            background: #0d0818;
            border: 1px solid #231b36;
            border-radius: 16px;
            padding: 14px;
            transition: .3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
        }

        .product-card:hover {
            border-color: var(--neon-purple);
            transform: translateY(-3px);
            box-shadow: 0 7px 22px rgba(168,85,247,.12);
        }

        .product-image {
            width: 100%;
            height: 165px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #231b36;
            background: #08040d;
        }

        .product-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: white;
            overflow-wrap: anywhere;
        }

        .btn-card-edit {
            background: rgba(168,85,247,.1);
            border: 1px solid var(--neon-purple);
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            transition: .3s;
        }

        .btn-card-edit:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.88);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: #0f0a19;
            width: 100%;
            max-width: 900px;
            border: 1.5px solid var(--neon-purple);
            border-radius: 12px;
            overflow: hidden;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(168,85,247,.2);
        }

        .modal-body {
            padding: 20px 25px;
            overflow-y: auto;
        }

        .package-header-grid,
        .package-row {
            display: grid;
            grid-template-columns: .8fr 1.1fr 1fr 1fr 1fr 38px;
            gap: 9px;
            align-items: center;
        }

        .package-header-grid { margin-bottom: 8px; }
        .package-row { margin-bottom: 12px; }

        .btn-add-pkg {
            background: var(--neon-purple);
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            transition: .2s;
        }

        .btn-add-pkg:hover { opacity: .85; }

        .btn-remove-pkg {
            background: rgba(239,68,68,.2);
            border: 1px solid rgba(239,68,68,.4);
            color: #ef4444;
            height: 40px;
            width: 100%;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-remove-pkg:hover {
            background: #ef4444;
            color: white;
        }

        .btn-save {
            background: var(--neon-pink);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
        }

        .btn-cancel {
            background: #4b5563;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn-delete-modal {
            background: var(--neon-red);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn-delete-modal:hover { background: #dc2626; }
        .hidden { display: none !important; }

        .status-message {
            display: none;
            margin: 15px 20px 0;
            padding: 12px 15px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .status-message.show { display: block; }
        .status-message.error {
            color: #fecaca;
            border: 1px solid #7f1d1d;
            background: #2a0c13;
        }

        .status-message.success {
            color: #bbf7d0;
            border: 1px solid #166534;
            background: #052e16;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        @media(max-width: 650px) {
            .navbar { padding: 13px; }
            .navbar .orbitron { font-size: 11px; text-align: center; }
            .video-manager { margin: 12px; padding: 14px; }
            .product-grid { padding: 12px; gap: 12px; grid-template-columns: repeat(auto-fill,minmax(145px,1fr)); }
            .product-image { height: 120px; }
            .product-title { font-size: 11px; }
            .modal-body { padding: 16px 12px; }
            .package-header-grid { display: none; }
            .package-row {
                grid-template-columns: 1fr 1fr;
                padding: 12px;
                border: 1px solid #2d2640;
                border-radius: 8px;
                background: #0a0611;
            }
            .package-row > div::before {
                display: block;
                color: #aaa;
                font-size: 10px;
                margin-bottom: 4px;
                text-transform: uppercase;
            }
            .package-row > div:nth-child(1)::before { content: "Duration"; }
            .package-row > div:nth-child(2)::before { content: "Unit"; }
            .package-row > div:nth-child(3)::before { content: "Old Price"; }
            .package-row > div:nth-child(4)::before { content: "Sale Price"; }
            .package-row > div:nth-child(5)::before { content: "Buy Price"; }
            .package-row > button { height: 38px; }
            .modal-footer { gap: 8px; flex-wrap: wrap; }
            .btn-save, .btn-cancel, .btn-delete-modal { padding: 10px 12px; font-size: 11px; }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="btn-nav">BACK</a>
        <div class="orbitron text-sm md:text-lg font-bold tracking-widest">
            MANAGE PC PANEL
        </div>
        <div style="width:55px"></div>
    </nav>

    <!-- PC Setup Video -->
    <section class="video-manager">
        <label class="orbitron text-xs text-purple-400 block mb-2 uppercase">
            PC Setup Video URL
        </label>
        <div class="flex flex-col sm:flex-row gap-3">
            <input
                type="url"
                id="videoUrlInput"
                class="styled-input"
                placeholder="YouTube or Drive Link..."
            >
            <button id="updateVideoBtn" class="btn-save whitespace-nowrap">
                UPDATE
            </button>
        </div>
    </section>

    <div class="px-5 mt-6 flex justify-between items-center gap-3">
        <h2 class="orbitron text-sm md:text-lg font-bold">PRODUCTS</h2>
        <button id="addProductBtn" class="btn-add-pkg">
            + ADD PRODUCT
        </button>
    </div>

    <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

    <div class="product-grid" id="productGrid">
        <div class="text-gray-400 p-6">Loading products...</div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <div class="p-5 border-b border-gray-800 flex justify-between items-center gap-3">
                <h2 class="orbitron text-sm md:text-lg font-bold" id="modalTitle">
                    Edit PC Panel
                </h2>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white text-2xl" aria-label="Close">
                    &times;
                </button>
            </div>

            <div class="modal-body">
                <div class="mb-5">
                    <label class="text-xs text-gray-400 uppercase block mb-2" for="pTitle">
                        Panel Name
                    </label>
                    <input type="text" id="pTitle" class="styled-input" placeholder="Enter Panel Name">
                </div>

                <div class="mb-6">
                    <label class="text-xs text-gray-400 uppercase block mb-2" for="pImage">
                        Image URL
                    </label>
                    <input type="url" id="pImage" class="styled-input" placeholder="Enter Image URL">
                </div>

                <div class="flex justify-between items-center gap-3 mb-3">
                    <h3 class="orbitron text-sm font-bold">Packages</h3>
                    <button id="addPackageBtn" class="btn-add-pkg">+ Add Package</button>
                </div>

                <hr class="border-gray-800 mb-4">

                <div class="package-header-grid text-xs text-gray-400 uppercase px-1">
                    <div>Duration</div>
                    <div>Unit</div>
                    <div>Old Price</div>
                    <div>Sale Price</div>
                    <div>Buy Price</div>
                    <div></div>
                </div>

                <div id="packageContainer"></div>
            </div>

            <div class="modal-footer p-4 border-t border-gray-800 flex justify-between items-center bg-[#0f0a19]">
                <button id="modalDeleteBtn" class="btn-delete-modal hidden">
                    Delete Product
                </button>

                <div class="flex gap-3 ml-auto">
                    <button id="cancelModalBtn" class="btn-cancel">Cancel</button>
                    <button id="saveBtn" class="btn-save">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getDatabase,
            ref,
            set,
            push,
            onValue,
            get,
            remove,
            update
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ================= FIREBASE =================

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentEditId = null;
        let isSaving = false;

        const $ = (id) => document.getElementById(id);

        function showStatus(message, type = "success") {
            const box = $("statusMessage");
            box.textContent = message;
            box.className = `status-message show ${type}`;
            box.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function clearStatus() {
            $("statusMessage").textContent = "";
            $("statusMessage").className = "status-message";
        }

        // ================= VIDEO LINK =================

        $("updateVideoBtn").addEventListener("click", async () => {
            const url = $("videoUrlInput").value.trim();
            const btn = $("updateVideoBtn");

            if (url && !/^https?:\/\/\S+$/i.test(url)) {
                showStatus("Please enter a valid video URL.", "error");
                return;
            }

            btn.disabled = true;

            try {
                await set(ref(db, "settings/video_pc"), url);
                showStatus("PC Setup Video Link Updated Successfully!");
            } catch (error) {
                console.error(error);
                showStatus("Video link save failed. Check Firebase permissions.", "error");
            } finally {
                btn.disabled = false;
            }
        });

        onValue(
            ref(db, "settings/video_pc"),
            (snapshot) => {
                $("videoUrlInput").value = snapshot.val() || "";
            },
            (error) => {
                console.error("Video settings error:", error);
                showStatus("Could not load video settings.", "error");
            }
        );

        // ================= DURATION PARSER =================

        function parseDuration(pkg = {}) {
            let val = pkg.durationValue ?? pkg.val ?? "";
            let unit = pkg.durationUnit ?? pkg.unit ?? "Hours";
            const duration = String(pkg.duration ?? "").trim();

            if (val === "" && duration) {
                const match = duration.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);

                if (match) {
                    val = match[1];
                    unit = match[2];
                } else if (/^\d+(?:\.\d+)?$/.test(duration)) {
                    val = duration;
                } else {
                    // Legacy text duration, e.g. "Lifetime"
                    const knownUnits = ["Hours", "Days", "Months", "Lifetime"];
                    if (knownUnits.includes(duration)) {
                        val = duration === "Lifetime" ? "1" : "";
                        unit = duration;
                    } else {
                        val = "";
                        unit = "Hours";
                    }
                }
            }

            const allowedUnits = ["Hours", "Days", "Months", "Lifetime"];

            if (!allowedUnits.includes(unit)) {
                unit = "Hours";
            }

            return { val, unit };
        }

        // ================= PACKAGE ROW =================

        function addPackageRow(data = {}) {
            const container = $("packageContainer");
            const row = document.createElement("div");
            row.className = "package-row";

            const parsed = parseDuration(data);

            const fields = [
                { cls: "pkg-val", type: "number", value: parsed.val, placeholder: "1", min: "1" },
                { cls: "pkg-old", type: "number", value: data.old ?? data.old_price ?? "", placeholder: "Old Price", min: "0" },
                { cls: "pkg-sell", type: "number", value: data.sell ?? data.sell_price ?? "", placeholder: "Sale Price", min: "0" },
                { cls: "pkg-buy", type: "number", value: data.buy ?? data.buy_price ?? "", placeholder: "Buy Price", min: "0" }
            ];

            const durationBox = document.createElement("div");
            const durationInput = document.createElement("input");
            durationInput.type = "number";
            durationInput.min = "1";
            durationInput.step = "1";
            durationInput.className = "styled-input pkg-val";
            durationInput.placeholder = "1";
            durationInput.value = parsed.val;
            durationBox.appendChild(durationInput);

            const unitBox = document.createElement("div");
            const unitSelect = document.createElement("select");
            unitSelect.className = "styled-input pkg-unit";

            ["Hours", "Days", "Months", "Lifetime"].forEach((unit) => {
                const option = document.createElement("option");
                option.value = unit;
                option.textContent = unit;
                unitSelect.appendChild(option);
            });

            unitSelect.value = parsed.unit;
            unitBox.appendChild(unitSelect);

            row.append(durationBox, unitBox);

            fields.slice(1).forEach((field) => {
                const box = document.createElement("div");
                const input = document.createElement("input");

                input.type = field.type;
                input.min = field.min;
                input.step = "any";
                input.className = `styled-input ${field.cls}`;
                input.placeholder = field.placeholder;
                input.value = field.value;

                box.appendChild(input);
                row.appendChild(box);
            });

            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.className = "btn-remove-pkg";
            removeBtn.innerHTML = '<i class="fas fa-times"></i>';
            removeBtn.title = "Remove package";
            removeBtn.addEventListener("click", () => row.remove());

            row.appendChild(removeBtn);
            container.appendChild(row);
        }

        // ================= MODAL CONTROLS =================

        function resetModal() {
            $("pTitle").value = "";
            $("pImage").value = "";
            $("packageContainer").innerHTML = "";
            $("modalTitle").textContent = "Add New Product";
            $("modalDeleteBtn").classList.add("hidden");
            $("saveBtn").textContent = "Save Product";
            clearStatus();
        }

        function openModal(mode, id = null) {
            currentEditId = id;
            resetModal();

            if (mode === "add") {
                addPackageRow();
            } else {
                $("modalTitle").textContent = "Edit PC Panel";
                $("modalDeleteBtn").classList.remove("hidden");
            }

            $("productModal").style.display = "flex";
        }

        function closeModal() {
            if (isSaving) return;
            $("productModal").style.display = "none";
            clearStatus();
        }

        $("addProductBtn").addEventListener("click", () => openModal("add"));
        $("addPackageBtn").addEventListener("click", () => addPackageRow());
        $("closeModalBtn").addEventListener("click", closeModal);
        $("cancelModalBtn").addEventListener("click", closeModal);

        $("productModal").addEventListener("click", (event) => {
            if (event.target === $("productModal")) closeModal();
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && $("productModal").style.display === "flex") {
                closeModal();
            }
        });

        // ================= SAVE PRODUCT =================

        async function saveProduct(mode) {
            if (isSaving) return;

            const title = $("pTitle").value.trim();
            const image = $("pImage").value.trim();

            if (!title) {
                alert("Please enter a Panel Name.");
                $("pTitle").focus();
                return;
            }

            if (image && !/^https?:\/\/\S+$/i.test(image)) {
                alert("Please enter a valid Image URL.");
                $("pImage").focus();
                return;
            }

            const packages = [];
            const rows = document.querySelectorAll(".package-row");

            for (const row of rows) {
                const val = row.querySelector(".pkg-val").value.trim();
                const unit = row.querySelector(".pkg-unit").value;
                const old = row.querySelector(".pkg-old").value.trim();
                const sell = row.querySelector(".pkg-sell").value.trim();
                const buy = row.querySelector(".pkg-buy").value.trim();

                // Ignore completely empty package rows.
                if (!val && !old && !sell && !buy) continue;

                if (unit !== "Lifetime" && (!val || Number(val) <= 0)) {
                    alert("Please enter a valid duration for every package.");
                    return;
                }

                if (sell === "" || !Number.isFinite(Number(sell)) || Number(sell) < 0) {
                    alert("Please enter a valid Sale Price for every package.");
                    return;
                }

                packages.push({
                    duration: unit === "Lifetime" ? "Lifetime" : `${val} ${unit}`,
                    durationValue: unit === "Lifetime" ? "1" : val,
                    durationUnit: unit,
                    old_price: old,
                    sell_price: sell,
                    buy_price: buy
                });
            }

            if (packages.length === 0) {
                alert("Please add at least one package with a Sale Price.");
                return;
            }

            const data = { title, image, packages };

            isSaving = true;
            $("saveBtn").disabled = true;
            $("saveBtn").textContent = "SAVING...";

            try {
                if (mode === "add") {
                    await push(ref(db, "pc_panels"), data);
                    showStatus("Product added successfully!");
                } else {
                    if (!currentEditId) throw new Error("Product ID missing.");
                    await update(ref(db, `pc_panels/${currentEditId}`), data);
                    showStatus("Product updated successfully!");
                }

                $("productModal").style.display = "none";
            } catch (error) {
                console.error("Save product error:", error);
                alert("Could not save product. Check your Firebase Database Rules and connection.");
            } finally {
                isSaving = false;
                $("saveBtn").disabled = false;
                $("saveBtn").textContent = "Save Product";
            }
        }

        $("saveBtn").addEventListener("click", () => {
            saveProduct(currentEditId ? "edit" : "add");
        });

        // ================= DELETE PRODUCT =================

        $("modalDeleteBtn").addEventListener("click", async () => {
            if (!currentEditId || isSaving) return;

            const confirmed = confirm(
                "Are you sure you want to delete this panel? This cannot be undone."
            );

            if (!confirmed) return;

            isSaving = true;
            $("modalDeleteBtn").disabled = true;

            try {
                await remove(ref(db, `pc_panels/${currentEditId}`));
                $("productModal").style.display = "none";
                showStatus("Product deleted successfully!");
            } catch (error) {
                console.error("Delete product error:", error);
                alert("Could not delete product. Check Firebase permissions.");
            } finally {
                isSaving = false;
                $("modalDeleteBtn").disabled = false;
            }
        });

        // ================= RENDER PRODUCTS =================

        onValue(
            ref(db, "pc_panels"),
            (snapshot) => {
                const grid = $("productGrid");
                grid.innerHTML = "";

                if (!snapshot.exists()) {
                    grid.innerHTML = `
                        <div class="text-gray-400 p-6">
                            No PC Panel products found. Click ADD PRODUCT to create one.
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const product = childSnapshot.val() || {};

                    const card = document.createElement("article");
                    card.className = "product-card";

                    const details = document.createElement("div");
                    const img = document.createElement("img");

                    img.className = "product-image";
                    img.alt = product.title || "PC Panel";
                    img.src = product.image ||
                        "https://placehold.co/400x200/0d0818/ffffff?text=No+Image";

                    img.onerror = () => {
                        img.onerror = null;
                        img.src = "https://placehold.co/400x200/0d0818/ffffff?text=No+Image";
                    };

                    const title = document.createElement("h3");
                    title.className = "product-title";
                    title.textContent = product.title || "Untitled Panel";

                    const packageCount = document.createElement("p");
                    packageCount.className = "text-xs text-gray-400 mb-3";
                    const list = Array.isArray(product.packages)
                        ? product.packages
                        : Object.values(product.packages || {});

                    packageCount.textContent = `${list.length} package(s)`;

                    details.append(img, title, packageCount);

                    const editBtn = document.createElement("button");
                    editBtn.type = "button";
                    editBtn.className = "btn-card-edit";
                    editBtn.textContent = "EDIT PANEL";
                    editBtn.addEventListener("click", () => editProduct(id));

                    card.append(details, editBtn);
                    grid.appendChild(card);
                });
            },
            (error) => {
                console.error("Product list error:", error);
                showStatus("Could not load products. Check Firebase permissions.", "error");
            }
        );

        // ================= EDIT PRODUCT =================

        async function editProduct(id) {
            try {
                const snapshot = await get(ref(db, `pc_panels/${id}`));

                if (!snapshot.exists()) {
                    alert("Product not found.");
                    return;
                }

                const product = snapshot.val() || {};

                openModal("edit", id);

                $("pTitle").value = product.title || "";
                $("pImage").value = product.image || "";

                const container = $("packageContainer");
                container.innerHTML = "";

                const packages = Array.isArray(product.packages)
                    ? product.packages
                    : Object.values(product.packages || {});

                if (packages.length) {
                    packages.forEach((pkg) => {
                        // Pass the original fields so existing values remain intact.
                        addPackageRow({
                            durationValue: pkg.durationValue,
                            durationUnit: pkg.durationUnit,
                            duration: pkg.duration,
                            old_price: pkg.old_price,
                            sell_price: pkg.sell_price,
                            buy_price: pkg.buy_price
                        });
                    });
                } else {
                    addPackageRow();
                }
            } catch (error) {
                console.error("Edit product error:", error);
                alert("Could not load this product. Check Firebase permissions.");
            }
        }
    </script>
</body>
</html>
