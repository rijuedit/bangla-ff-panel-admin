<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage PC Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #05020a;
            --card-bg: #0c0514;
            --input-bg: #11071a;
            --border-color: #2a113d;
            --neon-pink: #ff0066;
            --neon-purple: #9d00ff;
            --neon-green: #00cc66;
            --text-gray: #b0b0b0;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            position: fixed;
            padding: 20px;
        }

        .sidebar h2 { color: var(--neon-pink); font-size: 1.2rem; margin-bottom: 30px; text-align: center; }

        .nav-links { list-style: none; padding: 0; }
        .nav-links li { margin-bottom: 15px; }
        .nav-links a {
            color: var(--text-gray);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(157, 0, 255, 0.1);
            color: white;
            border-left: 3px solid var(--neon-purple);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 40px;
            width: calc(100% - 260px);
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-add {
            background: var(--neon-pink);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-global {
            background: var(--neon-purple);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }

        /* Table Style */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-gray);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prod-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .pkg-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border-color);
            padding: 5px 10px;
            border-radius: 20px;
            margin: 2px;
            font-size: 0.8rem;
        }
        .pkg-badge .duration { color: var(--neon-green); font-weight: bold; }
        .pkg-badge .price-old { text-decoration: line-through; color: #666; }
        .pkg-badge .price-sell { color: var(--neon-purple); }
        .pkg-badge .price-buy { color: #ffa500; font-weight: bold; }

        .btn-action {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
        }
        .btn-edit { background: #ffc107; color: black; }
        .btn-delete { background: #dc3545; color: white; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--neon-pink);
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-gray); font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            color: white;
            border-radius: 8px;
            outline: none;
        }

        .package-entry {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            position: relative;
        }

        .duration-box { display: flex; gap: 10px; }
        .price-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }

        .btn-save {
            width: 100%;
            padding: 15px;
            background: var(--neon-pink);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>OXI ADMIN</h2>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="manage-pc.html" class="active"><i class="fas fa-desktop"></i> Manage PC Panel</a></li>
            <li><a href="manage-mobile.html"><i class="fas fa-mobile-alt"></i> Manage Mobile Panel</a></li>
            <li><a href="manage-free.html"><i class="fas fa-gift"></i> Manage Free Panel</a></li>
            <li><a href="manage-bypass.html"><i class="fas fa-bolt"></i> Manage Free Bypass</a></li>
            <li><a href="manage-emulator.html"><i class="fas fa-gamepad"></i> Manage Emulator</a></li>
            <li><a href="manage-admins.html"><i class="fas fa-user-shield"></i> Admin Users</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-box">
            <h1><i class="fas fa-desktop"></i> PC Panels</h1>
            <div>
                <button class="btn-global" onclick="openGlobalLinkModal()"><i class="fas fa-link"></i> Global Buy Link</button>
                <button class="btn-add" onclick="openProductModal()"><i class="fas fa-plus"></i> Add Product</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Panel Name</th>
                        <th>Available Packages</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="pc-table-body">
                    <!-- Data from Firebase -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Product Modal (Add/Edit) -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New PC Panel</h3>
                <span onclick="closeModal('productModal')" style="cursor:pointer; font-size: 24px;">&times;</span>
            </div>
            
            <input type="hidden" id="edit-id">

            <div class="form-group">
                <label>Panel Title</label>
                <input type="text" id="p-title" placeholder="e.g. PREMIUM PC PANEL">
            </div>

            <div class="form-group">
                <label>Image URL</label>
                <input type="text" id="p-image" placeholder="https://i.ibb.co/...">
            </div>

            <div id="packages-container">
                <label style="color: var(--text-gray); font-size: 0.9rem;">Configure Packages</label>
                <!-- Package entries will be added here -->
            </div>

            <button type="button" onclick="addPackageEntry()" style="background:none; border: 1px solid var(--neon-purple); color: var(--neon-purple); padding: 8px; border-radius: 5px; cursor: pointer; margin-top: 10px;">+ Add Package Option</button>

            <button class="btn-save" id="btn-save-prod">SAVE PRODUCT</button>
        </div>
    </div>

    <!-- Global Link Modal -->
    <div class="modal" id="globalLinkModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3>Global Buy Link</h3>
                <span onclick="closeModal('globalLinkModal')" style="cursor:pointer; font-size: 24px;">&times;</span>
            </div>
            <div class="form-group">
                <label>Discord/Checkout URL</label>
                <input type="text" id="global-buy-link" placeholder="https://discord.gg/...">
            </div>
            <button class="btn-save" onclick="saveGlobalLink()">SAVE LINK</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Package Logic ---
        window.addPackageEntry = (data = null) => {
            const container = document.getElementById('packages-container');
            const div = document.createElement('div');
            div.className = 'package-entry';
            
            const durationValue = data ? data.duration.split(' ')[0] : '';
            const unitValue = data ? data.duration.split(' ')[1] : 'Days';
            const isLifetime = data && data.duration === 'Lifetime';

            div.innerHTML = `
                <div class="duration-box">
                    <input type="number" class="pkg-qty" placeholder="Qty" value="${durationValue}" style="flex:1; display: ${isLifetime ? 'none' : 'block'};">
                    <select class="pkg-unit" onchange="toggleQty(this)" style="flex:2;">
                        <option value="Hours" ${unitValue==='Hours'?'selected':''}>Hours</option>
                        <option value="Days" ${unitValue==='Days'?'selected':''}>Days</option>
                        <option value="Months" ${unitValue==='Months'?'selected':''}>Months</option>
                        <option value="Years" ${unitValue==='Years'?'selected':''}>Years</option>
                        <option value="Lifetime" ${isLifetime?'selected':''}>Lifetime</option>
                    </select>
                </div>
                <div class="price-box">
                    <input type="text" class="pkg-old" placeholder="Old Price" value="${data?data.old_price:''}">
                    <input type="text" class="pkg-sell" placeholder="Sell Price" value="${data?data.sell_price:''}">
                    <input type="text" class="pkg-buy" placeholder="Buy Price" value="${data?data.buy_price:''}">
                </div>
                <span onclick="this.parentElement.remove()" style="position:absolute; top:5px; right:10px; color:red; cursor:pointer;">&times;</span>
            `;
            container.appendChild(div);
        };

        window.toggleQty = (select) => {
            const qtyInput = select.previousElementSibling;
            qtyInput.style.display = (select.value === 'Lifetime') ? 'none' : 'block';
        };

        // --- Modals ---
        window.openProductModal = (key = null) => {
            document.getElementById('packages-container').innerHTML = '';
            if(key) {
                document.getElementById('modalTitle').innerText = "Edit PC Panel";
                document.getElementById('edit-id').value = key;
                get(ref(db, `pc_panels/${key}`)).then(snap => {
                    const data = snap.val();
                    document.getElementById('p-title').value = data.title;
                    document.getElementById('p-image').value = data.image;
                    data.packages.forEach(pkg => addPackageEntry(pkg));
                });
            } else {
                document.getElementById('modalTitle').innerText = "Add New PC Panel";
                document.getElementById('edit-id').value = '';
                document.getElementById('p-title').value = '';
                document.getElementById('p-image').value = '';
                addPackageEntry();
            }
            document.getElementById('productModal').style.display = 'flex';
        };

        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        // --- Global Buy Link ---
        window.openGlobalLinkModal = () => {
            get(ref(db, 'site_settings/pc_panel/buy_link')).then(snap => {
                if(snap.exists()) document.getElementById('global-buy-link').value = snap.val();
            });
            document.getElementById('globalLinkModal').style.display = 'flex';
        };

        window.saveGlobalLink = () => {
            const link = document.getElementById('global-buy-link').value;
            set(ref(db, 'site_settings/pc_panel/buy_link'), link).then(() => {
                alert("Global Link Saved!");
                closeModal('globalLinkModal');
            });
        };

        // --- CRUD ---
        document.getElementById('btn-save-prod').onclick = () => {
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('p-title').value;
            const image = document.getElementById('p-image').value;
            const entries = document.querySelectorAll('.package-entry');
            
            const packages = [];
            entries.forEach(entry => {
                const qty = entry.querySelector('.pkg-qty').value;
                const unit = entry.querySelector('.pkg-unit').value;
                const duration = (unit === 'Lifetime') ? 'Lifetime' : `${qty} ${unit}`;
                
                packages.push({
                    duration: duration,
                    old_price: entry.querySelector('.pkg-old').value,
                    sell_price: entry.querySelector('.pkg-sell').value,
                    buy_price: entry.querySelector('.pkg-buy').value
                });
            });

            const data = { title, image, packages, timestamp: Date.now() };

            if(id) {
                update(ref(db, `pc_panels/${id}`), data).then(() => {
                    alert("Product Updated!");
                    closeModal('productModal');
                });
            } else {
                push(ref(db, 'pc_panels'), data).then(() => {
                    alert("Product Added!");
                    closeModal('productModal');
                });
            }
        };

        onValue(ref(db, 'pc_panels'), (snapshot) => {
            const table = document.getElementById('pc-table-body');
            table.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                const tr = document.createElement('tr');
                
                let pkgHtml = '';
                data.packages.forEach(pkg => {
                    pkgHtml += `
                        <div class="pkg-badge">
                            <span class="duration">${pkg.duration}</span> | 
                            <span class="price-old">${pkg.old_price}</span> | 
                            <span class="price-sell">${pkg.sell_price}</span> |
                            <span class="price-buy">${pkg.buy_price}</span>
                        </div>
                    `;
                });

                tr.innerHTML = `
                    <td><img src="${data.image}" class="prod-img"></td>
                    <td style="font-weight:bold;">${data.title}</td>
                    <td>${pkgHtml}</td>
                    <td style="text-align: right;">
                        <button class="btn-action btn-edit" onclick="openProductModal('${child.key}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-action btn-delete" onclick="deleteProd('${child.key}')"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                table.appendChild(tr);
            });
        });

        window.deleteProd = (key) => {
            if(confirm("Are you sure?")) remove(ref(db, `pc_panels/${key}`));
        };
    </script>
</body>
</html>
