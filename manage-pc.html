<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage PC Panels - BANGLA FF ADMIN</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #07030b;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Header / Navbar */
        .navbar {
            background: #0d0614;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a113d;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-text h1 {
            font-size: 1.2rem;
            color: #ff007f;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .brand-text span {
            font-size: 0.75rem;
            color: #aaa;
            display: block;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: #140821;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #2a113d;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .nav-btn:hover {
            border-color: #ff007f;
            color: #ff007f;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 25px;
            background: #140821;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #2a113d;
            transition: 0.3s;
        }

        .back-link:hover {
            border-color: #ff007f;
            color: #ff007f;
        }

        /* Card Section */
        .admin-card {
            background: #0d0614;
            border: 1px solid #2a113d;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .admin-card h2 {
            font-size: 1.3rem;
            color: #00ff7f;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add {
            background: linear-gradient(90deg, #d500f9, #ff007f);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-add:hover {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        /* Input Controls */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #bbb;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: #1a0b2e;
            border: 1px solid #2a113d;
            border-radius: 8px;
            padding: 11px 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #ff007f;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .grid-3 { grid-template-columns: 1fr; }
        }

        /* Product Box Grid (Matching Admin Box Style Requested) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-box {
            background: #11071a;
            border: 1.5px solid #2a113d;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .product-box:hover {
            border-color: #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            transform: translateY(-4px);
        }

        .product-box-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #2a113d;
        }

        .product-box-name {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .click-hint {
            font-size: 0.75rem;
            color: #ff007f;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-card {
            background: #0d0614;
            border: 2px solid #ff007f;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.35);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.3rem;
            cursor: pointer;
        }
        .modal-close:hover { color: #ff007f; }

        .modal-title {
            font-size: 1.2rem;
            color: #ff007f;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Action Menu Popup */
        .action-popup {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-action-menu {
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-edit-popup {
            background: #00f2fe;
            color: #000;
        }
        .btn-edit-popup:hover { box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }

        .btn-delete-popup {
            background: #ff4d4d;
            color: #fff;
        }
        .btn-delete-popup:hover { box-shadow: 0 0 15px rgba(255, 77, 77, 0.5); }

        .pkg-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .pkg-row input { flex: 1; }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="nav-brand">
            <div class="brand-text">
                <h1>BANGLA FF PANEL</h1>
                <span>PREMIUM CORP (ADMIN)</span>
            </div>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="nav-btn"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="nav-btn"><i class="fab fa-discord"></i> Discord</a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <!-- Video Tutorial Admin Section -->
        <div class="admin-card">
            <h2><i class="fas fa-video"></i> PC Setup Video Tutorial Link</h2>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <input type="url" id="pcVideoInput" class="form-control" placeholder="Paste YouTube or Google Drive link" style="flex: 1; min-width: 250px;">
                <button class="btn-add" onclick="saveVideoUrl()"><i class="fas fa-save"></i> Save Video</button>
            </div>
        </div>

        <!-- Manage PC Panels (Box Grid Layout) -->
        <div class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h2><i class="fas fa-desktop"></i> Manage PC Panels</h2>
                <button class="btn-add" onclick="openAddModal()"><i class="fas fa-plus"></i> Add New Product</button>
            </div>

            <!-- Product Cards Box Area -->
            <div class="product-grid" id="productGrid">
                <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 30px;">Loading Products...</div>
            </div>
        </div>
    </div>

    <!-- 1. Action Menu Popup Modal (When clicking a product box) -->
    <div class="modal-overlay" id="actionModal">
        <div class="modal-card" style="max-width: 400px; text-align: center;">
            <button class="modal-close" onclick="closeActionModal()">&times;</button>
            <h3 class="modal-title" id="actionModalTitle">Product Name</h3>
            <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 20px;">Select an action for this product:</p>
            
            <div class="action-popup">
                <button class="btn-action-menu btn-edit-popup" onclick="triggerEditFromPopup()">
                    <i class="fas fa-edit"></i> Edit Product Menu
                </button>
                <button class="btn-action-menu btn-delete-popup" onclick="triggerDeleteFromPopup()">
                    <i class="fas fa-trash"></i> Delete Product
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Add / Edit Product Form Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeProductModal()">&times;</button>
            <h3 class="modal-title" id="modalFormTitle">Add New PC Panel</h3>
            
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editKey">
                
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="pName" class="form-control" placeholder="e.g. BR MODS [ DUSTU AIMKILL ]" required>
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="pImage" class="form-control" placeholder="Direct Image Link" required>
                </div>

                <div class="grid-3">
                    <div class="form-group">
                        <label>Old Price (৳) (পুরোনো দাম)</label>
                        <input type="number" id="pOldPrice" class="form-control" placeholder="e.g. 1500">
                    </div>
                    <div class="form-group">
                        <label>Sale Price (৳) (বিক্রি দাম)</label>
                        <input type="number" id="pSalePrice" class="form-control" placeholder="e.g. 1100" required>
                    </div>
                    <div class="form-group">
                        <label>Buy Price (৳) (কিনার দাম)</label>
                        <input type="number" id="pBuyPrice" class="form-control" placeholder="e.g. 800">
                    </div>
                </div>

                <div class="form-group">
                    <label>Download Link / Key Access</label>
                    <input type="url" id="pDownloadLink" class="form-control" placeholder="Link for panel file or key generator">
                </div>

                <div class="form-group">
                    <label>Package Durations & Sale Price (Optional)</label>
                    <div class="pkg-row">
                        <input type="text" value="1 Days" class="form-control" readonly style="max-width: 110px;">
                        <input type="number" id="pkg_1d" class="form-control" placeholder="Price for 1 Day">
                    </div>
                    <div class="pkg-row">
                        <input type="text" value="7 Days" class="form-control" readonly style="max-width: 110px;">
                        <input type="number" id="pkg_7d" class="form-control" placeholder="Price for 7 Days">
                    </div>
                    <div class="pkg-row">
                        <input type="text" value="1 Months" class="form-control" readonly style="max-width: 110px;">
                        <input type="number" id="pkg_1m" class="form-control" placeholder="Price for 1 Month">
                    </div>
                    <div class="pkg-row">
                        <input type="text" value="Lifetime" class="form-control" readonly style="max-width: 110px;">
                        <input type="number" id="pkg_life" class="form-control" placeholder="Price for Lifetime">
                    </div>
                </div>

                <button type="submit" class="btn-add" style="width: 100%; justify-content: center; margin-top: 10px;">Save Product</button>
            </form>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let pcProducts = {};
        let activeSelectedKey = null;

        // Fetch Setup Video Link
        database.ref('settings/video_pc').on('value', snap => {
            if (snap.val()) {
                document.getElementById('pcVideoInput').value = snap.val();
            }
        });

        function saveVideoUrl() {
            const url = document.getElementById('pcVideoInput').value.trim();
            database.ref('settings/video_pc').set(url)
                .then(() => alert('PC Setup Video URL saved successfully!'))
                .catch(err => alert('Error saving video: ' + err.message));
        }

        // Fetch Products and Display in BOX / CARD Layout
        database.ref('pc_panels').on('value', snap => {
            pcProducts = snap.val() || {};
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const keys = Object.keys(pcProducts);
            if (keys.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888;">No PC Panels Added Yet. Click "+ Add New Product" above.</div>';
                return;
            }

            keys.forEach(key => {
                const item = pcProducts[key];
                const name = item.name || item.title || 'PC Panel';
                const img = item.image || item.img || 'https://via.placeholder.com/240x150/11071a/ff007f?text=PC+Panel';

                const boxHTML = `
                    <div class="product-box" onclick="openActionModal('${key}')">
                        <img src="${img}" class="product-box-img" alt="${name}" onerror="this.src='https://via.placeholder.com/240x150/11071a/ff007f?text=No+Image'">
                        <div class="product-box-name">${name}</div>
                        <div class="click-hint"><i class="fas fa-cog"></i> Click to Edit / Delete</div>
                    </div>
                `;
                grid.innerHTML += boxHTML;
            });
        });

        // 1. Action Popup Modal Handlers
        function openActionModal(key) {
            activeSelectedKey = key;
            const item = pcProducts[key];
            if (!item) return;

            document.getElementById('actionModalTitle').innerText = item.name || 'PC Panel Options';
            document.getElementById('actionModal').style.display = 'flex';
        }

        function closeActionModal() {
            document.getElementById('actionModal').style.display = 'none';
        }

        function triggerEditFromPopup() {
            closeActionModal();
            if (activeSelectedKey) {
                editProduct(activeSelectedKey);
            }
        }

        function triggerDeleteFromPopup() {
            closeActionModal();
            if (activeSelectedKey) {
                deleteProduct(activeSelectedKey);
            }
        }

        // 2. Product Add/Edit Form Handlers
        function openAddModal() {
            document.getElementById('editKey').value = '';
            document.getElementById('productForm').reset();
            document.getElementById('modalFormTitle').innerText = 'Add New PC Panel';
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function editProduct(key) {
            const item = pcProducts[key];
            if (!item) return;

            document.getElementById('editKey').value = key;
            document.getElementById('pName').value = item.name || item.title || '';
            document.getElementById('pImage').value = item.image || item.img || '';
            document.getElementById('pOldPrice').value = item.oldPrice || '';
            document.getElementById('pSalePrice').value = item.salePrice || item.price || '';
            document.getElementById('pBuyPrice').value = item.buyPrice || '';
            document.getElementById('pDownloadLink').value = item.downloadLink || '';

            const pkgs = item.packages || {};
            document.getElementById('pkg_1d').value = pkgs['1 Days'] || pkgs['1 Day'] || '';
            document.getElementById('pkg_7d').value = pkgs['7 Days'] || '';
            document.getElementById('pkg_1m').value = pkgs['1 Months'] || pkgs['1 Month'] || '';
            document.getElementById('pkg_life').value = pkgs['Lifetime'] || '';

            document.getElementById('modalFormTitle').innerText = 'Edit PC Panel';
            document.getElementById('productModal').style.display = 'flex';
        }

        function saveProduct(e) {
            e.preventDefault();
            const editKey = document.getElementById('editKey').value;

            const packages = {};
            if (document.getElementById('pkg_1d').value) packages['1 Days'] = document.getElementById('pkg_1d').value;
            if (document.getElementById('pkg_7d').value) packages['7 Days'] = document.getElementById('pkg_7d').value;
            if (document.getElementById('pkg_1m').value) packages['1 Months'] = document.getElementById('pkg_1m').value;
            if (document.getElementById('pkg_life').value) packages['Lifetime'] = document.getElementById('pkg_life').value;

            const payload = {
                name: document.getElementById('pName').value,
                image: document.getElementById('pImage').value,
                oldPrice: document.getElementById('pOldPrice').value,
                salePrice: document.getElementById('pSalePrice').value,
                buyPrice: document.getElementById('pBuyPrice').value,
                downloadLink: document.getElementById('pDownloadLink').value,
                packages: packages,
                updatedAt: new Date().toISOString()
            };

            const ref = editKey ? database.ref('pc_panels/' + editKey) : database.ref('pc_panels').push();

            ref.set(payload)
                .then(() => {
                    alert('Product saved successfully!');
                    closeProductModal();
                })
                .catch(err => alert('Error saving product: ' + err.message));
        }

        function deleteProduct(key) {
            if (confirm('Are you sure you want to delete this PC panel?')) {
                database.ref('pc_panels/' + key).remove()
                    .then(() => alert('Product deleted successfully!'))
                    .catch(err => alert('Error deleting product: ' + err.message));
            }
        }
    </script>
</body>
</html>
