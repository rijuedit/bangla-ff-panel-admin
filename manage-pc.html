<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage PC Panels - BANGLA FF ADMIN</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0512;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Header / Navbar */
        .navbar {
            background: #140924;
            border-bottom: 2px solid #2a113d;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a855f7;
        }

        .brand-text h1 {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: #a855f7;
            font-weight: 600;
            display: block;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            background: #1a0b2e;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #2a113d;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            border-color: #a855f7;
            background: #251042;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .nav-btn.discord {
            background: #5865F2;
            border-color: #5865F2;
        }

        .nav-btn.discord:hover {
            background: #4752C4;
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.4);
        }

        /* Container & Header Actions */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            background: #140924;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #2a113d;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #1a0b2e;
            color: #00f2fe;
            border-color: #00f2fe;
            transform: translateX(-3px);
        }

        /* Section Cards */
        .admin-card {
            background: #140924;
            border: 1px solid #2a113d;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .admin-card h2 {
            font-size: 1.3rem;
            color: #00f2fe;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: #1a0b2e;
            border: 1px solid #2a113d;
            border-radius: 8px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #a855f7;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
        }

        .btn-action {
            background: linear-gradient(135deg, #a855f7, #6b21a8);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #2a113d;
        }

        th {
            background: #1a0b2e;
            color: #a855f7;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            font-size: 0.9rem;
        }

        .thumb-img {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #2a113d;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-edit {
            background: #00f2fe;
            color: #0a0512;
        }

        .btn-delete {
            background: #ff4d4d;
            color: #ffffff;
            margin-left: 6px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 18, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 16px;
        }

        .modal-card {
            background: #140924;
            border: 1px solid #2a113d;
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a113d;
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 700;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ff4d4d;
        }

        .pkg-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
        }

        .pkg-row input {
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="nav-brand">
            <img src="logo.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1>BANGLA FF PANEL</h1>
                <span>PREMIUM CORP (ADMIN)</span>
            </div>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="nav-btn"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="nav-btn discord"><i class="fab fa-discord"></i> Discord</a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Back Link to Admin Main -->
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <!-- Setup Video Admin Card -->
        <div class="admin-card">
            <h2><i class="fas fa-video"></i> PC Setup Video Tutorial Link</h2>
            <div class="grid-2">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>YouTube / Google Drive Video Link</label>
                    <input type="url" id="pcVideoInput" class="form-control" placeholder="Paste YouTube or Google Drive embed link">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="btn-action" onclick="saveVideoUrl()"><i class="fas fa-save"></i> Save Video Link</button>
                </div>
            </div>
        </div>

        <!-- Product Management Card -->
        <div class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2><i class="fas fa-desktop"></i> Manage PC Panels</h2>
                <button class="btn-action" onclick="openProductModal()"><i class="fas fa-plus"></i> Add New Product</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Old Price</th>
                            <th>Sale Price</th>
                            <th>Buy Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; color: #888;">Loading Products...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Product Add/Edit Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modalHeaderTitle">Add New PC Panel</h3>
                <button class="modal-close" onclick="closeProductModal()">&times;</button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editKey">
                
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="pName" class="form-control" placeholder="e.g. VIP PC Panel Injector" required>
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="pImage" class="form-control" placeholder="Direct Image URL (e.g. Imgur/Discord link)" required>
                </div>

                <div class="grid-3">
                    <div class="form-group">
                        <label>Old Price (৳) (পুরোনো দাম)</label>
                        <input type="number" id="pOldPrice" class="form-control" placeholder="e.g. 1500">
                    </div>
                    <div class="form-group">
                        <label>Sale Price (৳) (বিক্রি দাম)</label>
                        <input type="number" id="pSalePrice" class="form-control" placeholder="e.g. 1000" required>
                    </div>
                    <div class="form-group">
                        <label>Buy Price (৳) (কিনার দাম)</label>
                        <input type="number" id="pBuyPrice" class="form-control" placeholder="e.g. 700">
                    </div>
                </div>

                <div class="form-group">
                    <label>Download Link / Key Access</label>
                    <input type="url" id="pDownloadLink" class="form-control" placeholder="Link for panel download or key generator">
                </div>

                <div class="form-group">
                    <label>Package Durations & Pricing (Optional)</label>
                    <div class="pkg-row">
                        <input type="text" value="1 Hour" class="form-control" readonly style="max-width: 120px;">
                        <input type="number" id="pkg_1h" class="form-control" placeholder="Price for 1 Hour">
                    </div>
                    <div class="pkg-row">
                        <input type="text" value="1 Day" class="form-control" readonly style="max-width: 120px;">
                        <input type="number" id="pkg_1d" class="form-control" placeholder="Price for 1 Day">
                    </div>
                    <div class="pkg-row">
                        <input type="text" value="7 Days" class="form-control" readonly style="max-width: 120px;">
                        <input type="number" id="pkg_7d" class="form-control" placeholder="Price for 7 Days">
                    </div>
                    <div class="pkg-row">
                        <input type="text" value="30 Days" class="form-control" readonly style="max-width: 120px;">
                        <input type="number" id="pkg_30d" class="form-control" placeholder="Price for 30 Days">
                    </div>
                    <div class="pkg-row">
                        <input type="text" value="Lifetime" class="form-control" readonly style="max-width: 120px;">
                        <input type="number" id="pkg_life" class="form-control" placeholder="Price for Lifetime">
                    </div>
                </div>

                <button type="submit" class="btn-action" style="width: 100%; margin-top: 10px; justify-content: center;">Save Product</button>
            </form>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let pcProducts = {};

        // Fetch Setup Video Setting
        database.ref('settings/video_pc').on('value', snapshot => {
            const val = snapshot.val();
            if (val) {
                document.getElementById('pcVideoInput').value = val;
            }
        });

        function saveVideoUrl() {
            const videoUrl = document.getElementById('pcVideoInput').value.trim();
            database.ref('settings/video_pc').set(videoUrl)
                .then(() => alert('PC Setup Video URL saved successfully!'))
                .catch(err => alert('Error saving video URL: ' + err.message));
        }

        // Fetch Products from node 'pc_panels'
        database.ref('pc_panels').on('value', snapshot => {
            pcProducts = snapshot.val() || {};
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';

            const keys = Object.keys(pcProducts);
            if (keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">No PC Panels Added Yet.</td></tr>';
                return;
            }

            keys.forEach(key => {
                const item = pcProducts[key];
                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td><img src="${item.image || 'https://via.placeholder.com/45'}" class="thumb-img" onerror="this.src='https://via.placeholder.com/45'"></td>
                    <td><strong>${item.name || 'N/A'}</strong></td>
                    <td>${item.oldPrice ? '৳' + item.oldPrice : '-'}</td>
                    <td style="color:#00f2fe; font-weight:bold;">৳${item.salePrice || item.price || 0}</td>
                    <td style="color:#a855f7;">${item.buyPrice ? '৳' + item.buyPrice : '-'}</td>
                    <td>
                        <button class="btn-sm btn-edit" onclick="editProduct('${key}')"><i class="fas fa-edit"></i> Edit</button>
                        <button class="btn-sm btn-delete" onclick="deleteProduct('${key}')"><i class="fas fa-trash"></i> Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        // Modal Handlers
        function openProductModal() {
            document.getElementById('editKey').value = '';
            document.getElementById('productForm').reset();
            document.getElementById('modalHeaderTitle').innerText = 'Add New PC Panel';
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function editProduct(key) {
            const item = pcProducts[key];
            if (!item) return;

            document.getElementById('editKey').value = key;
            document.getElementById('pName').value = item.name || '';
            document.getElementById('pImage').value = item.image || '';
            document.getElementById('pOldPrice').value = item.oldPrice || '';
            document.getElementById('pSalePrice').value = item.salePrice || item.price || '';
            document.getElementById('pBuyPrice').value = item.buyPrice || '';
            document.getElementById('pDownloadLink').value = item.downloadLink || '';

            // Load package pricing if exists
            const pkgs = item.packages || {};
            document.getElementById('pkg_1h').value = pkgs['1 Hour'] || '';
            document.getElementById('pkg_1d').value = pkgs['1 Day'] || '';
            document.getElementById('pkg_7d').value = pkgs['7 Days'] || '';
            document.getElementById('pkg_30d').value = pkgs['30 Days'] || '';
            document.getElementById('pkg_life').value = pkgs['Lifetime'] || '';

            document.getElementById('modalHeaderTitle').innerText = 'Edit PC Panel';
            document.getElementById('productModal').style.display = 'flex';
        }

        function saveProduct(e) {
            e.preventDefault();
            const editKey = document.getElementById('editKey').value;

            const packages = {};
            if (document.getElementById('pkg_1h').value) packages['1 Hour'] = document.getElementById('pkg_1h').value;
            if (document.getElementById('pkg_1d').value) packages['1 Day'] = document.getElementById('pkg_1d').value;
            if (document.getElementById('pkg_7d').value) packages['7 Days'] = document.getElementById('pkg_7d').value;
            if (document.getElementById('pkg_30d').value) packages['30 Days'] = document.getElementById('pkg_30d').value;
            if (document.getElementById('pkg_life').value) packages['Lifetime'] = document.getElementById('pkg_life').value;

            const payload = {
                name: document.getElementById('pName').value,
                image: document.getElementById('pImage').value,
                oldPrice: document.getElementById('pOldPrice').value,
                salePrice: document.getElementById('pSalePrice').value,
                buyPrice: document.getElementById('pBuyPrice').value,
                downloadLink: document.getElementById('pDownloadLink').value,
                packages: packages,
                updatedAt: new Date().toISOString()
            };

            const ref = editKey ? database.ref('pc_panels/' + editKey) : database.ref('pc_panels').push();

            ref.set(payload)
                .then(() => {
                    alert('Product saved successfully!');
                    closeProductModal();
                })
                .catch(err => alert('Error saving product: ' + err.message));
        }

        function deleteProduct(key) {
            if (confirm('Are you sure you want to delete this PC panel?')) {
                database.ref('pc_panels/' + key).remove()
                    .then(() => alert('Product deleted!'))
                    .catch(err => alert('Error deleting product: ' + err.message));
            }
        }
    </script>
</body>
</html>
