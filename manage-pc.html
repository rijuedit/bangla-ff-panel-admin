<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage PC Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-dark: #07030b;
            --card-bg: #0d0818;
            --neon-purple: #a855f7;
            --neon-pink: #ff007f;
            --neon-red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* Navbar */
        .navbar {
            background: rgba(13, 8, 24, 0.95);
            border-bottom: 2px solid var(--neon-purple);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-nav {
            border: 1px solid var(--neon-purple);
            padding: 6px 18px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-nav:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* Video Section */
        .video-manager {
            background: var(--card-bg);
            border: 1px solid #2d2640;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 20px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .product-card {
            background: #0d0818;
            border: 1px solid #231b36;
            border-radius: 16px;
            padding: 14px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            border-color: var(--neon-purple);
            transform: translateY(-3px);
        }

        .product-image {
            width: 100%;
            height: 165px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #231b36;
        }

        .product-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            color: white;
            text-transform: uppercase;
        }

        .btn-card-edit {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid var(--neon-purple);
            color: white;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-card-edit:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple);
        }

        /* Modal (Matching Pic 3 Exactly) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f0a19;
            width: 100%;
            max-width: 820px;
            border: 1.5px solid var(--neon-purple);
            border-radius: 12px;
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
        }

        .modal-body {
            padding: 20px 25px;
            overflow-y: auto;
        }

        .styled-input {
            width: 100%;
            background: #07030b;
            border: 1px solid #2d2640;
            color: white;
            padding: 10px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .styled-input:focus {
            border-color: var(--neon-purple);
        }

        /* Package Rows Header & Content */
        .package-header-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.3fr 1fr 1fr 1fr 45px;
            gap: 10px;
            margin-bottom: 6px;
        }

        .package-row {
            display: grid;
            grid-template-columns: 0.9fr 1.3fr 1fr 1fr 1fr 45px;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        .btn-add-pkg {
            background: var(--neon-purple);
            color: white;
            padding: 7px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-add-pkg:hover {
            opacity: 0.9;
        }

        .btn-remove-pkg {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            height: 42px;
            width: 100%;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-remove-pkg:hover {
            background: #ef4444;
            color: white;
        }

        /* Modal Footer Buttons */
        .btn-save {
            background: var(--neon-pink);
            color: white;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
        }

        .btn-cancel {
            background: #4b5563;
            color: white;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }

        .btn-delete-modal {
            background: var(--neon-red);
            color: white;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-delete-modal:hover {
            background: #dc2626;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="btn-nav">BACK</a>
        <div class="orbitron text-lg font-bold tracking-widest text-white">MANAGE PC PANEL</div>
        <div style="width: 70px;"></div>
    </nav>

    <!-- Video Link Manager -->
    <div class="video-manager">
        <label class="orbitron text-[11px] text-purple-400 block mb-2 uppercase tracking-wider">PC Setup Video URL</label>
        <div class="flex gap-3">
            <input type="text" id="videoUrlInput" class="styled-input" placeholder="YouTube or Drive Link...">
            <button onclick="saveVideoUrl()" class="btn-save whitespace-nowrap">UPDATE</button>
        </div>
    </div>

    <!-- Section Header -->
    <div class="px-6 mt-6 flex justify-between items-center">
        <h2 class="orbitron text-lg text-white font-bold">PRODUCTS</h2>
        <button onclick="openModal('add')" class="btn-add-pkg">+ ADD PRODUCT</button>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid">
        <!-- Products will load dynamically -->
    </div>

    <!-- Add / Edit Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="p-5 border-b border-gray-800 flex justify-between items-center">
                <h2 class="orbitron text-lg text-white font-bold" id="modalTitle">Edit PC Panel</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <div class="mb-5">
                    <label class="text-[11px] text-gray-400 uppercase font-semibold block mb-1">Panel Name</label>
                    <input type="text" id="pTitle" class="styled-input" placeholder="Enter Panel Name">
                </div>

                <div class="mb-6">
                    <label class="text-[11px] text-gray-400 uppercase font-semibold block mb-1">Image URL</label>
                    <input type="text" id="pImage" class="styled-input" placeholder="Enter Image URL">
                </div>

                <!-- Packages Section -->
                <div class="flex justify-between items-center mb-3">
                    <h3 class="orbitron text-sm text-white font-bold">Packages</h3>
                    <button onclick="addPackageRow()" class="btn-add-pkg">+ Add Package</button>
                </div>
                <hr class="border-gray-800 mb-4">

                <!-- Dynamic Column Titles -->
                <div class="package-header-grid text-[11px] text-gray-400 uppercase px-1">
                    <div>Duration</div>
                    <div>Unit</div>
                    <div>Old Price</div>
                    <div>Sale Price</div>
                    <div>Buy Price</div>
                    <div></div>
                </div>

                <div id="packageContainer">
                    <!-- Dynamic package rows insert here -->
                </div>
            </div>

            <!-- Modal Footer (Delete button on left of Cancel) -->
            <div class="p-4 border-t border-gray-800 flex justify-between items-center bg-[#0f0a19]">
                <div>
                    <button id="modalDeleteBtn" onclick="deleteCurrentProduct()" class="btn-delete-modal hidden">Delete Product</button>
                </div>
                <div class="flex gap-3">
                    <button onclick="closeModal()" class="btn-cancel">Cancel</button>
                    <button id="saveBtn" class="btn-save">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentEditId = null;

        // Video Manager
        window.saveVideoUrl = () => {
            const url = document.getElementById('videoUrlInput').value;
            set(ref(db, 'settings/video_pc'), url).then(() => alert("Video Link Updated!"));
        };

        onValue(ref(db, 'settings/video_pc'), (snapshot) => {
            if(snapshot.exists()) document.getElementById('videoUrlInput').value = snapshot.val();
        });

        // Smart Helper to Parse Old/New Duration formats safely
        function parseDuration(pkg) {
            let val = pkg.durationValue !== undefined ? pkg.durationValue : "";
            let unit = pkg.durationUnit || "Hours";

            if (!val && pkg.duration) {
                const parts = String(pkg.duration).trim().split(/\s+/);
                if (parts.length >= 2) {
                    val = parts[0];
                    unit = parts[1];
                } else if (parts.length === 1 && !isNaN(parts[0])) {
                    val = parts[0];
                } else {
                    unit = pkg.duration;
                }
            }
            return { val, unit };
        }

        // Add Package Row
        window.addPackageRow = (d = {}) => {
            const container = document.getElementById('packageContainer');
            const row = document.createElement('div');
            row.className = 'package-row';
            
            const parsed = parseDuration(d);
            const val = parsed.val !== undefined ? parsed.val : '';
            const unit = parsed.unit || 'Hours';

            row.innerHTML = `
                <div>
                    <input type="number" class="styled-input pkg-val" value="${val}" placeholder="1">
                </div>
                <div>
                    <select class="styled-input pkg-unit">
                        <option value="Hours" ${unit==='Hours'?'selected':''}>Hours</option>
                        <option value="Days" ${unit==='Days'?'selected':''}>Days</option>
                        <option value="Months" ${unit==='Months'?'selected':''}>Months</option>
                        <option value="Lifetime" ${unit==='Lifetime'?'selected':''}>Lifetime</option>
                    </select>
                </div>
                <div>
                    <input type="number" class="styled-input pkg-old" value="${d.old || ''}" placeholder="Old Price">
                </div>
                <div>
                    <input type="number" class="styled-input pkg-sell" value="${d.sell || ''}" placeholder="Sale Price">
                </div>
                <div>
                    <input type="number" class="styled-input pkg-buy" value="${d.buy || ''}" placeholder="Buy Price">
                </div>
                <button onclick="this.parentElement.remove()" class="btn-remove-pkg"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(row);
        };

        // Modal Controls
        window.openModal = (mode, id = null) => {
            currentEditId = id;
            document.getElementById('packageContainer').innerHTML = '';
            const delBtn = document.getElementById('modalDeleteBtn');

            if(mode === 'add') {
                document.getElementById('modalTitle').innerText = "Add New Product";
                document.getElementById('pTitle').value = '';
                document.getElementById('pImage').value = '';
                delBtn.classList.add('hidden');
                addPackageRow();
                document.getElementById('saveBtn').onclick = () => saveProduct('add');
            } else {
                document.getElementById('modalTitle').innerText = "Edit PC Panel";
                delBtn.classList.remove('hidden');
            }
            document.getElementById('productModal').style.display = 'flex';
        };

        window.closeModal = () => {
            document.getElementById('productModal').style.display = 'none';
        };

        // Save Logic
        function saveProduct(mode) {
            const title = document.getElementById('pTitle').value;
            const image = document.getElementById('pImage').value;

            let packages = [];
            document.querySelectorAll('.package-row').forEach(row => {
                const val = row.querySelector('.pkg-val').value;
                const unit = row.querySelector('.pkg-unit').value;
                const old = row.querySelector('.pkg-old').value;
                const sell = row.querySelector('.pkg-sell').value;
                const buy = row.querySelector('.pkg-buy').value;

                if(sell) {
                    packages.push({
                        duration: `${val} ${unit}`.trim(),
                        durationValue: val,
                        durationUnit: unit,
                        old_price: old,
                        sell_price: sell,
                        buy_price: buy
                    });
                }
            });

            const data = { title, image, packages };

            if(mode === 'add') {
                push(ref(db, 'pc_panels'), data).then(closeModal);
            } else {
                update(ref(db, `pc_panels/${currentEditId}`), data).then(closeModal);
            }
        }

        // Delete from Modal Footer
        window.deleteCurrentProduct = () => {
            if(currentEditId && confirm("Are you sure you want to delete this panel?")) {
                remove(ref(db, `pc_panels/${currentEditId}`)).then(closeModal);
            }
        };

        // Render Product Cards
        onValue(ref(db, 'pc_panels'), (snapshot) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(id => {
                    const p = data[id];
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div>
                            <img src="${p.image}" class="product-image" onerror="this.src='https://placehold.co/400x200?text=No+Image'">
                            <h3 class="product-title truncate">${p.title}</h3>
                        </div>
                        <button onclick="editProduct('${id}')" class="btn-card-edit">EDIT PANEL</button>
                    `;
                    grid.appendChild(card);
                });
            }
        });

        // Edit Handler
        window.editProduct = (id) => {
            onValue(ref(db, `pc_panels/${id}`), (snapshot) => {
                const p = snapshot.val();
                openModal('edit', id);
                document.getElementById('pTitle').value = p.title || '';
                document.getElementById('pImage').value = p.image || '';

                const container = document.getElementById('packageContainer');
                container.innerHTML = '';
                if(p.packages && Array.isArray(p.packages)) {
                    p.packages.forEach(pkg => {
                        addPackageRow({
                            val: pkg.durationValue,
                            unit: pkg.durationUnit,
                            duration: pkg.duration,
                            old: pkg.old_price,
                            sell: pkg.sell_price,
                            buy: pkg.buy_price
                        });
                    });
                } else {
                    addPackageRow();
                }
                document.getElementById('saveBtn').onclick = () => saveProduct('edit');
            }, { onlyOnce: true });
        };
    </script>
</body>
</html>
