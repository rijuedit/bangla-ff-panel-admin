<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage PC Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-dark: #07030b;
            --card-bg: #110c1d;
            --neon-purple: #a855f7;
            --neon-pink: #ff007f;
            --neon-green: #00ff7f;
            --neon-red: #ef4444;
            --text-gray: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* Navbar */
        .navbar {
            background: rgba(17, 12, 29, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--neon-purple);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--neon-purple);
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* Video Section Manager */
        .video-manager {
            background: var(--card-bg);
            border: 1px solid #2d2640;
            border-radius: 12px;
            padding: 20px;
            margin: 20px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid #2d2640;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
            position: relative;
        }

        .product-card:hover {
            border-color: var(--neon-purple);
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid #2d2640;
        }

        /* Modal Design matching Screenshot */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f0a19;
            width: 100%;
            max-width: 800px;
            border: 1.5px solid var(--neon-purple);
            border-radius: 12px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            padding-bottom: 80px; /* space for footer */
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #2d2640;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .input-label {
            display: block;
            color: var(--text-gray);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .styled-input {
            width: 100%;
            background: #07030b;
            border: 1px solid #2d2640;
            color: white;
            padding: 12px;
            border-radius: 6px;
            outline: none;
        }

        .styled-input:focus {
            border-color: var(--neon-purple);
        }

        /* Package Row Styling */
        .package-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr 1fr 1fr 50px;
            gap: 10px;
            align-items: end;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 10px;
        }

        .btn-add-pkg {
            background: var(--neon-purple);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            margin: 10px 20px;
            font-weight: bold;
        }

        .btn-remove-pkg {
            background: var(--neon-red);
            color: white;
            height: 45px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f0a19;
            padding: 15px 20px;
            border-top: 1px solid #2d2640;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn-save { background: var(--neon-pink); color: white; padding: 10px 25px; border-radius: 6px; font-weight: bold; }
        .btn-cancel { background: #4b5563; color: white; padding: 10px 25px; border-radius: 6px; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left mr-2"></i>Back</a>
        <div class="orbitron text-xl font-bold tracking-widest text-white">MANAGE PC PANEL</div>
        <div style="width: 80px;"></div>
    </nav>

    <!-- Video Manager -->
    <div class="video-manager">
        <h3 class="orbitron text-purple-400 mb-4 uppercase text-sm">PC Setup Tutorial Video</h3>
        <div class="flex gap-3">
            <input type="text" id="videoUrlInput" class="styled-input" placeholder="Enter YouTube or Google Drive Link...">
            <button onclick="saveVideoUrl()" class="btn-save whitespace-nowrap">UPDATE VIDEO</button>
        </div>
    </div>

    <div class="flex justify-between items-center px-6 mt-6">
        <h2 class="orbitron text-xl text-white">Product List</h2>
        <button onclick="openModal('add')" class="btn-add-pkg m-0">+ Add New Product</button>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid">
        <!-- Products will load here -->
    </div>

    <!-- Dynamic Modal (Add/Edit) -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="orbitron text-lg font-bold" id="modalTitle">Add New Product</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>

            <div class="mt-6">
                <div class="input-group">
                    <label class="input-label uppercase">Panel Name</label>
                    <input type="text" id="pTitle" class="styled-input" placeholder="Enter Panel Name">
                </div>
                <div class="input-group">
                    <label class="input-label uppercase">Image URL</label>
                    <input type="text" id="pImage" class="styled-input" placeholder="Enter Image URL">
                </div>
                <div class="input-group">
                    <label class="input-label uppercase">Download / Key Link</label>
                    <input type="text" id="pDownload" class="styled-input" placeholder="Enter link for user download...">
                </div>

                <div class="px-5 mb-2 flex justify-between items-center">
                    <h3 class="orbitron text-sm text-purple-400 uppercase">Packages</h3>
                </div>
                <hr class="border-gray-800 mx-5 mb-4">

                <div id="packageContainer">
                    <!-- Dynamic Rows will appear here -->
                </div>

                <button onclick="addPackageRow()" class="btn-add-pkg">+ Add Package</button>
            </div>

            <div class="modal-footer">
                <button onclick="closeModal()" class="btn-cancel uppercase">Cancel</button>
                <button id="saveBtn" class="btn-save uppercase">Save Product</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentEditId = null;

        // --- Video Management ---
        window.saveVideoUrl = function() {
            const url = document.getElementById('videoUrlInput').value;
            set(ref(db, 'settings/video_pc'), url)
                .then(() => alert("Video Link Updated!"))
                .catch(err => alert("Error: " + err.message));
        };

        onValue(ref(db, 'settings/video_pc'), (snapshot) => {
            if(snapshot.exists()) document.getElementById('videoUrlInput').value = snapshot.val();
        });

        // --- Package Row Logic ---
        window.addPackageRow = function(data = {}) {
            const container = document.getElementById('packageContainer');
            const row = document.createElement('div');
            row.className = 'package-row';
            row.innerHTML = `
                <div>
                    <label class="input-label text-[10px]">Duration</label>
                    <input type="number" class="styled-input pkg-val" value="${data.val || ''}" placeholder="0">
                </div>
                <div>
                    <label class="input-label text-[10px]">&nbsp;</label>
                    <select class="styled-input pkg-unit">
                        <option value="Hours" ${data.unit==='Hours'?'selected':''}>Hours</option>
                        <option value="Days" ${data.unit==='Days'?'selected':''}>Days</option>
                        <option value="Months" ${data.unit==='Months'?'selected':''}>Months</option>
                        <option value="Lifetime" ${data.unit==='Lifetime'?'selected':''}>Lifetime</option>
                    </select>
                </div>
                <div>
                    <label class="input-label text-[10px]">Old Price</label>
                    <input type="number" class="styled-input pkg-old" value="${data.old || ''}" placeholder="৳">
                </div>
                <div>
                    <label class="input-label text-[10px]">Sale Price</label>
                    <input type="number" class="styled-input pkg-sell" value="${data.sell || ''}" placeholder="৳">
                </div>
                <div>
                    <label class="input-label text-[10px]">Buy Price</label>
                    <input type="number" class="styled-input pkg-buy" value="${data.buy || ''}" placeholder="৳">
                </div>
                <button onclick="this.parentElement.remove()" class="btn-remove-pkg"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(row);
        };

        // --- Modal Control ---
        window.openModal = function(mode, id = null) {
            const modal = document.getElementById('productModal');
            const container = document.getElementById('packageContainer');
            container.innerHTML = ''; // reset
            currentEditId = id;
            
            if(mode === 'add') {
                document.getElementById('modalTitle').innerText = "Add New Product";
                document.getElementById('pTitle').value = '';
                document.getElementById('pImage').value = '';
                document.getElementById('pDownload').value = '';
                addPackageRow(); // add one empty row
                document.getElementById('saveBtn').onclick = () => saveProduct('add');
            }
            modal.style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('productModal').style.display = 'none';
        };

        // --- CRUD Operations ---
        function saveProduct(mode) {
            const title = document.getElementById('pTitle').value;
            const image = document.getElementById('pImage').value;
            const download = document.getElementById('pDownload').value;
            
            const packageRows = document.querySelectorAll('.package-row');
            let packages = [];
            
            packageRows.forEach(row => {
                const val = row.querySelector('.pkg-val').value;
                const unit = row.querySelector('.pkg-unit').value;
                const old = row.querySelector('.pkg-old').value;
                const sell = row.querySelector('.pkg-sell').value;
                const buy = row.querySelector('.pkg-buy').value;
                
                if(sell) {
                    packages.push({
                        duration: `${val} ${unit}`,
                        durationValue: val,
                        durationUnit: unit,
                        old_price: old,
                        sell_price: sell,
                        buy_price: buy
                    });
                }
            });

            const data = { title, image, downloadLink: download, packages };

            if(mode === 'add') {
                push(ref(db, 'pc_panels'), data).then(() => { closeModal(); });
            } else {
                update(ref(db, `pc_panels/${currentEditId}`), data).then(() => { closeModal(); });
            }
        }

        // --- Load & Render ---
        onValue(ref(db, 'pc_panels'), (snapshot) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(id => {
                    const p = data[id];
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${p.image}" class="product-image" onerror="this.src='https://placehold.co/400x200?text=No+Image'">
                        <div class="p-4">
                            <h3 class="orbitron text-md font-bold text-white mb-1 truncate">${p.title}</h3>
                            <p class="text-xs text-gray-400 mb-4">${p.packages ? p.packages.length : 0} Packages Active</p>
                            <div class="flex gap-2">
                                <button onclick="editProduct('${id}')" class="flex-1 bg-purple-600/20 border border-purple-500 text-purple-400 py-2 rounded text-xs hover:bg-purple-600 hover:text-white transition">EDIT</button>
                                <button onclick="deleteProduct('${id}')" class="bg-red-600/20 border border-red-500 text-red-400 px-3 py-2 rounded text-xs hover:bg-red-600 hover:text-white transition"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        });

        window.editProduct = function(id) {
            onValue(ref(db, `pc_panels/${id}`), (snapshot) => {
                const p = snapshot.val();
                openModal('edit', id);
                document.getElementById('modalTitle').innerText = "Edit PC Panel";
                document.getElementById('pTitle').value = p.title || '';
                document.getElementById('pImage').value = p.image || '';
                document.getElementById('pDownload').value = p.downloadLink || '';
                
                const container = document.getElementById('packageContainer');
                container.innerHTML = '';
                if(p.packages) {
                    p.packages.forEach(pkg => {
                        addPackageRow({
                            val: pkg.durationValue || pkg.duration.split(' ')[0],
                            unit: pkg.durationUnit || pkg.duration.split(' ')[1],
                            old: pkg.old_price,
                            sell: pkg.sell_price,
                            buy: pkg.buy_price
                        });
                    });
                }
                document.getElementById('saveBtn').onclick = () => saveProduct('edit');
            }, { onlyOnce: true });
        };

        window.deleteProduct = function(id) {
            if(confirm("Are you sure you want to delete this panel?")) {
                remove(ref(db, `pc_panels/${id}`));
            }
        };
    </script>
</body>
</html>
